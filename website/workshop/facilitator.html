<!-- negaWatt Belgium — facilitator console: create a session, watch the groups
     arrive, open the projector screen, print the fact cards. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console d'animation — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body class="ws-body">
<div class="ws-shell">

  <div class="ws-topbar">
    <a class="ws-topbar__brand" href="index.html">
      <img src="../assets/img/nW_BE_logo_square.png" alt="négaWatt Belgium">
      <span data-ui="facil.title"></span>
    </a>
    <span class="ws-topbar__spacer"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
  </div>

  <main class="ws-main">

    <div class="ws-panel" id="create-panel">
      <h1 data-ui="facil.create"></h1>
      <div class="ws-field">
        <label for="topic" data-ui="facil.topic"></label>
        <select class="ws-input" id="topic"></select>
      </div>
      <div class="ws-field" style="margin-top:12px">
        <label for="label" data-ui="facil.workshopName"></label>
        <input class="ws-input" id="label" maxlength="160" autocomplete="off"
               placeholder="Atelier Namur 2026">
        <p class="ws-help" id="slug-preview"></p>
      </div>
      <p class="ws-note ws-note--warn ws-hidden" id="error" style="margin-top:12px"></p>
      <button class="ws-btn" id="btn-create" style="margin-top:16px;width:100%"
              data-ui="facil.create"></button>
      <p class="ws-help" id="api-note" style="margin-top:12px"></p>
    </div>

    <div class="ws-panel ws-hidden" id="live-panel">
      <p class="ws-eyebrow" data-ui="facil.shareLink"></p>
      <p id="join-url" style="font-size:1.05rem;font-weight:700;word-break:break-all;
         color:var(--nw-teal-darker);margin:0 0 10px"></p>
      <button class="ws-btn" id="btn-copy" style="width:100%" data-ui="facil.copyLink"></button>

      <p class="ws-eyebrow" style="margin-top:20px" data-ui="facil.codeFallback"></p>
      <p class="ws-code" id="code" style="font-size:2.2rem;letter-spacing:.3em;margin:0"></p>

      <div class="ws-note" style="margin-top:14px">
        <strong data-ui="facil.keyLabel"></strong>
        <p class="small" id="admin-token" style="margin:6px 0 0;word-break:break-all"></p>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <a class="ws-btn" id="link-reveal" style="text-align:center;line-height:44px;
           text-decoration:none" data-ui="facil.openReveal"></a>
        <a class="ws-btn ws-btn--ghost" id="link-cards" style="text-align:center;
           line-height:44px;text-decoration:none" data-ui="facil.printCards"></a>
      </div>

      <h2 style="margin-top:22px" data-ui="facil.progress"></h2>
      <div class="ws-scroll">
        <table class="ws-table" id="groups-table"></table>
      </div>
      <p class="ws-help" id="waiting" data-ui="reveal.waiting"></p>
    </div>

  </main>
</div>

<script src="../data/levers_transport.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/api.js"></script>
<script src="../assets/js/workshop/facilitator.js"></script>
</body>
