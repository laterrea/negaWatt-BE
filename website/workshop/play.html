<!-- negaWatt Belgium — workshop participant interface.
     One lever per screen. The slider handle IS the 2050 endpoint of the
     historical curve. See docs/workshop_module.md -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atelier négaWatt — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body class="ws-body">
<div class="ws-shell">

  <div class="ws-topbar">
    <a class="ws-topbar__brand" href="index.html">
      <img src="../assets/img/nW_BE_logo_square.png" alt="négaWatt Belgium">
      <span data-ui="app.title"></span>
    </a>
    <span class="ws-topbar__spacer"></span>
    <span class="ws-badge ws-badge--quiet ws-hidden" id="status-badge"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
  </div>

  <main class="ws-main" id="screen-play">

    <div class="ws-identity ws-hidden" id="identity"></div>

    <div class="ws-progress">
      <span class="ws-progress__label" id="progress-label"></span>
      <span class="ws-topbar__spacer"></span>
      <span id="progress-dots" style="display:flex;gap:6px"></span>
    </div>

    <!-- The screen follows the order of the card (D71): the question, what it is
         about, the reference points, the answer, the condition it takes, and what
         the answer changes. -->

    <!-- 1. the question, 2. its introduction -->
    <div>
      <p class="ws-eyebrow" id="topic-title"></p>
      <h1 class="ws-question" id="question"></h1>
      <p class="ws-subtitle" id="subtitle"></p>
      <p class="ws-subtitle__source ws-hidden" id="subtitle-source"></p>
    </div>

    <!-- 3. reference points -->
    <section class="ws-facts">
      <h2 data-ui="play.facts.title"></h2>
      <div class="ws-facts__grid" id="facts"></div>
    </section>

    <!-- 4. the answer: the observed curve, and the slider that extends it to 2050 -->
    <section class="ws-answer">
      <h2 class="ws-section-title" data-ui="play.yourAnswer"></h2>

      <div class="ws-chart">
        <div id="chart" style="min-height:190px"></div>
        <div class="ws-chart__legend" id="chart-legend"></div>
        <p class="ws-chart__note" id="chart-note"></p>
      </div>

      <div class="ws-slider" id="slider-wrap">
        <p class="ws-slider__hint" data-ui="play.dragHint"></p>
        <input type="range" id="slider" aria-describedby="readout">
        <div class="ws-slider__scale">
          <span id="scale-min"></span>
          <span id="scale-max"></span>
        </div>
      </div>

      <!-- A question answered in parts (D61): one slider per part, built by
           play.js in place of the slider above. The readout below then shows
           the value the parts make together. -->
      <div class="ws-parts ws-hidden" id="parts"></div>

      <div class="ws-readout is-empty" id="readout" aria-live="polite">
        <span class="ws-readout__num" id="readout-num"></span>
        <span class="ws-readout__unit" id="readout-unit"></span>
      </div>
    </section>

    <!-- Opt-in per topic: `confidence: true` in the topic YAML. Off by default,
         so a session asks for the value and the condition only. -->
    <div class="ws-field ws-hidden" id="field-confidence">
      <span class="ws-field__label" data-ui="play.confidence.label"></span>
      <div class="ws-segmented" id="confidence" role="group"></div>
    </div>

    <!-- 5. « Pour que cela arrive, il faudrait que… » -->
    <div class="ws-field ws-field--condition">
      <label for="condition" data-ui="play.condition.label"></label>
      <textarea class="ws-textarea" id="condition" maxlength="280" rows="3"></textarea>
    </div>

    <!-- 6. « Ce que votre réponse change »: the answer read back in tangible terms,
         and what this lever alone does to the 2050 demand -->
    <section class="ws-leverage is-hidden" id="leverage">
      <h2 class="ws-leverage__label" data-ui="play.leverage.title"></h2>
      <p class="ws-leverage__tangible" id="readout-tangible"></p>
      <p class="ws-leverage__value" id="leverage-value"></p>
      <p class="ws-leverage__delta" id="leverage-delta"></p>
      <p class="ws-leverage__caveat" id="leverage-caveat" data-ui="play.leverage.caveat"></p>
    </section>

  </main>

  <main class="ws-main ws-hidden" id="screen-done">
    <div class="ws-panel">
      <h1 data-ui="play.done.title"></h1>
      <p data-ui="play.done.body"></p>
      <div class="ws-scroll">
        <table class="ws-table" id="summary-table"></table>
      </div>

      <!-- Opt-in per topic: `summaryChart:` in the topic YAML. One diverging bar
           per lever, showing what that answer alone does to the sector's 2050
           final demand against keeping today's level. -->
      <figure class="ws-effects ws-hidden" id="effects">
        <figcaption>
          <span class="ws-effects__title" id="effects-title"></span>
          <span class="ws-effects__caption" id="effects-caption"></span>
        </figcaption>
        <div id="effects-plot"></div>
        <p class="ws-effects__total" id="effects-total"></p>
        <p class="ws-effects__note" id="effects-note"></p>
      </figure>
    </div>
  </main>

  <div class="ws-actions" id="actions">
    <button class="ws-btn ws-btn--ghost" id="btn-back" data-ui="play.back"></button>
    <button class="ws-btn" id="btn-next"></button>
  </div>

</div>

<!-- One file per sector; a topic names its sector in workshop_content.js.
     Add a line here when a new sector gets a workshop topic. -->
<script src="../data/levers_transport.js"></script>
<script src="../data/levers_buildings.js"></script>
<script src="../data/history_transport.js"></script>
<script src="../data/history_buildings.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/spark.js"></script>
<script src="../assets/js/workshop/impact.js"></script>
<script src="../assets/js/workshop/api.js"></script>
<script src="../assets/js/workshop/order.js"></script>
<script src="../assets/js/workshop/play.js"></script>
</body>
