<!-- negaWatt Belgium — workshop entry point: pick a topic and start. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atelier négaWatt — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body class="ws-body">
<div class="ws-shell">

  <div class="ws-topbar">
    <span class="ws-topbar__brand">
      <img src="../assets/img/nW_BE_logo_square.png" alt="négaWatt Belgium">
      <span data-ui="app.title"></span>
    </span>
    <span class="ws-topbar__spacer"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
  </div>

  <main class="ws-main">

    <div>
      <p class="ws-eyebrow" data-ui="app.tagline"></p>
      <h1 class="ws-question" data-ui="start.title"></h1>
      <p class="ws-subtitle" data-ui="start.lead"></p>
    </div>

    <div class="ws-panel">
      <!-- hidden when the content bundle carries a single topic: nothing to pick -->
      <div class="ws-field ws-hidden" id="topic-field">
        <label for="topic" data-ui="start.topicLabel"></label>
        <select class="ws-input" id="topic"></select>
      </div>
      <div class="ws-field" id="name-field">
        <label for="name" data-ui="start.groupLabel"></label>
        <input class="ws-input" id="name" maxlength="80" autocomplete="off">
      </div>
      <p class="ws-note ws-note--warn ws-hidden" id="error" style="margin-top:14px"></p>
      <button class="ws-btn" id="btn-start" style="margin-top:16px;width:100%"
              data-ui="start.go"></button>
    </div>

    <!-- For whoever runs the room. Not a participant destination, but there is no
         separate console any more, so the two links live here. -->
    <div class="ws-panel">
      <p class="ws-eyebrow" data-ui="start.facilitator"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <a class="ws-btn ws-btn--ghost" id="link-reveal" style="text-align:center;
           line-height:44px;text-decoration:none" data-ui="start.openReveal"></a>
        <a class="ws-btn ws-btn--ghost" id="link-cards" style="text-align:center;
           line-height:44px;text-decoration:none" data-ui="start.printCards"></a>
      </div>
      <p class="ws-help" id="api-note"></p>
    </div>

  </main>
</div>

<!-- One file per sector; a topic names its sector in workshop_content.js.
     Add a line here when a new sector gets a workshop topic. -->
<script src="../data/levers_transport.js"></script>
<script src="../data/levers_buildings.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/api.js"></script>
<script src="../assets/js/workshop/join.js"></script>
</body>
