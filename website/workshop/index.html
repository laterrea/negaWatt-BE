<!-- negaWatt Belgium — workshop entry point: join by code, or create a session. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atelier négaWatt — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body class="ws-body">
<div class="ws-shell">

  <div class="ws-topbar">
    <span class="ws-topbar__brand">
      <img src="../assets/img/nW_BE_logo_square.png" alt="négaWatt Belgium">
      <span data-ui="app.title"></span>
    </span>
    <span class="ws-topbar__spacer"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
  </div>

  <main class="ws-main">

    <div>
      <p class="ws-eyebrow" data-ui="app.tagline"></p>
      <h1 class="ws-question" data-ui="join.title"></h1>
      <p class="ws-subtitle" data-ui="join.lead"></p>
    </div>

    <div class="ws-panel">
      <div class="ws-field">
        <label for="code" data-ui="join.codeLabel"></label>
        <input class="ws-input ws-code" id="code" maxlength="8" autocapitalize="characters"
               autocomplete="off" spellcheck="false" inputmode="text"
               style="text-align:center">
      </div>
      <div class="ws-field" style="margin-top:14px">
        <label for="name" data-ui="join.groupLabel"></label>
        <input class="ws-input" id="name" maxlength="80" autocomplete="off">
      </div>
      <p class="ws-note ws-note--warn ws-hidden" id="error" style="margin-top:14px"></p>
      <button class="ws-btn" id="btn-join" style="margin-top:16px;width:100%"
              data-ui="join.start"></button>
    </div>

    <details class="ws-panel">
      <summary style="cursor:pointer;font-weight:700" data-ui="join.solo"></summary>
      <p class="ws-help" style="margin-top:10px" data-ui="join.soloHint"></p>
      <div class="ws-field" style="margin-top:10px">
        <label for="solo-topic" data-ui="facil.topic"></label>
        <select class="ws-input" id="solo-topic"></select>
      </div>
      <button class="ws-btn ws-btn--ghost" id="btn-solo"
              style="margin-top:12px;width:100%" data-ui="join.solo"></button>
    </details>

    <p class="ws-help" id="api-note"></p>

  </main>
</div>

<!-- One file per sector; a topic names its sector in workshop_content.js.
     Add a line here when a new sector gets a workshop topic. -->
<script src="../data/levers_transport.js"></script>
<script src="../data/levers_buildings.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/api.js"></script>
<script src="../assets/js/workshop/join.js"></script>
</body>
