<!-- negaWatt Belgium — printable discussion cards, one A5 card per lever.
     Print to A4 portrait: two cards per page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiches de discussion — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body>
<div class="ws-cards">
  <div class="ws-cards__toolbar">
    <strong data-ui="cards.title"></strong>
    <span class="ws-topbar__spacer" style="flex:1"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
    <button class="ws-btn ws-btn--ghost" id="btn-print" style="flex:0 0 auto">⎙</button>
  </div>
  <div class="ws-cards__grid" id="cards"></div>
</div>

<script src="../data/levers_transport.js"></script>
<script src="../data/history_transport.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/cards.js"></script>
</body>
