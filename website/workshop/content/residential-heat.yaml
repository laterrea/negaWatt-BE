# =============================================================================
# negaWatt-BE workshop — topic: residential heat
#
# HAND-EDITED. Wording, facts and justifications live here; every *number* comes
# either from the notebook (as a {placeholder}, resolved at build time from the
# lever's `facts` block in website/data/levers_buildings.js) or from an external
# source quoted with its URL.
#
# Built by scripts/build_workshop_content.py, which refuses to build if a string
# is missing a language, a fact has no source, a placeholder does not resolve, or
# the lever ids here and in the notebook export disagree.
#
# NOTE: the Dutch was written by the implementer, not a native speaker, and needs
# a review pass before a real workshop (docs/workshop_module.md, Q5).
# =============================================================================

topic: residential-heat
sector: buildings

title:
  fr: Chaleur des logements
  nl: Warmte in woningen
  en: Residential heat

lead:
  fr: >
    Chauffer, rafraîchir, laver et cuisiner dans les logements belges. Les
    bâtiments tertiaires font l'objet d'un autre atelier.
  nl: >
    Verwarmen, koelen, wassen en koken in Belgische woningen. De tertiaire
    gebouwen komen in een andere workshop aan bod.
  en: >
    Heating, cooling, washing and cooking in Belgian homes. Non-residential
    buildings are the subject of a separate workshop.

intro:
  fr: >
    Vous allez fixer huit hypothèses de comportement et de politique publique pour
    2050 — celles qui *produisent* les chiffres d'énergie du scénario négaWatt pour
    le logement. Vous ne connaissez pas encore les valeurs retenues par négaWatt :
    à vous de décider ce qui vous paraît à la fois souhaitable et atteignable.
    Chaque question tient sur un écran, avec quelques repères factuels pour
    nourrir la discussion.
  nl: >
    Jullie stellen acht gedrags- en beleidsveronderstellingen voor 2050 vast —
    precies die welke de energiecijfers van het negaWatt-scenario voor woningen
    *voortbrengen*. De waarden van negaWatt kennen jullie nog niet: beslis zelf wat
    jullie zowel wenselijk als haalbaar vinden. Elke vraag past op één scherm, met
    een paar feitelijke referentiepunten voor de discussie.
  en: >
    You are going to set eight behavioural and policy assumptions for 2050 — the
    ones that *produce* the negaWatt scenario's energy figures for housing. You do
    not yet know the values negaWatt chose: decide what strikes you as both
    desirable and achievable. Each question fits on one screen, with a few factual
    anchors to feed the discussion.

# -----------------------------------------------------------------------------
# Interface strings this topic adds. A key already defined in ui.yaml or in
# another topic is an error, not a silent override (D35), so every unit below is
# spelled to be unmistakably residential.
strings:
  "unit.m² of home per person":
    fr: m² de logement/pers.
    nl: m² woning/pers.
    en: m² of home per person
  "unit.% of homes renovated per year":
    fr: "% du parc/an"
    nl: "% van het bestand/jaar"
    en: "% of the stock/year"
  "unit.% of the heating need cut":
    fr: "% du besoin en moins"
    nl: "% minder warmtevraag"
    en: "% less heating need"
  "unit.°C less on the home thermostat":
    fr: "°C en moins"
    nl: "°C minder"
    en: "°C less"
  "unit.kWh/person/year of home hot water":
    fr: kWh/pers./an
    nl: kWh/pers./jaar
    en: kWh/person/year
  "unit.kWh/m²/year of home cooling":
    fr: kWh de froid/m²/an
    nl: kWh koeling/m²/jaar
    en: kWh of cooling/m²/year
  "unit.kWh/household/year of home cooking":
    fr: kWh/ménage/an
    nl: kWh/huishouden/jaar
    en: kWh/household/year
  "unit.% of home heat":
    fr: "% de la chaleur des logements"
    nl: "% van de warmte in woningen"
    en: "% of home heat"

# The +/- effects chart on the summary screen. Opt-in per topic (D40). Every
# lever here carries an `impact` response; `district-heat` declares its as
# "negligible", so its row says so in words instead of drawing a bar (D50).
summaryChart:
  enabled: true
  unit: TWh
  decimals: 2
  caption:
    fr: >
      Ce que chacune de vos réponses fait, à elle seule, à la demande d'énergie thermique
      des logements belges en 2050 — chauffage, froid, eau chaude et cuisson — par rapport
      au maintien du niveau d'aujourd'hui pour le même indicateur.
    nl: >
      Wat elk van jullie antwoorden op zichzelf doet met de thermische energievraag van de
      Belgische woningen in 2050 — verwarming, koeling, warm water en koken — vergeleken met
      het behoud van het huidige niveau voor dezelfde indicator.
    en: >
      What each of your answers does, on its own, to the thermal energy demand of Belgian
      homes in 2050 — heating, cooling, hot water and cooking — compared with keeping
      today's level of the same indicator.
  note:
    fr: >
      Chaque barre est exacte pour son levier pris seul, les sept autres restant à leur
      valeur du scénario. Les leviers se combinent de façon multiplicative, donc leur somme
      n'est qu'un ordre de grandeur. Les réseaux de chaleur ne déplacent aucune barre : ils
      changent la source de la chaleur, pas la quantité.
    nl: >
      Elke balk is exact voor zijn eigen hefboom alleen, met de zeven andere op hun
      scenariowaarde. De hefbomen werken multiplicatief samen, dus hun som is enkel een
      grootteorde. Warmtenetten verplaatsen geen enkele balk: ze veranderen de bron van de
      warmte, niet de hoeveelheid.
    en: >
      Each bar is exact for its own lever taken alone, with the other seven left at their
      scenario value. The levers compound multiplicatively, so their sum is an order of
      magnitude only. District heating moves no bar at all: it changes where the heat comes
      from, not how much of it is needed.

# -----------------------------------------------------------------------------
levers:

  # ------------------------------------------------------------ 1 -------------
  floor-area:
    short:
      fr: Surface du logement
      nl: Woonoppervlakte
      en: Home floor area
    question:
      fr: "Quelle surface de logement par personne est un objectif 2050 réaliste ?"
      nl: "Welke woonoppervlakte per persoon is een realistisch doel voor 2050?"
      en: "What home floor area per person is a realistic 2050 objective?"
    subtitle:
      fr: "Surface utile de l'ensemble du parc de logements, divisée par la population."
      nl: "Nuttige oppervlakte van het hele woningbestand, gedeeld door de bevolking."
      en: "Useful floor area of the whole dwelling stock, divided by the population."
    tangible:
      fr: "{value} m² pour chaque personne du ménage, à chauffer tout l'hiver."
      nl: "{value} m² voor elk lid van het huishouden, de hele winter te verwarmen."
      en: "{value} m² for every member of the household, heated all winter."
    facts:
      - kind: trend
        text:
          fr: >
            En hausse lente, et sans interruption depuis 2013 : 53,2 m² par personne en
            2000, {refValue} en 2019, 55,3 en 2023. Les ménages rétrécissent, mais les
            logements ne suivent pas.
          nl: >
            Langzaam stijgend, en zonder onderbreking sinds 2013: 53,2 m² per persoon in
            2000, {refValue} in 2019, 55,3 in 2023. De huishoudens krimpen, maar de
            woningen volgen niet.
          en: >
            Rising slowly, and without interruption since 2013: 53.2 m² per person in
            2000, {refValue} in 2019, 55.3 in 2023. Households are shrinking, but
            dwellings are not following.
        source: JRC-IDEES-2023 (Belgium), floor areas from the EU Building Observatory; population Statbel
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: structure
        text:
          fr: >
            Le ménage belge moyen occupe {m2PerHousehold} m² pour {householdSize} personnes,
            et Statbel projette une taille de ménage en baisse à {householdSizeTarget}
            personnes en 2050 ({householdSizeChangePct} %). Chauffage et climatisation sont
            les deux postes qui suivent la surface : {areaDrivenTwh} TWh sur {thermalTwh},
            soit {areaDrivenSharePct} % de l'énergie thermique du logement.
          nl: >
            Het gemiddelde Belgische huishouden bewoont {m2PerHousehold} m² voor
            {householdSize} personen, en Statbel projecteert een daling van de
            huishoudgrootte naar {householdSizeTarget} personen in 2050
            ({householdSizeChangePct} %). Verwarming en koeling zijn de twee posten die de
            oppervlakte volgen: {areaDrivenTwh} TWh op {thermalTwh}, ofwel
            {areaDrivenSharePct} % van de thermische energie van de woning.
          en: >
            The average Belgian household occupies {m2PerHousehold} m² for
            {householdSize} people, and Statbel projects household size falling to
            {householdSizeTarget} people by 2050 ({householdSizeChangePct}%). Heating and
            cooling are the two services that follow floor area: {areaDrivenTwh} TWh out of
            {thermalTwh}, or {areaDrivenSharePct}% of the home's thermal energy.
        source: nW-BE §1.2.1 and §2.1 (JRC-IDEES-2023, Statbel projections)
      - kind: benchmark
        text:
          fr: >
            Sur une base voisine — les pièces, pas les mètres carrés — la Belgique est
            largement au-dessus de la moyenne : 2,1 pièces par personne en 2024, contre 1,7
            dans l'UE27, 1,7 en Allemagne et 1,8 en France.
          nl: >
            Op een verwante basis — kamers, niet vierkante meters — zit België ruim boven
            het gemiddelde: 2,1 kamers per persoon in 2024, tegenover 1,7 in de EU27, 1,7 in
            Duitsland en 1,8 in Frankrijk.
          en: >
            On a neighbouring basis — rooms, not square metres — Belgium sits well above the
            average: 2.1 rooms per person in 2024, against 1.7 in the EU27, 1.7 in Germany
            and 1.8 in France.
        source: "Eurostat, ilc_lvho03 (average number of rooms per person), 2024"
        url: https://ec.europa.eu/eurostat/databrowser/view/ilc_lvho03/default/table
        chart:
          kind: bars
          unit: rooms/person
          decimals: 1
          highlight: 3
          labels:
            - {fr: UE27, nl: EU27, en: EU27}
            - {fr: Allemagne, nl: Duitsland, en: Germany}
            - {fr: France, nl: Frankrijk, en: France}
            - {fr: Belgique, nl: België, en: Belgium}
          y: [1.7, 1.7, 1.8, 2.1]
          caption:
            fr: Nombre moyen de pièces par personne, 2024
            nl: Gemiddeld aantal kamers per persoon, 2024
            en: Average number of rooms per person, 2024
      - kind: lever
        label:
          fr: Le gisement, chiffré
          nl: Het potentieel, becijferd
          en: The pool, quantified
        text:
          fr: >
            Au recensement 2021, 46,6 % des logements occupés en Belgique — 2,3 millions —
            offrent trois pièces ou plus par occupant. En Wallonie, l'IWEPS isole
            233 617 maisons occupées par un propriétaire de 65 ans ou plus : 99,6 % n'y
            abritent qu'une ou deux personnes, et 89 % comptent cinq pièces ou plus.
            Accueillir quelqu'un sous le même toit, ou couper la maison en deux logements
            (habitat kangourou, colocation, division), fait baisser la surface par personne
            sans poser une brique. Le frein est réglementaire plutôt que technique : diviser
            demande un permis communal, et le *statut de cohabitant* ampute les allocations
            de ceux qui s'installent ensemble.
          nl: >
            Bij de census 2021 telde 46,6 % van de bewoonde woningen in België — 2,3 miljoen
            — drie kamers of meer per bewoner. In Wallonië zondert het IWEPS
            233 617 huizen af die bewoond worden door een eigenaar van 65 jaar of ouder:
            99,6 % daarvan huisvest maar één of twee personen, en 89 % telt vijf kamers of
            meer. Iemand onder hetzelfde dak opnemen, of het huis in twee woningen opdelen
            (kangoeroewonen, samenhuizen, opdeling), verlaagt de oppervlakte per persoon
            zonder één steen te leggen. De rem is eerder regelgevend dan technisch: opdelen
            vergt een gemeentelijke vergunning, en het *statuut van samenwonende* snijdt in
            de uitkeringen van wie samen gaat wonen.
          en: >
            At the 2021 census, 46.6% of occupied dwellings in Belgium — 2.3 million — had
            three rooms or more per occupant. In Wallonia, IWEPS singles out 233,617 houses
            occupied by an owner aged 65 or over: 99.6% of them hold only one or two people,
            and 89% have five rooms or more. Taking someone in under the same roof, or
            splitting the house into two dwellings (kangaroo housing, house-sharing,
            subdivision), lowers floor area per person without laying a brick. The obstacle
            is regulatory rather than technical: subdividing needs a municipal permit, and
            the *cohabitant status* cuts the benefits of people who move in together.
        source: "IWEPS, Décryptage n°10 — maisons occupées par leur propriétaire de 65 ans et plus (2026); Statbel, Census 2021, table T04_DRM"
        url: https://www.iweps.be/wp-content/uploads/2026/05/D10.pdf
      - kind: structure
        label:
          fr: Résidences secondaires
          nl: Tweede verblijven
          en: Second homes
        text:
          fr: >
            Le parc comprend des logements que personne n'habite à l'année. La côte belge
            compte à elle seule plus de 106 000 résidences secondaires (2023), occupées en
            moyenne 87 nuits par an, dont 74 par leurs propriétaires. Ces mètres carrés
            pèsent toute l'année dans la surface par personne ; leur chauffage, lui, ne suit
            pas — sans pour autant tomber à zéro, puisqu'on les tient hors gel l'hiver.
          nl: >
            Het bestand bevat woningen waar niemand het hele jaar woont. Alleen al de
            Belgische kust telt ruim 106 000 tweede verblijven (2023), gemiddeld 87 nachten
            per jaar bewoond, waarvan 74 door de eigenaars zelf. Die vierkante meters tellen
            het hele jaar mee in de oppervlakte per persoon; hun verwarming volgt niet —
            zonder daarom op nul te vallen, want ze worden vorstvrij gehouden in de winter.
          en: >
            The stock includes dwellings nobody lives in year-round. The Belgian coast alone
            counts more than 106,000 second homes (2023), occupied on average 87 nights a
            year, 74 of them by the owners themselves. Those square metres weigh on the
            floor area per person all year; their heating does not follow — without falling
            to zero either, since they are kept frost-free through the winter.
        source: "Westtoer, Onderzoek tweede verblijfstoerisme aan de Kust, 2024"
        url: https://www.westtoer.be/over-ons/persmedia/persberichten/resultaten-onderzoek-tweede-verblijfstoerisme
      - kind: caution
        label:
          fr: Logements inoccupés
          nl: Leegstaande woningen
          en: Vacant dwellings
        text:
          fr: >
            Les logements vides comptent aussi — et ils sont moins nombreux que le débat ne
            le laisse croire. Bruxelles a croisé le cadastre, le Registre national et les
            faibles consommations d'eau de Vivaqua : 4 500 logements présumés inoccupés,
            moins de 2 % du parc régional, en dessous des prévisions. Les remettre sur le
            marché ne fait pas baisser la surface par personne — ni le parc ni la population
            ne changent — mais loge des habitants sans rien construire.
          nl: >
            Leegstaande woningen tellen ook mee — en het zijn er minder dan het debat doet
            vermoeden. Brussel kruiste het kadaster, het Rijksregister en de lage
            waterverbruiken van Vivaqua: 4 500 vermoedelijk leegstaande woningen, minder dan
            2 % van het gewestelijke bestand, onder de verwachtingen. Ze terug op de markt
            brengen verlaagt de oppervlakte per persoon niet — bestand noch bevolking
            veranderen — maar huisvest mensen zonder te bouwen.
          en: >
            Empty dwellings count too — and there are fewer of them than the debate
            suggests. Brussels cross-checked the cadastre, the national register and
            Vivaqua's low-water-consumption records: 4,500 presumed-vacant dwellings, under
            2% of the regional stock, below what had been expected. Putting them back on the
            market does not lower floor area per person — neither the stock nor the
            population moves — but it houses people without building.
        source: "Bruxelles Logement / Brussels Studies Institute (BRIO-VUB, IGEAT-ULB), logements inoccupés (2024-11-22)"
        url: https://be.brussels/en/housing/4500-presumed-unoccupied-homes-brussels-capital-region
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario retient {changePct} % par personne. Comme les ménages rétrécissent
            en même temps, cela demande {householdChangePct} % par ménage, soit
            {m2PerHouseholdTarget} m² au lieu de {m2PerHousehold}.
          nl: >
            Het scenario kiest {changePct} % per persoon. Omdat de huishoudens tegelijk
            krimpen, vraagt dat {householdChangePct} % per huishouden, ofwel
            {m2PerHouseholdTarget} m² in plaats van {m2PerHousehold}.
          en: >
            The scenario settles on {changePct}% per person. Because households shrink at
            the same time, that requires {householdChangePct}% per household, i.e.
            {m2PerHouseholdTarget} m² instead of {m2PerHousehold}.
        source: nW-BE §1.2.1
    justification:
      fr: >
        négaWatt retient {targetValue} m² par personne, soit {changePct} % par rapport aux
        {refValue} m² de 2019 — un renversement de la tendance observée. L'objectif est
        double : réduire l'empreinte matérielle de la construction et la surface à chauffer
        et rafraîchir. Les leviers évoqués sont l'habitat partagé, le déménagement vers plus
        petit une fois les enfants partis, et l'habitat léger. Comme la taille des ménages
        recule de {householdSizeChangePct} % sur la même période (projection Statbel, non
        modifiable ici), la surface par ménage doit baisser plus vite que la surface par
        personne : {householdChangePct} %, soit {m2PerHouseholdTarget} m² par ménage.
      nl: >
        negaWatt kiest {targetValue} m² per persoon, ofwel {changePct} % tegenover de
        {refValue} m² van 2019 — een omkering van de waargenomen trend. Het doel is
        tweeledig: de materiaalvoetafdruk van de bouw verkleinen én de te verwarmen en te
        koelen oppervlakte. De genoemde hefbomen zijn cohousing, verhuizen naar kleiner
        zodra de kinderen het huis uit zijn, en lichte woonvormen. Omdat de huishoudgrootte
        in dezelfde periode met {householdSizeChangePct} % daalt (Statbel-projectie, hier
        niet aanpasbaar), moet de oppervlakte per huishouden sneller dalen dan die per
        persoon: {householdChangePct} %, ofwel {m2PerHouseholdTarget} m² per huishouden.
      en: >
        negaWatt settles on {targetValue} m² per person, i.e. {changePct}% against the
        {refValue} m² of 2019 — a reversal of the observed trend. The aim is twofold: cut
        the material footprint of construction and cut the area to be heated and cooled. The
        levers named are shared living, downsizing once the children have left, and light
        housing. Because household size falls {householdSizeChangePct}% over the same period
        (a Statbel projection, not adjustable here), floor area per household has to fall
        faster than floor area per person: {householdChangePct}%, i.e.
        {m2PerHouseholdTarget} m² per household.
    debate:
      fr: >
        C'est un chiffre rond, −10 %, appliqué à l'identique au résidentiel et au tertiaire,
        et le rapport lui-même note qu'il « devrait être davantage motivé » : aucune
        politique du logement n'est chiffrée, alors que la surface par personne monte depuis
        vingt ans dans toute l'Europe.
      nl: >
        Het is een rond getal, −10 %, identiek toegepast op woningen en tertiaire gebouwen,
        en het rapport merkt zelf op dat het "beter gemotiveerd zou moeten worden": geen
        enkel woonbeleid is becijferd, terwijl de oppervlakte per persoon in heel Europa al
        twintig jaar stijgt.
      en: >
        It is a round number, −10%, applied identically to housing and to non-residential
        buildings, and the report itself notes that it "should be further motivated": no
        housing policy is quantified, while floor area per person has been rising across
        Europe for twenty years.

  # ------------------------------------------------------------ 2 -------------
  # Two questions where there used to be one, on the same model assumption. The
  # first round asked for the 2050 stock average in kWh/m²: exact, with a real
  # observed curve, but a stock average per square metre is not a quantity anyone
  # at the table has a feel for, and it is not the form any renovation policy
  # takes. Section 2.1.1 now also reads the assumption as renovation activity --
  # how many dwellings a year, and how deep each one -- which is the same
  # arithmetic, so the reveal stays exact. See docs/workshop_module.md, D51.
  renovation-rate:
    short:
      fr: Rythme de rénovation
      nl: Renovatietempo
      en: Renovation rate
    question:
      fr: Quelle part du parc de logements faut-il rénover chaque année d'ici 2050 ?
      nl: Welk aandeel van het woningbestand moet er elk jaar gerenoveerd worden tot 2050?
      en: What share of the dwelling stock should be renovated every year to 2050?
    subtitle:
      fr: >
        En part de la surface habitable, et au sens des données du projet : une rénovation y
        est comptée quelle que soit sa profondeur, et la construction neuve est comptée à
        part. La profondeur fait l'objet de la question suivante.
      nl: >
        Als aandeel van de woonoppervlakte, en in de zin van de projectdata: een renovatie
        telt er mee ongeacht haar diepte, en nieuwbouw wordt apart geteld. De diepte is het
        onderwerp van de volgende vraag.
      en: >
        As a share of floor area, and on the project's data's count: a renovation is counted
        there whatever its depth, and new construction is counted separately. The depth is the
        next question.
    tangible:
      fr: "{value} % du parc rénové chaque année."
      nl: "{value} % van het bestand elk jaar gerenoveerd."
      en: "{value}% of the stock renovated every year."
    facts:
      - kind: trend
        label:
          fr: Ce que la rénovation a produit jusqu'ici
          nl: Wat renovatie tot nu toe heeft opgeleverd
          en: What renovation has delivered so far
        text:
          fr: >
            C'est le résultat que la rénovation doit produire, et il descend lentement : le
            besoin de chauffage du logement moyen passe de {intensity2000} kWh/m² en 2000 à
            {intensity2019} en 2019 sur la tendance ajustée, soit {improvementHist:abs} kWh/m²
            par an — une baisse de {intensityDropPct} % en vingt-trois ans. Les dents de scie
            sont la météo, pas l'isolation : le creux de 61,2 (2014) et le pic de 86,8 (2001)
            sont un hiver doux et un hiver froid.
          nl: >
            Dat is het resultaat dat renovatie moet opleveren, en het daalt traag: de
            warmtevraag van de gemiddelde woning gaat van {intensity2000} kWh/m² in 2000 naar
            {intensity2019} in 2019 op de aangepaste trend, ofwel {improvementHist:abs} kWh/m²
            per jaar — een daling van {intensityDropPct} % in drieëntwintig jaar. De zaagtanden
            zijn het weer, niet de isolatie: het dal van 61,2 (2014) en de piek van 86,8 (2001)
            zijn een zachte en een koude winter.
          en: >
            This is the result renovation has to produce, and it falls slowly: the average
            home's heating need goes from {intensity2000} kWh/m² in 2000 to {intensity2019} in
            2019 on the fitted trend, that is {improvementHist:abs} kWh/m² a year — a fall of
            {intensityDropPct}% over twenty-three years. The saw-teeth are the weather, not
            insulation: the trough of 61.2 (2014) and the peak of 86.8 (2001) are a mild and a
            cold winter.
        source: JRC-IDEES-2023 (Belgium), floor areas from the EU Building Observatory
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: res_heat_per_m2
          decimals: 1
          caption:
            fr: Besoin de chauffage du parc résidentiel belge, kWh/m² et par an, 2000-2023.
            nl: Warmtevraag van het Belgische woningbestand, kWh/m² per jaar, 2000-2023.
            en: Heating need of the Belgian dwelling stock, kWh/m² per year, 2000-2023.
      - kind: structure
        label:
          fr: Ce que compte un « taux de rénovation »
          nl: Wat een "renovatietempo" telt
          en: What a "renovation rate" counts
        text:
          fr: >
            Le mot recouvre plusieurs choses. Les données du projet enregistrent
            {renewalRateObs:d1} % du parc *renouvelé* chaque année : {renoRateObs} % de
            rénovation, à toute profondeur, plus {newBuildRateObs:d1} % de construction neuve.
            Attention : la part rénovation y est une constante de calcul du jeu de données,
            pas une mesure d'activité — toutes les oscillations de la courbe ci-dessous
            viennent du neuf. C'est cette part rénovation que la question vous demande.
          nl: >
            Het woord dekt verschillende dingen. De projectdata boeken {renewalRateObs:d1} %
            van het bestand dat elk jaar *vernieuwd* wordt: {renoRateObs} % renovatie, van elke
            diepte, plus {newBuildRateObs:d1} % nieuwbouw. Let op: het renovatiedeel is daarin
            een rekenconstante van de dataset, geen meting van activiteit — alle schommelingen
            van de curve hieronder komen van de nieuwbouw. Het is dat renovatiedeel waar de
            vraag over gaat.
          en: >
            The word covers several things. The project's data book {renewalRateObs:d1}% of the
            stock *renewed* each year: {renoRateObs}% of renovation, at any depth, plus
            {newBuildRateObs:d1}% of new construction. Careful: the renovation part of it is a
            computing constant of the dataset, not a measurement of activity — every wiggle in
            the curve below comes from new building. It is that renovation part the question
            asks you about.
        source: nW-BE §2.1.1, decomposition of the JRC-IDEES-2023 floor-area series
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: res_renewal_rate
          from: 2001
          decimals: 1
          caption:
            fr: Surface rénovée ou construite chaque année, en % du parc, 2001-2023.
            nl: Jaarlijks gerenoveerde of gebouwde oppervlakte, in % van het bestand, 2001-2023.
            en: Floor area renovated or newly built each year, as % of the stock, 2001-2023.
      - kind: benchmark
        label:
          fr: Ce que la Wallonie a chiffré
          nl: Wat Wallonië becijferd heeft
          en: What Wallonia has quantified
        text:
          fr: >
            Le projet de plan wallon de rénovation compte, pour 2023, 15 743 logements aidés
            par une prime énergie, soit 0,88 % du parc wallon : 0,60 point de rénovations
            *légères* (3 à 30 % d'énergie économisée), 0,18 point de *moyennes* (30 à 60 %) et
            0,09 point de *profondes* (plus de 60 %). Pour tenir 2050, le même plan estime
            qu'il faut passer à 3 % par an dès maintenant et à plus de 5 % par an après 2040 —
            dont 1,8 point de rénovations profondes aujourd'hui et 3,6 points à la fin.
          nl: >
            Het ontwerp van Waals renovatieplan telt voor 2023 15 743 woningen met een
            energiepremie, ofwel 0,88 % van het Waalse bestand: 0,60 punt *lichte* renovaties
            (3 tot 30 % bespaarde energie), 0,18 punt *middelmatige* (30 tot 60 %) en 0,09 punt
            *diepe* (meer dan 60 %). Om 2050 te halen schat hetzelfde plan dat er nu al 3 % per
            jaar nodig is en meer dan 5 % per jaar na 2040 — waarvan vandaag 1,8 punt diepe
            renovaties en 3,6 punten op het einde.
          en: >
            Wallonia's draft renovation plan counts, for 2023, 15,743 dwellings supported by an
            energy grant, that is 0.88% of the Walloon stock: 0.60 point of *light* renovations
            (3 to 30% of energy saved), 0.18 point of *medium* ones (30 to 60%) and 0.09 point
            of *deep* ones (more than 60%). To meet 2050 the same plan reckons the rate has to
            reach 3% a year now and over 5% a year after 2040 — of which 1.8 point of deep
            renovations today and 3.6 points at the end.
        source: >-
          Service public de Wallonie, Plan wallon de Rénovation Énergétique des Bâtiments —
          projet de plan (novembre 2025), Tableau 2 p. 35 and Tableau 20 p. 221
        url: https://energie.wallonie.be/files/strat%C3%A9gies%20et%20politiques/Plan%20Wallon%20de%20R%C3%A9novation%20Energ%C3%A9tique%20des%20B%C3%A2timents%20-%20Novembre%202025/20251201%20Rapport_Plan_Reno_v4_avec%20annexes.pdf
        chart:
          kind: bars
          unit: "% of the stock per year"
          decimals: 2
          highlight: [0, 1]
          labels:
            - {fr: "Observé 2023", nl: "Waargenomen 2023", en: "Observed 2023"}
            - {fr: "…dont profondes", nl: "…waarvan diep", en: "…of which deep"}
            - {fr: "Nécessaire 2024-30", nl: "Nodig 2024-30", en: "Needed 2024-30"}
            - {fr: "Nécessaire 2046-50", nl: "Nodig 2046-50", en: "Needed 2046-50"}
          y: [0.88, 0.09, 3.0, 5.22]
          caption:
            fr: Wallonie, rythme de rénovation résidentielle observé en 2023 et rythme jugé nécessaire.
            nl: Wallonië, waargenomen residentieel renovatietempo in 2023 en het nodig geachte tempo.
            en: Wallonia, residential renovation rate observed in 2023 and the rate judged necessary.
      - kind: benchmark
        label:
          fr: Ce que la Flandre a chiffré
          nl: Wat Vlaanderen becijferd heeft
          en: What Flanders has quantified
        text:
          fr: >
            La stratégie flamande de rénovation à long terme vise le label A pour chaque
            logement en 2050. Pour y arriver d'un seul chantier par logement, elle chiffre le
            besoin à plus de 3 % du parc par an, soit *plus de 95 000 logements chaque année*
            — contre 0,6 % observé si l'on compte les permis, et 3,5 % du parc seulement qui
            atteignait déjà l'objectif au moment de la rédaction. À l'échelle belge, un point
            de pourcentage représente environ {homesPerPoint} logements par an, sur un parc
            d'environ {dwellingsM} millions.
          nl: >
            De Vlaamse langetermijnrenovatiestrategie mikt op label A voor elke woning in 2050.
            Om daar met één werf per woning te komen, becijfert ze de nood op meer dan 3 % van
            het bestand per jaar, ofwel *meer dan 95 000 woningen per jaar* — tegenover 0,6 %
            waargenomen als men de vergunningen telt, en amper 3,5 % van het bestand dat de
            doelstelling bij het schrijven al haalde. Op Belgische schaal staat één procentpunt
            voor ongeveer {homesPerPoint} woningen per jaar, op een bestand van ongeveer
            {dwellingsM} miljoen.
          en: >
            Flanders' long-term renovation strategy aims at label A for every dwelling in 2050.
            To get there in a single job per dwelling it puts the need at more than 3% of the
            stock a year, that is *more than 95,000 dwellings every year* — against 0.6%
            observed if you count planning permits, and only 3.5% of the stock already meeting
            the objective when it was written. On the Belgian scale, one percentage point is
            about {homesPerPoint} dwellings a year, out of a stock of some {dwellingsM} million.
        source: >-
          Vlaamse Regering, Langetermijnstrategie voor de renovatie van Vlaamse gebouwen —
          Vlaamse langetermijnrenovatiestrategie gebouwen 2050 (2020), pp. 5 and 11-12
        url: https://assets.vlaanderen.be/image/upload/v1666067048/Vlaamse_langetermijnrenovatiestrategie_gebouwen_2050_asqdbs.pdf
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario retient {rateTarget} % du parc par an — soit {shareTarget} % du parc
            rénové au moins une fois d'ici 2050, environ {homesPerYearTarget} logements par an
            — avec une profondeur de {depthTarget} % à chaque chantier. Le rythme est donc à
            peu de chose près celui enregistré aujourd'hui ; c'est la profondeur qui change.
          nl: >
            Het scenario houdt {rateTarget} % van het bestand per jaar aan — dus {shareTarget} %
            van het bestand minstens één keer gerenoveerd tegen 2050, ongeveer
            {homesPerYearTarget} woningen per jaar — met een diepte van {depthTarget} % per
            werf. Het tempo is dus zowat dat van vandaag; het is de diepte die verandert.
          en: >
            The scenario keeps {rateTarget}% of the stock a year — that is {shareTarget}% of it
            renovated at least once by 2050, about {homesPerYearTarget} dwellings a year — at a
            depth of {depthTarget}% per job. The rate is therefore close to the one booked
            today; what changes is the depth.
        source: nW-BE §2.1.1
    historyAbsent: true
    historyNote:
      fr: >
        Pas de courbe observée ici : la composante rénovation des données du projet est une
        constante de calcul (écart-type de 0,008 point sur vingt-trois ans), pas une mesure
        d'activité. La courbe qui bouge — rénovation plus construction neuve — est sur la fiche
        « Ce que compte un taux de rénovation ».
      nl: >
        Geen waargenomen curve hier: het renovatiedeel van de projectdata is een rekenconstante
        (standaardafwijking van 0,008 punt over drieëntwintig jaar), geen meting van activiteit.
        De curve die wel beweegt — renovatie plus nieuwbouw — staat op de fiche "Wat een
        renovatietempo telt".
      en: >
        No observed curve here: the renovation component of the project's data is a computing
        constant (a standard deviation of 0.008 points over twenty-three years), not a
        measurement of activity. The curve that does move — renovation plus new construction —
        is on the card "What a renovation rate counts".
    justification:
      fr: >
        Le modèle ne suit pas trois parcs distincts (existant, rénové, neuf) : il suit la
        performance moyenne de l'ensemble, et l'hypothèse porte sur le rythme d'amélioration de
        cette moyenne, doublé par rapport à l'observation. Or rénover chaque année une part
        constante du parc, à une profondeur constante, fait précisément baisser cette moyenne
        de façon linéaire : c'est la même arithmétique, lue autrement. Le produit *rythme ×
        profondeur* est donc fixé par la trajectoire, et une seule des deux valeurs est un
        choix. C'est la profondeur qui est posée ({depthTarget} %, voir la question suivante) ;
        le rythme suit, et tombe à {rateTarget} % par an. Autrement dit : *pas plus de
        chantiers, mais des chantiers sérieux*.
      nl: >
        Het model volgt geen drie aparte bestanden (bestaand, gerenoveerd, nieuw): het volgt de
        gemiddelde prestatie van het geheel, en de veronderstelling gaat over het
        verbeteringsritme van dat gemiddelde, verdubbeld ten opzichte van de waarneming. Maar
        elk jaar een constant deel van het bestand renoveren, op een constante diepte, laat dat
        gemiddelde precies lineair dalen: dezelfde rekensom, anders gelezen. Het product *tempo
        × diepte* ligt dus vast door het traject, en slechts één van de twee waarden is een
        keuze. Het is de diepte die gesteld wordt ({depthTarget} %, zie de volgende vraag); het
        tempo volgt, en komt uit op {rateTarget} % per jaar. Met andere woorden: *niet meer
        werven, maar ernstige werven*.
      en: >
        The model does not track three separate stocks (existing, renovated, new): it tracks the
        average performance of the whole, and the assumption is about the rate at which that
        average improves, doubled against the observation. But renovating a constant share of
        the stock every year, at a constant depth, makes that average fall linearly: the same
        arithmetic, read differently. The product *rate × depth* is therefore pinned by the
        trajectory and only one of the two is a choice. The depth is the one that is set
        ({depthTarget}%, see the next question); the rate follows, and comes to {rateTarget}% a
        year. In other words: *not more building sites, but serious ones*.
    debate:
      fr: >
        Garder le rythme actuel en rendant chaque chantier profond n'est pas plus facile que de
        rénover davantage : c'est un autre métier, d'autres coûts, d'autres artisans — et la
        Wallonie chiffre à elle seule le besoin d'investissement à 110 milliards d'euros pour
        le logement d'ici 2050. Le rythme de référence lui-même est fragile : {renoRateObs} %
        est une constante de calcul, pas une mesure ; en comptant les primes, la Wallonie
        n'observe que 0,88 % par an, et la Flandre 0,6 % en comptant les permis. Selon ce qu'on
        appelle « une rénovation », la même observation se lit comme un rythme élevé et
        superficiel ou comme un rythme faible et sérieux. Le modèle ne tranche pas : il ne voit
        que le produit des deux.
      nl: >
        Het huidige tempo behouden maar elke werf diep maken is niet makkelijker dan méér
        renoveren: het is een ander vak, andere kosten, andere vaklui — en Wallonië alleen al
        becijfert de investeringsbehoefte op 110 miljard euro voor woningen tegen 2050. Het
        referentietempo zelf is wankel: {renoRateObs} % is een rekenconstante, geen meting; door
        de premies te tellen ziet Wallonië maar 0,88 % per jaar, en Vlaanderen 0,6 % door de
        vergunningen te tellen. Naargelang wat men "een renovatie" noemt, leest dezelfde
        waarneming als een hoog en oppervlakkig tempo of als een laag en ernstig tempo. Het
        model beslist niet: het ziet alleen het product van beide.
      en: >
        Keeping today's rate while making every job a deep one is no easier than renovating
        more: it is a different trade, different costs, different craftspeople — and Wallonia
        alone puts the investment need at 110 billion euros for housing by 2050. The reference
        rate itself is fragile: {renoRateObs}% is a computing constant, not a measurement;
        counting grants, Wallonia observes only 0.88% a year, and Flanders 0.6% counting
        permits. Depending on what you call "a renovation", the same observation reads as a
        high and shallow rate or as a low and serious one. The model does not decide: it only
        sees the product of the two.

  # ------------------------------------------------------------ 3 -------------
  renovation-depth:
    short:
      fr: Profondeur des rénovations
      nl: Diepte van de renovaties
      en: Depth of renovations
    question:
      fr: De combien une rénovation doit-elle réduire le besoin de chauffage du logement qu'elle touche ?
      nl: Met hoeveel moet een renovatie de warmtevraag verlagen van de woning die ze aanpakt?
      en: By how much should a renovation cut the heating need of the home it touches?
    subtitle:
      fr: >
        En moyenne sur toutes les rénovations comptées à la question précédente. 0 % : les
        travaux ne changent rien à la facture de chauffage. 100 % : le logement n'a plus besoin
        d'être chauffé du tout.
      nl: >
        Gemiddeld over alle renovaties die in de vorige vraag geteld worden. 0 %: de werken
        veranderen niets aan de verwarmingsfactuur. 100 %: de woning hoeft helemaal niet meer
        verwarmd te worden.
      en: >
        Averaged over every renovation counted in the previous question. 0%: the works change
        nothing on the heating bill. 100%: the home needs no heating at all any more.
    tangible:
      fr: "{value} % du besoin de chauffage en moins, à chaque rénovation."
      nl: "{value} % minder warmtevraag, bij elke renovatie."
      en: "{value}% less heating need, at every renovation."
    facts:
      - kind: structure
        label:
          fr: Ce qui est mesuré, et ce qui ne l'est pas
          nl: Wat gemeten wordt, en wat niet
          en: What is measured, and what is not
        text:
          fr: >
            Ce qui est observé, c'est le *produit* de vos deux réponses, pas chacune
            séparément : {renoRateObs} % du parc par an à {depthObs} % chacun reproduisent
            exactement la baisse mesurée de {improvementHist:abs} kWh/m² par an — mais 1 % par
            an à {depthIfOnePct} % la reproduisent tout aussi bien. Conséquence directe : à la
            profondeur déduite d'aujourd'hui, rénover *tout* le parc d'ici 2050 ne ferait
            baisser la moyenne que de {depthObs} %. Diviser le besoin par deux exige au minimum
            {depthHalveAll} % à chaque chantier — et de n'oublier aucun logement.
          nl: >
            Wat waargenomen wordt is het *product* van jullie twee antwoorden, niet elk
            afzonderlijk: {renoRateObs} % van het bestand per jaar aan {depthObs} % elk geeft
            exact de gemeten daling van {improvementHist:abs} kWh/m² per jaar — maar 1 % per
            jaar aan {depthIfOnePct} % geeft die net zo goed. Rechtstreeks gevolg: op de uit
            vandaag afgeleide diepte zou *het hele* bestand renoveren tegen 2050 het gemiddelde
            maar met {depthObs} % doen dalen. De vraag halveren vergt minstens {depthHalveAll} %
            per werf — en geen enkele woning overslaan.
          en: >
            What is observed is the *product* of your two answers, not either one on its own:
            {renoRateObs}% of the stock a year at {depthObs}% each reproduces the measured fall
            of {improvementHist:abs} kWh/m² a year exactly — but 1% a year at {depthIfOnePct}%
            reproduces it just as well. A direct consequence: at the depth implied by today,
            renovating *the whole* stock by 2050 would bring the average down by only
            {depthObs}%. Halving the need requires at least {depthHalveAll}% at every job — and
            missing no dwelling.
        source: nW-BE §2.1.1, arithmetic on the observed series
      - kind: benchmark
        label:
          fr: La seule mesure belge
          nl: De enige Belgische meting
          en: The only Belgian measurement
        text:
          fr: >
            Une seule région a chiffré la profondeur de ses rénovations. Sur les 15 743
            logements wallons aidés en 2023, la réduction moyenne de consommation est estimée à
            *20 % d'énergie finale* — et l'essentiel du volume est léger : 0,60 % du parc en
            rénovations légères, 0,18 % en moyennes, 0,09 % en profondes. Le plan précise que
            ce chiffre est reconstitué à partir des travaux réalisés, faute de données de
            consommation avant et après ; aucune région belge ne mesure aujourd'hui l'écart
            réel, et la Wallonie propose de créer un observatoire pour cela.
          nl: >
            Slechts één gewest heeft de diepte van zijn renovaties becijferd. Voor de 15 743
            Waalse woningen die in 2023 steun kregen, wordt de gemiddelde verbruiksdaling
            geraamd op *20 % eindenergie* — en het grootste deel van het volume is licht:
            0,60 % van het bestand in lichte renovaties, 0,18 % in middelmatige, 0,09 % in
            diepe. Het plan preciseert dat dit cijfer gereconstrueerd is uit de uitgevoerde
            werken, bij gebrek aan verbruiksgegevens voor en na; geen enkel Belgisch gewest
            meet vandaag het werkelijke verschil, en Wallonië stelt voor daar een observatorium
            voor op te richten.
          en: >
            Only one region has quantified the depth of its renovations. Across the 15,743
            Walloon dwellings supported in 2023, the average cut in consumption is estimated at
            *20% of final energy* — and most of the volume is light: 0.60% of the stock in
            light renovations, 0.18% in medium ones, 0.09% in deep ones. The plan is explicit
            that this figure is reconstructed from the works carried out, for want of
            before-and-after consumption data; no Belgian region measures the real gap today,
            and Wallonia proposes creating an observatory to do so.
        source: >-
          Service public de Wallonie, Plan wallon de Rénovation Énergétique des Bâtiments —
          projet de plan (novembre 2025), Tableaux 2 et 3, p. 35
        url: https://energie.wallonie.be/files/strat%C3%A9gies%20et%20politiques/Plan%20Wallon%20de%20R%C3%A9novation%20Energ%C3%A9tique%20des%20B%C3%A2timents%20-%20Novembre%202025/20251201%20Rapport_Plan_Reno_v4_avec%20annexes.pdf
        chart:
          kind: bars
          unit: "% of the stock per year"
          decimals: 2
          highlight: 2
          labels:
            - {fr: Légères, nl: Licht, en: Light}
            - {fr: Moyennes, nl: Middelmatig, en: Medium}
            - {fr: Profondes, nl: Diep, en: Deep}
          y: [0.60, 0.18, 0.09]
          caption:
            fr: Wallonie 2023, rénovations aidées par profondeur, en % du parc par an.
            nl: Wallonië 2023, gesteunde renovaties per diepte, in % van het bestand per jaar.
            en: Wallonia 2023, grant-supported renovations by depth, as % of the stock per year.
      - kind: caution
        label:
          fr: Prebound et rebond
          nl: Prebound en rebound
          en: Prebound and rebound
        text:
          fr: >
            La baisse de consommation n'est pas proportionnelle à l'isolation posée. Sur
            3 400 logements allemands, l'occupant consomme en moyenne *30 % de moins* que ce
            que dit le calcul : c'est l'effet *prebound* — on ne chauffe pas tout, pas partout,
            pas à 19 °C. L'écart s'annule vers 50 kWh/m² par an et s'inverse en dessous : dans
            les logements très performants, la consommation réelle *dépasse* le calcul,
            d'environ 65 % pour ceux notés sous 75 kWh/m² par an. Les auteurs en concluent
            qu'une rénovation lourde économise réellement 25 à 35 %, et non les 70 à 80 %
            annoncés. Une étude belge citée dans le même article, sur 964 logements, trouve la
            même courbe.
          nl: >
            De daling van het verbruik is niet evenredig met de geplaatste isolatie. Bij
            3 400 Duitse woningen verbruikt de bewoner gemiddeld *30 % minder* dan wat de
            berekening zegt: dat is het *prebound*-effect — men verwarmt niet alles, niet
            overal, niet tot 19 °C. Het verschil verdwijnt rond 50 kWh/m² per jaar en keert
            daaronder om: in zeer performante woningen *overstijgt* het echte verbruik de
            berekening, met ongeveer 65 % voor die onder 75 kWh/m² per jaar. De auteurs
            besluiten dat een zware renovatie werkelijk 25 tot 35 % bespaart, en niet de
            aangekondigde 70 tot 80 %. Een Belgische studie die in hetzelfde artikel wordt
            aangehaald, over 964 woningen, vindt dezelfde curve.
          en: >
            The fall in consumption is not proportional to the insulation installed. Across
            3,400 German dwellings the occupant uses on average *30% less* than the calculation
            says: the *prebound* effect — people do not heat everything, everywhere, to 19 °C.
            The gap vanishes around 50 kWh/m² a year and reverses below it: in very efficient
            dwellings real consumption *exceeds* the calculation, by around 65% for those rated
            under 75 kWh/m² a year. The authors conclude that a comprehensive retrofit really
            saves 25 to 35%, not the 70 to 80% claimed. A Belgian study cited in the same paper,
            on 964 dwellings, finds the same curve.
        source: >-
          Sunikka-Blank, M. & Galvin, R. (2012), "Introducing the prebound effect: the gap
          between performance and actual energy consumption", Building Research & Information
          40(3), pp. 260-273
        url: https://www.tandfonline.com/doi/full/10.1080/09613218.2012.690952
      - kind: caution
        label:
          fr: Le calcul et le compteur, en Flandre
          nl: De berekening en de meter, in Vlaanderen
          en: The calculation and the meter, in Flanders
        text:
          fr: >
            Le même écart a été mesuré ici. L'Université de Gand et l'agence flamande de
            l'énergie (VEKA) ont croisé le certificat PEB de 47 082 maisons flamandes
            construites ou lourdement rénovées depuis 2006 avec leur consommation de gaz
            réelle : le calcul réglementaire *surestime* la consommation de 103 % en moyenne,
            avec un écart allant de 14 à 214 % selon le niveau E, et n'explique qu'un quart de
            la variation d'une maison à l'autre. La profondeur calculée d'un chantier prédit
            donc mal l'énergie qu'il fera réellement économiser.
          nl: >
            Dezelfde kloof is hier gemeten. De Universiteit Gent en het Vlaams Energie- en
            Klimaatagentschap (VEKA) koppelden het EPB-certificaat van 47 082 Vlaamse woningen
            die sinds 2006 gebouwd of grondig gerenoveerd zijn aan hun werkelijke gasverbruik:
            de regelgevende berekening *overschat* het verbruik met gemiddeld 103 %, met een
            afwijking van 14 tot 214 % naargelang het E-peil, en verklaart maar een kwart van
            de variatie tussen woningen. De berekende diepte van een werf voorspelt dus slecht
            hoeveel energie ze werkelijk zal besparen.
          en: >
            The same gap has been measured here. Ghent University and the Flemish energy agency
            (VEKA) matched the EPB certificate of 47,082 Flemish houses built or thoroughly
            renovated since 2006 with their actual gas consumption: the regulatory calculation
            *overestimates* consumption by 103% on average, with errors running from 14 to 214%
            depending on the E-level, and explains only a quarter of the variation from one
            house to the next. The calculated depth of a job is therefore a poor predictor of
            the energy it will really save.
        source: >-
          Van Hove, M. Y. C. et al. (2021), "Data-driven statistical modelling of real energy
          use for spatial heating and DHW in modern Flemish single-family houses", Building
          Simulation 2021 (IBPSA), pp. 1295-1302 — Ghent University & VEKA
        url: https://publications.ibpsa.org/proceedings/bs/2021/papers/bs2021_30245.pdf
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario retient {depthTarget} % à chaque rénovation — le seuil au-delà duquel
            la Commission européenne parle d'une rénovation « profonde » (recommandation (UE)
            2019/786). Avec {rateTarget} % du parc par an, cela rénove {shareTarget} % du parc
            d'ici 2050. C'est environ deux fois et demie la profondeur qui se déduit de
            l'observation, {depthObs} %, et le triple de la moyenne wallonne mesurée en 2023.
          nl: >
            Het scenario houdt {depthTarget} % per renovatie aan — de drempel waarboven de
            Europese Commissie van een "diepe" renovatie spreekt (aanbeveling (EU) 2019/786).
            Met {rateTarget} % van het bestand per jaar renoveert dat {shareTarget} % van het
            bestand tegen 2050. Dat is ongeveer twee en een half keer de diepte die uit de
            waarneming volgt, {depthObs} %, en het drievoud van het in 2023 gemeten Waalse
            gemiddelde.
          en: >
            The scenario takes {depthTarget}% at every renovation — the threshold above which
            the European Commission calls a renovation "deep" (Recommendation (EU) 2019/786).
            At {rateTarget}% of the stock a year, that renovates {shareTarget}% of the stock by
            2050. It is about two and a half times the depth implied by the observation,
            {depthObs}%, and three times the Walloon average measured in 2023.
        source: nW-BE §2.1.1; Commission Recommendation (EU) 2019/786, Annex 2.3.1.3
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32019H0786
    historyAbsent: true
    historyNote:
      fr: >
        Aucune courbe observée : la profondeur des rénovations n'est mesurée nulle part en
        Belgique. Seul le produit rythme × profondeur l'est, à travers la baisse du besoin de
        chauffage du parc — la courbe de la question précédente.
      nl: >
        Geen waargenomen curve: de diepte van renovaties wordt nergens in België gemeten.
        Alleen het product tempo × diepte wordt gemeten, via de daling van de warmtevraag van
        het bestand — de curve van de vorige vraag.
      en: >
        No observed curve: the depth of renovations is measured nowhere in Belgium. Only the
        product rate × depth is, through the fall in the stock's heating need — the curve on
        the previous question.
    justification:
      fr: >
        C'est ici que se loge le seul choix neuf de cette lecture. Le rapport juge le rythme
        d'amélioration observé « trop faible pour atteindre les objectifs climatiques » et le
        double, ce qui amène le parc de {intensity2019} kWh/m² en 2019 à 39,8 kWh/m² en 2050
        par la seule efficacité. Traduit en rénovation, ce doublement peut venir du nombre de
        chantiers ou de leur profondeur ; c'est la profondeur qui est retenue, et elle est
        calée sur le seuil européen de la rénovation « profonde », {depthTarget} %. Le rythme,
        {rateTarget} % par an, en découle. La logique est celle du modèle lui-même : il ne
        distingue pas parc existant, parc rénové et parc neuf, il suit la moyenne — et une
        moyenne ne descend pas en multipliant les chantiers superficiels.
      nl: >
        Hier zit de enige nieuwe keuze van deze lezing. Het rapport vindt het waargenomen
        verbeteringsritme "te laag om de klimaatdoelstellingen te halen" en verdubbelt het, wat
        het bestand van {intensity2019} kWh/m² in 2019 naar 39,8 kWh/m² in 2050 brengt door
        efficiëntie alleen. Vertaald naar renovatie kan die verdubbeling van het aantal werven
        of van hun diepte komen; het is de diepte die gekozen wordt, en ze wordt geijkt op de
        Europese drempel voor een "diepe" renovatie, {depthTarget} %. Het tempo, {rateTarget} %
        per jaar, volgt daaruit. De logica is die van het model zelf: het onderscheidt bestaand,
        gerenoveerd en nieuw bestand niet, het volgt het gemiddelde — en een gemiddelde daalt
        niet door oppervlakkige werven te vermenigvuldigen.
      en: >
        This is where the one new choice of this reading sits. The report judges the observed
        rate of improvement "too low to meet the climate objectives" and doubles it, which takes
        the stock from {intensity2019} kWh/m² in 2019 to 39.8 kWh/m² in 2050 through efficiency
        alone. Translated into renovation, that doubling can come from the number of jobs or
        from their depth; the depth is the one chosen, and it is set on the European threshold
        for a "deep" renovation, {depthTarget}%. The rate, {rateTarget}% a year, follows. The
        logic is the model's own: it does not separate existing, renovated and new stock, it
        tracks the average — and an average does not fall by multiplying shallow jobs.
    debate:
      fr: >
        Le modèle compte la profondeur *calculée*, pas celle qui arrive au compteur, et les
        deux diffèrent beaucoup : l'écart mesuré en Flandre est d'un facteur deux, et sur un
        programme néerlandais de rénovation subventionnée l'effet rebond a repris environ 56 %
        de l'économie attendue (26,7 % chez les propriétaires, 41,3 % chez les locataires, sur
        563 000 logements). Une profondeur affichée sur le papier peut donc valoir beaucoup
        moins en pratique. Deuxième réserve : le rapport attribue toute l'amélioration passée à
        l'isolation, tout en reconnaissant qu'une partie venait de baisses de chauffage pendant
        les crises énergétiques — donc de sobriété déjà comptée ailleurs. Troisième : parce que
        le modèle suit la moyenne du parc, il ne dit rien des logements les plus mauvais, qui
        sont aussi ceux des ménages les plus précaires, alors que la directive européenne de
        2024 vise précisément les 43 % les moins performants.
      nl: >
        Het model telt de *berekende* diepte, niet die van de meter, en de twee verschillen
        sterk: de in Vlaanderen gemeten kloof is een factor twee, en bij een Nederlands
        gesubsidieerd renovatieprogramma nam het rebound-effect ongeveer 56 % van de verwachte
        besparing terug (26,7 % bij eigenaars, 41,3 % bij huurders, op 563 000 woningen). Een op
        papier aangekondigde diepte kan dus veel minder waard zijn in de praktijk. Tweede
        bedenking: het rapport schrijft de hele voorbije verbetering toe aan isolatie, terwijl
        het erkent dat een deel kwam van minder stoken tijdens de energiecrisissen — dus van
        soberheid die elders al geteld is. Derde: omdat het model het gemiddelde van het bestand
        volgt, zegt het niets over de slechtste woningen, die ook die van de meest kwetsbare
        huishoudens zijn, terwijl de Europese richtlijn van 2024 juist de 43 % slechtst
        presterende viseert.
      en: >
        The model counts *calculated* depth, not the depth that reaches the meter, and the two
        differ widely: the gap measured in Flanders is a factor of two, and on a Dutch
        subsidised retrofit programme the rebound effect took back about 56% of the expected
        saving (26.7% among owners, 41.3% among tenants, across 563,000 dwellings). A depth
        announced on paper may therefore be worth far less in practice. Second reservation: the
        report attributes the whole past improvement to insulation while conceding that part of
        it came from turning the heating down during the energy crises — that is, from
        sufficiency already counted elsewhere. Third: because the model tracks the stock
        average, it says nothing about the worst dwellings, which are also those of the most
        precarious households, while the 2024 European directive targets precisely the 43%
        worst-performing.

  thermostat:
    short:
      fr: Thermostat
      nl: Thermostaat
      en: Thermostat
    question:
      fr: "Quel niveau moyen de thermostat est raisonnable en 2050, sans perte de confort ?"
      nl: "Welk gemiddeld thermostaatniveau is in 2050 redelijk, zonder comfortverlies?"
      en: "What average thermostat level is reasonable in 2050, without a loss of comfort?"
    subtitle:
      fr: "Répondez en degrés en moins par rapport à 2019, en moyenne sur tout le parc : personne ne mesure la consigne absolue des logements belges, seul l'écart est modélisable. Zéro = on ne change rien, négatif = on chauffe davantage."
      nl: "Antwoord in graden minder dan in 2019, gemiddeld over het hele bestand: niemand meet de absolute instelling van Belgische woningen, alleen het verschil is modelleerbaar. Nul = niets verandert, negatief = warmer stoken."
      en: "Answer in degrees less than in 2019, averaged over the whole stock: nobody measures the absolute setpoint of Belgian homes, only the change can be modelled. Zero = nothing changes, negative = heating more."
    tangible:
      fr: "{value} °C de moins sur le thermostat, en moyenne, pendant toute la saison de chauffe."
      nl: "{value} °C minder op de thermostaat, gemiddeld, gedurende het hele stookseizoen."
      en: "{value} °C less on the thermostat, on average, right through the heating season."
    facts:
      - kind: structure
        text:
          fr: >
            Une recherche collective menée en Belgique, *SlowHeat*, conclut qu'une
            température intérieure moyenne de {slowheatOk} °C peut être pleinement acceptable
            et même désirable dès lors que l'on chauffe les corps plutôt que les volumes —
            vêtements adaptés, couvertures et vêtements chauffants — le seuil de vigilance se
            situant vers {slowheatMin} °C.
          nl: >
            Een collectief onderzoek in België, *SlowHeat*, concludeert dat een gemiddelde
            binnentemperatuur van {slowheatOk} °C volledig acceptabel en zelfs wenselijk kan
            zijn zodra men de lichamen verwarmt in plaats van de volumes — aangepaste
            kleding, dekens en verwarmde kledij — met een waakzaamheidsdrempel rond
            {slowheatMin} °C.
          en: >
            A collective research project run in Belgium, *SlowHeat*, concludes that an
            average indoor temperature of {slowheatOk} °C can be entirely acceptable and even
            desirable once you heat bodies rather than volumes — suitable clothing, blankets
            and heated garments — with the vigilance threshold sitting around
            {slowheatMin} °C.
        source: "De Grave & Van Moeseke (2024), SlowHeat : chauffer les corps, moins les logements, Presses universitaires de Louvain"
        url: https://pul.uclouvain.be/book/?GCOI=29303100724760
      - kind: benchmark
        text:
          fr: >
            Un gouvernement européen l'a déjà imposé par la loi : en août 2022, l'Espagne a
            plafonné le chauffage à 19 °C dans les bâtiments publics, les commerces, les
            cinémas, les gares et les aéroports — et son exposé des motifs retient la même
            physique que ce levier, environ {pctPerDegC} % de consommation en moins par degré.
            La mesure ne touchait pas les logements.
          nl: >
            Eén Europese regering heeft het al bij wet opgelegd: in augustus 2022 beperkte
            Spanje de verwarming tot 19 °C in openbare gebouwen, winkels, bioscopen,
            stations en luchthavens — en de toelichting hanteert dezelfde fysica als deze
            hefboom, ongeveer {pctPerDegC} % minder verbruik per graad. De maatregel gold niet
            voor woningen.
          en: >
            One European government has already legislated it: in August 2022 Spain capped
            heating at 19 °C in public buildings, shops, cinemas, stations and airports — and
            its explanatory note uses the same physics as this lever, about {pctPerDegC}%
            less consumption per degree. The measure did not cover homes.
        source: "Government of Spain, Royal Decree-Law 14/2022 — plan for energy saving and air-conditioning management, 1 August 2022"
        url: https://www.lamoncloa.gob.es/lang/en/gobierno/councilministers/Paginas/2022/20220801_council.aspx
      - kind: tangible
        text:
          fr: >
            Un degré en moins, c'est {pctPerDegC} % de chauffage en moins. Sur le parc de
            2019, cela représente {degCTwh2019} TWh, ou {degCKwhPerPerson2019} kWh par
            personne et par an — sur un poste chauffage de {heatTwh} TWh, soit
            {heatSharePct} % de l'énergie thermique du logement.
          nl: >
            Eén graad minder is {pctPerDegC} % minder verwarming. Op het bestand van 2019
            komt dat neer op {degCTwh2019} TWh, of {degCKwhPerPerson2019} kWh per persoon per
            jaar — op een verwarmingspost van {heatTwh} TWh, ofwel {heatSharePct} % van de
            thermische energie van de woning.
          en: >
            One degree less is {pctPerDegC}% less heating. On the 2019 stock that is
            {degCTwh2019} TWh, or {degCKwhPerPerson2019} kWh per person per year — out of a
            heating bill of {heatTwh} TWh, which is {heatSharePct}% of the home's thermal
            energy.
        source: nW-BE §2.1.2, arithmetic on the 2019 stock
      - kind: caution
        text:
          fr: >
            La pratique se heurte à de fortes résistances sociales et psychologiques : en
            2022, année de tous les records de prix, 19 °C a souvent constitué un plancher
            plutôt qu'un objectif. Et personne ne mesure la consigne réelle des logements
            belges : on n'observe que la consommation, qui mélange thermostat, isolation et
            météo.
          nl: >
            De praktijk stoot op sterke sociale en psychologische weerstand: in 2022, het
            jaar van alle prijsrecords, was 19 °C vaak eerder een ondergrens dan een doel. En
            niemand meet de werkelijke instelling in Belgische woningen: men observeert alleen
            het verbruik, dat thermostaat, isolatie en weer door elkaar mengt.
          en: >
            The practice meets strong social and psychological resistance: in 2022, the year
            of record prices, 19 °C was often a floor rather than a target. And nobody
            measures the actual setpoint of Belgian homes: only consumption is observed, and
            it mixes thermostat, insulation and weather together.
        source: nW-BE §2.1.2, citing De Grave & Van Moeseke (2024)
    historyAbsent: true
    historyNote:
      fr: Aucune série mesurée des températures de consigne des logements belges n'existe ; seule la consommation de chauffage est observée, et elle mélange l'effet du thermostat, de l'isolation et de la météo.
      nl: Er bestaat geen gemeten reeks van de ingestelde temperaturen in Belgische woningen; alleen het verwarmingsverbruik wordt waargenomen, en dat mengt het effect van de thermostaat, de isolatie en het weer.
      en: No measured series of Belgian home setpoints exists; only heating consumption is observed, and it mixes the effect of the thermostat, of insulation and of the weather.
    justification:
      fr: >
        négaWatt retient {targetValue} °C de moins en moyenne d'ici 2050, en pariant sur une
        évolution des normes sociales plutôt que sur une contrainte. À {pctPerDegC} % par
        degré, cela retire {demandCutPct} % de la demande de chauffage, en plus des gains
        d'efficacité de la rénovation. C'est le seul levier du logement qui touche
        directement au confort perçu, et c'est aussi le moins coûteux.
      nl: >
        negaWatt kiest {targetValue} °C minder gemiddeld tegen 2050, met een gok op
        veranderende sociale normen in plaats van op dwang. Aan {pctPerDegC} % per graad haalt
        dat {demandCutPct} % van de warmtevraag weg, bovenop de efficiëntiewinst van de
        renovatie. Het is de enige hefboom van de woning die het ervaren comfort direct raakt,
        en ook de goedkoopste.
      en: >
        negaWatt settles on {targetValue} °C less on average by 2050, betting on shifting
        social norms rather than on a constraint. At {pctPerDegC}% per degree that removes
        {demandCutPct}% of heating demand, on top of the efficiency gains from renovation. It
        is the only housing lever that touches perceived comfort directly, and also the
        cheapest one.
    debate:
      fr: >
        Le rapport reconnaît lui-même qu'une généralisation de *SlowHeat* est « plutôt
        irréaliste ». Deux degrés de moins en moyenne sur tout un parc, ce n'est pas deux
        degrés pour tout le monde : c'est beaucoup plus pour certains ménages, et un risque
        de précarité énergétique qu'un modèle de demande ne voit pas.
      nl: >
        Het rapport erkent zelf dat een algemene toepassing van *SlowHeat* "eerder
        onrealistisch" is. Twee graden minder gemiddeld over een heel bestand is niet twee
        graden voor iedereen: het is veel meer voor sommige huishoudens, en een risico op
        energiearmoede dat een vraagmodel niet ziet.
      en: >
        The report itself concedes that making *SlowHeat* general is "rather unrealistic".
        Two degrees less on average across a whole stock is not two degrees for everyone: it
        is far more for some households, and a fuel-poverty risk that a demand model does not
        see.

  # ------------------------------------------------------------ 4 -------------
  hot-water:
    short:
      fr: Eau chaude sanitaire
      nl: Sanitair warm water
      en: Domestic hot water
    question:
      fr: "Quelle consommation d'eau chaude sanitaire par personne est un objectif 2050 réaliste ?"
      nl: "Welk verbruik van sanitair warm water per persoon is een realistisch doel voor 2050?"
      en: "What domestic hot-water use per person is a realistic 2050 objective?"
    subtitle:
      fr: "Chaleur utile contenue dans l'eau, par personne et par an. Douches, bains, vaisselle, lavabos."
      nl: "Nuttige warmte in het water, per persoon per jaar. Douches, baden, afwas, wastafels."
      en: "Useful heat in the water, per person per year. Showers, baths, washing up, basins."
    tangible:
      fr: "{value} kWh d'eau chaude par personne et par an."
      nl: "{value} kWh warm water per persoon per jaar."
      en: "{value} kWh of hot water per person per year."
    facts:
      - kind: trend
        text:
          fr: >
            Montée régulière pendant vingt ans, puis chute brutale : 531 kWh par personne en
            2000, {refValue} en 2019, 577 en 2020, 459 en 2022 et 435 en 2023. La baisse
            coïncide avec les confinements puis la crise des prix de l'énergie, et rien ne dit
            encore si elle est durable.
          nl: >
            Twintig jaar gestaag omhoog, dan een scherpe val: 531 kWh per persoon in 2000,
            {refValue} in 2019, 577 in 2020, 459 in 2022 en 435 in 2023. De daling valt samen
            met de lockdowns en daarna de energieprijzencrisis, en het is nog niet duidelijk
            of ze duurzaam is.
          en: >
            Twenty years of steady growth, then a sharp fall: 531 kWh per person in 2000,
            {refValue} in 2019, 577 in 2020, 459 in 2022 and 435 in 2023. The drop coincides
            with the lockdowns and then the energy price crisis, and it is not yet clear
            whether it lasts.
        source: JRC-IDEES-2023 (Belgium); population Statbel
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: structure
        text:
          fr: >
            En 2019, cela équivaut à {litres2019} litres d'eau à 40 °C par jour et par
            personne. Chauffer 100 litres de 15 à 40 °C demande {kwhPer100Litres} kWh. L'eau
            chaude pèse {hotWaterTwh} TWh sur {thermalTwh}, soit {hotWaterSharePct} % de
            l'énergie thermique du logement — et, contrairement au chauffage, elle suit la
            population et non la surface.
          nl: >
            In 2019 komt dat neer op {litres2019} liter water van 40 °C per dag per persoon.
            100 liter opwarmen van 15 naar 40 °C vraagt {kwhPer100Litres} kWh. Warm water
            weegt {hotWaterTwh} TWh op {thermalTwh}, ofwel {hotWaterSharePct} % van de
            thermische energie van de woning — en anders dan verwarming volgt het de
            bevolking, niet de oppervlakte.
          en: >
            In 2019 that is the equivalent of {litres2019} litres of 40 °C water a day per
            person. Heating 100 litres from 15 to 40 °C takes {kwhPer100Litres} kWh. Hot water
            weighs {hotWaterTwh} TWh out of {thermalTwh}, or {hotWaterSharePct}% of the home's
            thermal energy — and unlike heating it follows population, not floor area.
        source: nW-BE §2.1.2 (JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            Sur la base plus large d'Eurostat — l'énergie livrée à la chaudière, pertes
            comprises, et non la chaleur dans l'eau — la Belgique consacre 1 030 kWh par
            personne et par an à l'eau chaude, contre 918 dans l'UE27, 660 en France, 1 222 en
            Allemagne et 1 969 au Danemark. L'écart entre pays est un fait, mais il mêle
            habitudes, température de l'eau du réseau et rendement des installations.
          nl: >
            Op de ruimere basis van Eurostat — de energie geleverd aan de ketel, verliezen
            inbegrepen, en niet de warmte in het water — besteedt België 1.030 kWh per persoon
            per jaar aan warm water, tegenover 918 in de EU27, 660 in Frankrijk, 1.222 in
            Duitsland en 1.969 in Denemarken. Het verschil tussen landen is een feit, maar het
            mengt gewoonten, leidingwatertemperatuur en installatierendement.
          en: >
            On Eurostat's wider basis — energy delivered to the boiler, losses included,
            rather than heat in the water — Belgium spends 1,030 kWh per person per year on
            hot water, against 918 in the EU27, 660 in France, 1,222 in Germany and 1,969 in
            Denmark. The spread between countries is real, but it mixes habits, mains water
            temperature and installation efficiency.
        source: "Eurostat, nrg_d_hhq (disaggregated household final energy consumption), 2023; population Eurostat demo_pjan"
        url: https://ec.europa.eu/eurostat/databrowser/view/nrg_d_hhq/default/table
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario descend à {litresTarget} litres d'eau à 40 °C par jour et par
            personne, soit {changePct} %. Le calcul est explicite : une douche par jour de
            {showerMinutes} minutes à {showerFlow} l/min et {showerTemp} °C
            ({showerKwh} kWh), plus {othersLitres} litres à {othersTemp} °C pour la vaisselle
            et les autres usages ({othersKwh} kWh).
          nl: >
            Het scenario gaat naar {litresTarget} liter water van 40 °C per dag per persoon,
            ofwel {changePct} %. De berekening is expliciet: één douche per dag van
            {showerMinutes} minuten aan {showerFlow} l/min en {showerTemp} °C
            ({showerKwh} kWh), plus {othersLitres} liter aan {othersTemp} °C voor de afwas en
            de overige toepassingen ({othersKwh} kWh).
          en: >
            The scenario comes down to {litresTarget} litres of 40 °C water a day per person,
            i.e. {changePct}%. The calculation is explicit: one shower a day of
            {showerMinutes} minutes at {showerFlow} l/min and {showerTemp} °C
            ({showerKwh} kWh), plus {othersLitres} litres at {othersTemp} °C for washing up
            and other uses ({othersKwh} kWh).
        source: nW-BE §2.1.2
    justification:
      fr: >
        négaWatt retient {targetValue} kWh par personne et par an, soit {changePct} % par
        rapport à 2019, en construisant la valeur à partir d'un usage jugé suffisant plutôt
        qu'en appliquant un pourcentage : une douche quotidienne de {showerMinutes} minutes à
        {showerTemp} °C et {showerFlow} l/min, plus {othersLitres} litres à {othersTemp} °C
        pour les autres usages domestiques. Cela ramène l'équivalent de {litres2019} à
        {litresTarget} litres d'eau à 40 °C par jour. Le poste ne suit pas la surface du
        logement mais la population, qui augmente d'ici 2050 : la baisse par personne est donc
        en partie absorbée.
      nl: >
        negaWatt kiest {targetValue} kWh per persoon per jaar, ofwel {changePct} % tegenover
        2019, en bouwt de waarde op uit een als voldoende beschouwd gebruik in plaats van een
        percentage toe te passen: een dagelijkse douche van {showerMinutes} minuten aan
        {showerTemp} °C en {showerFlow} l/min, plus {othersLitres} liter aan {othersTemp} °C
        voor de overige huishoudelijke toepassingen. Dat brengt het equivalent van
        {litres2019} naar {litresTarget} liter water van 40 °C per dag. De post volgt niet de
        oppervlakte van de woning maar de bevolking, die tegen 2050 groeit: de daling per
        persoon wordt dus deels opgeslorpt.
      en: >
        negaWatt settles on {targetValue} kWh per person per year, i.e. {changePct}% against
        2019, building the value up from a use judged sufficient rather than applying a
        percentage: a daily shower of {showerMinutes} minutes at {showerTemp} °C and
        {showerFlow} l/min, plus {othersLitres} litres at {othersTemp} °C for other domestic
        uses. That takes the equivalent from {litres2019} to {litresTarget} litres of 40 °C
        water a day. The service follows population rather than floor area, and population
        grows by 2050: part of the per-person reduction is therefore absorbed.
    debate:
      fr: >
        Une douche par personne et par jour est une norme, pas une mesure : elle vaut pour un
        adulte sédentaire et pas pour un ouvrier de chantier, un sportif ou un soignant. Le
        chiffre est aussi le seul du logement à être construit à partir d'un usage prescrit,
        ce qui le rend précis mais discutable.
      nl: >
        Eén douche per persoon per dag is een norm, geen meting: ze geldt voor een zittende
        volwassene en niet voor een bouwarbeider, een sporter of een zorgverlener. Het cijfer
        is ook het enige van de woning dat opgebouwd is uit een voorgeschreven gebruik, wat
        het precies maar betwistbaar maakt.
      en: >
        One shower per person per day is a norm, not a measurement: it fits a sedentary adult
        and not a building worker, an athlete or a care worker. It is also the only housing
        figure built up from a prescribed use, which makes it precise but arguable.

  # ------------------------------------------------------------ 5 -------------
  cooling:
    short:
      fr: Climatisation
      nl: Koeling
      en: Home cooling
    question:
      fr: "Quel niveau de climatisation des logements est un objectif 2050 acceptable ?"
      nl: "Welk niveau van woningkoeling is een aanvaardbaar doel voor 2050?"
      en: "What level of home cooling is an acceptable 2050 objective?"
    subtitle:
      fr: "Besoin de froid utile par mètre carré et par an, moyenné sur tout le parc de logements — climatisés ou non."
      nl: "Nuttige koudevraag per vierkante meter per jaar, gemiddeld over het hele woningbestand — gekoeld of niet."
      en: "Useful cooling demand per square metre per year, averaged over the whole dwelling stock — cooled or not."
    tangible:
      fr: "{value} kWh de froid par m² de logement et par an, moyenne sur tout le parc."
      nl: "{value} kWh koeling per m² woning per jaar, gemiddeld over het hele bestand."
      en: "{value} kWh of cooling per m² of home per year, averaged over the whole stock."
    facts:
      - kind: trend
        text:
          fr: >
            Multiplié par vingt-deux en vingt-trois ans : 0,04 kWh/m² en 2000, {refValue} en
            2019, 1,01 en 2023. Près de six dixièmes de toute cette hausse se sont produits
            après 2019, en quatre ans.
          nl: >
            Vermenigvuldigd met tweeëntwintig in drieëntwintig jaar: 0,04 kWh/m² in 2000,
            {refValue} in 2019, 1,01 in 2023. Bijna zes tienden van die hele stijging vond na
            2019 plaats, in vier jaar.
          en: >
            Multiplied by twenty-two in twenty-three years: 0.04 kWh/m² in 2000, {refValue} in
            2019, 1.01 in 2023. Close to six tenths of that whole increase happened after
            2019, in four years.
        source: JRC-IDEES-2023 (Belgium), floor areas from the EU Building Observatory
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: structure
        text:
          fr: >
            Le froid ne pèse encore que {coolingTwh} TWh sur {thermalTwh}, soit
            {coolingSharePct} % de l'énergie thermique du logement, contre {heatTwh} TWh pour
            le chauffage. C'est pourtant le seul des quatre postes dont la demande observée
            augmente — et il suit la surface, comme le chauffage.
          nl: >
            Koeling weegt nog maar {coolingTwh} TWh op {thermalTwh}, ofwel
            {coolingSharePct} % van de thermische energie van de woning, tegenover
            {heatTwh} TWh voor verwarming. Toch is het de enige van de vier posten waarvan de
            waargenomen vraag stijgt — en ze volgt de oppervlakte, zoals verwarming.
          en: >
            Cooling still weighs only {coolingTwh} TWh out of {thermalTwh}, or
            {coolingSharePct}% of the home's thermal energy, against {heatTwh} TWh for
            heating. It is nonetheless the only one of the four services whose observed demand
            is rising — and it follows floor area, like heating.
        source: nW-BE §2.1.2 (JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            Le climat belge reste tempéré : 12 degrés-jours de refroidissement en 2024, contre
            139 en moyenne dans l'UE27, 304 en Espagne et 365 en Italie. Mais la moyenne belge
            par décennie monte : 14 sur 1990-1999, 15 sur 2000-2009, 20 sur 2010-2019, 24 sur
            2015-2024.
          nl: >
            Het Belgische klimaat blijft gematigd: 12 koelgraaddagen in 2024, tegenover 139
            gemiddeld in de EU27, 304 in Spanje en 365 in Italië. Maar het Belgische
            decenniumgemiddelde stijgt: 14 over 1990-1999, 15 over 2000-2009, 20 over
            2010-2019, 24 over 2015-2024.
          en: >
            Belgium's climate is still temperate: 12 cooling degree days in 2024, against 139
            on average in the EU27, 304 in Spain and 365 in Italy. But the Belgian decade
            average is climbing: 14 over 1990-1999, 15 over 2000-2009, 20 over 2010-2019, 24
            over 2015-2024.
        source: "Eurostat, nrg_chddr2_a (cooling degree days), 1990-2024"
        url: https://ec.europa.eu/eurostat/databrowser/view/nrg_chddr2_a/default/table
      - kind: tangible
        text:
          fr: >
            À {refValue} kWh/m² et par an, un logement de 100 m² demandait environ 44 kWh de
            froid sur l'année en 2019. C'est peu — mais la moyenne porte sur tout le parc,
            climatisé ou non, et un logement réellement équipé consomme plusieurs fois cela.
          nl: >
            Aan {refValue} kWh/m² per jaar vroeg een woning van 100 m² in 2019 ongeveer 44 kWh
            koeling over het jaar. Dat is weinig — maar het gemiddelde geldt voor het hele
            bestand, gekoeld of niet, en een werkelijk uitgeruste woning verbruikt daar een
            veelvoud van.
          en: >
            At {refValue} kWh/m² a year, a 100 m² home needed about 44 kWh of cooling over the
            year in 2019. That is small — but the average is taken over the whole stock,
            cooled or not, and a home that really is equipped uses several times as much.
        source: nW-BE, arithmetic on the 2019 value
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario prolonge exactement le rythme de déploiement observé,
            +{rateAssumed} kWh/m² par an ({accTarget} fois la tendance historique), ce qui
            porte le besoin de froid à +{growthPct} % et {coolingTwhTarget} TWh en 2050. Le
            froid est donc le seul poste thermique du logement qui augmente.
          nl: >
            Het scenario zet precies het waargenomen uitrolritme voort,
            +{rateAssumed} kWh/m² per jaar ({accTarget} keer de historische trend), wat de
            koudevraag op +{growthPct} % en {coolingTwhTarget} TWh in 2050 brengt. Koeling is
            dus de enige thermische post van de woning die stijgt.
          en: >
            The scenario extends the observed deployment pace exactly, +{rateAssumed} kWh/m² a
            year ({accTarget} times the historical trend), taking cooling demand to
            +{growthPct}% and {coolingTwhTarget} TWh in 2050. Cooling is therefore the only
            thermal service of the home that grows.
        source: nW-BE §2.1.2
    justification:
      fr: >
        négaWatt retient {targetValue} kWh/m² et par an, soit +{growthPct} % et
        {coolingTwhTarget} TWh en 2050 — le rythme de déploiement historique prolongé tel
        quel, sans accélération ni freinage ({accTarget} × {rateAssumed} kWh/m² par an). Le
        raisonnement est assumé : avec le réchauffement, la climatisation devient une
        nécessité pour une qualité de vie décente dans certains cas, mais son extension peut
        être contenue à ces cas. Le rapport écarte explicitement un usage aujourd'hui en
        croissance — climatiser pour augmenter l'autoconsommation photovoltaïque — au motif
        que ce potentiel solaire, déjà limité en Belgique, servirait mieux ailleurs.
      nl: >
        negaWatt kiest {targetValue} kWh/m² per jaar, ofwel +{growthPct} % en
        {coolingTwhTarget} TWh in 2050 — het historische uitrolritme onveranderd voortgezet,
        zonder versnelling of afremming ({accTarget} × {rateAssumed} kWh/m² per jaar). De
        redenering wordt uitgesproken: met de opwarming wordt koeling in bepaalde gevallen een
        noodzaak voor een behoorlijke levenskwaliteit, maar de uitbreiding kan tot die
        gevallen beperkt blijven. Het rapport wijst uitdrukkelijk een vandaag groeiend gebruik
        af — koelen om het zonne-eigenverbruik te verhogen — omdat dat zonnepotentieel, in
        België al beperkt, elders beter zou dienen.
      en: >
        negaWatt settles on {targetValue} kWh/m² a year, i.e. +{growthPct}% and
        {coolingTwhTarget} TWh in 2050 — the historical deployment pace carried forward
        unchanged, neither accelerated nor braked ({accTarget} × {rateAssumed} kWh/m² a year).
        The reasoning is stated openly: with warming, air conditioning becomes a necessity for
        a decent quality of life in some cases, but its spread can be held to those cases. The
        report explicitly rejects a use that is growing today — cooling in order to raise
        photovoltaic self-consumption — on the grounds that this solar potential, already
        limited in Belgium, would serve better elsewhere.
    debate:
      fr: >
        Prolonger la tendance revient à supposer que le climat des années 2020 est celui de
        2050, ce que les degrés-jours de refroidissement contredisent déjà. À l'inverse, une
        climatisation généralisée dans un pays à douze degrés-jours serait une dépense
        largement évitable par l'ombrage, la ventilation nocturne et l'inertie. Le levier
        oppose donc deux hypothèses de confort, pas deux hypothèses techniques.
      nl: >
        De trend voortzetten komt erop neer aan te nemen dat het klimaat van de jaren 2020 dat
        van 2050 is, wat de koelgraaddagen al tegenspreken. Omgekeerd zou algemene koeling in
        een land met twaalf graaddagen een uitgave zijn die grotendeels vermijdbaar is met
        zonwering, nachtventilatie en massa. De hefboom zet dus twee comfortveronderstellingen
        tegenover elkaar, niet twee technische.
      en: >
        Carrying the trend forward amounts to assuming that the climate of the 2020s is the
        climate of 2050, which the cooling degree days already contradict. Conversely,
        widespread air conditioning in a country with twelve degree days would be an expense
        largely avoidable through shading, night ventilation and thermal mass. The lever
        therefore sets two comfort assumptions against each other, not two technical ones.

  # ------------------------------------------------------------ 6 -------------
  cooking:
    short:
      fr: Cuisine domestique
      nl: Koken thuis
      en: Home cooking
    question:
      fr: "Quelle consommation d'énergie pour cuisiner à la maison est un objectif 2050 réaliste ?"
      nl: "Welk energieverbruik om thuis te koken is een realistisch doel voor 2050?"
      en: "What energy use for cooking at home is a realistic 2050 objective?"
    subtitle:
      fr: "Chaleur utile pour la cuisson, par ménage et par an. Ni le chauffage, ni l'eau chaude, ni les appareils électroménagers."
      nl: "Nuttige warmte om te koken, per huishouden per jaar. Niet de verwarming, niet het warme water, niet de huishoudtoestellen."
      en: "Useful heat for cooking, per household per year. Not heating, not hot water, not household appliances."
    tangible:
      fr: "{value} kWh par ménage et par an pour cuisiner."
      nl: "{value} kWh per huishouden per jaar om te koken."
      en: "{value} kWh per household per year for cooking."
    facts:
      - kind: trend
        text:
          fr: >
            En léger recul : {trendHist:abs} kWh par ménage et par an en moins, en moyenne,
            entre 2000 et 2023. L'explication avancée est le changement des habitudes
            culinaires et l'achat croissant de produits transformés.
          nl: >
            Licht dalend: {trendHist:abs} kWh per huishouden per jaar minder, gemiddeld, tussen
            2000 en 2023. De aangevoerde verklaring is de verandering van kookgewoonten en de
            toenemende aankoop van verwerkte producten.
          en: >
            Slightly falling: {trendHist:abs} kWh per household per year less, on average,
            between 2000 and 2023. The explanation put forward is changing cooking habits and
            the growing purchase of processed food.
        source: nW-BE §2.1.2 (JRC-IDEES-2023, 2000-2023 average trend)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: structure
        text:
          fr: >
            C'est le plus petit des quatre postes thermiques du logement : {cookingTwh} TWh
            sur {thermalTwh}, soit {cookingSharePct} %. Le gaz en fournissait
            {gasShare2019} % en 2019. Ce poste suit le nombre de ménages, pas la population ni
            la surface — le ménage belge moyen compte {householdSize} personnes.
          nl: >
            Dit is de kleinste van de vier thermische posten van de woning: {cookingTwh} TWh
            op {thermalTwh}, ofwel {cookingSharePct} %. Gas leverde er {gasShare2019} % van in
            2019. Deze post volgt het aantal huishoudens, niet de bevolking of de oppervlakte
            — het gemiddelde Belgische huishouden telt {householdSize} personen.
          en: >
            This is the smallest of the home's four thermal services: {cookingTwh} TWh out of
            {thermalTwh}, or {cookingSharePct}%. Gas supplied {gasShare2019}% of it in 2019.
            The service follows the number of households, not population and not floor area —
            the average Belgian household holds {householdSize} people.
        source: nW-BE §2.1.2 (JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            Manger dehors est l'envers de cuisiner chez soi, et la Belgique le fait peu : les
            ménages belges consacrent 5,9 % de leur budget aux services de restauration,
            contre 7,1 % dans l'UE27, 14,0 % en Espagne et 4,9 % en Allemagne (2024). Côté
            énergie, la cuisson ne représente que 1,7 % de l'énergie livrée aux ménages belges,
            contre 6,4 % dans l'UE27 (2023).
          nl: >
            Buitenshuis eten is de keerzijde van thuis koken, en België doet het weinig: de
            Belgische huishoudens besteden 5,9 % van hun budget aan restauratiediensten,
            tegenover 7,1 % in de EU27, 14,0 % in Spanje en 4,9 % in Duitsland (2024). Aan de
            energiekant is koken maar 1,7 % van de aan Belgische huishoudens geleverde energie,
            tegenover 6,4 % in de EU27 (2023).
          en: >
            Eating out is the flip side of cooking at home, and Belgium does little of it:
            Belgian households spend 5.9% of their budget on food and beverage serving
            services, against 7.1% in the EU27, 14.0% in Spain and 4.9% in Germany (2024). On
            the energy side, cooking is only 1.7% of the energy delivered to Belgian
            households, against 6.4% in the EU27 (2023).
        source: "Eurostat, nama_10_cp18 (household consumption by purpose, CP111, 2024) and nrg_d_hhq (household end uses, 2023)"
        url: https://ec.europa.eu/eurostat/databrowser/view/nama_10_cp18/default/table
      - kind: structure
        reveal: true
        text:
          fr: >
            C'est le seul poste que le scénario fait *monter* : {changePct} %, au nom d'une
            cuisine plus maison et de produits moins transformés. En parallèle, la part du gaz
            tombe de {gasShare2019} % à {gasShareTarget} %, par électrification.
          nl: >
            Dit is de enige post die het scenario laat *stijgen*: {changePct} %, in naam van
            meer zelf koken en minder verwerkte producten. Tegelijk daalt het gasaandeel van
            {gasShare2019} % naar {gasShareTarget} %, door elektrificatie.
          en: >
            This is the only service the scenario pushes *up*: {changePct}%, in the name of
            more home cooking and less processed food. In parallel the gas share falls from
            {gasShare2019}% to {gasShareTarget}%, through electrification.
        source: nW-BE §2.1.2
    historyAbsent: true
    historyNote:
      fr: Aucune série observée de la consommation de cuisson n'a été exportée pour l'atelier ; seule la tendance moyenne 2000-2023 citée dans le rapport est connue.
      nl: Er is voor de workshop geen waargenomen reeks van het kookverbruik geëxporteerd; alleen de gemiddelde trend 2000-2023 uit het rapport is bekend.
      en: No observed series of cooking consumption was exported for the workshop; only the 2000-2023 average trend quoted in the report is known.
    justification:
      fr: >
        négaWatt retient {targetValue} kWh par ménage et par an, soit {changePct} % — le seul
        poste du logement que le scénario fait délibérément monter. La logique est celle d'une
        alimentation moins transformée et davantage préparée à la maison : l'énergie qui
        disparaît de l'industrie agroalimentaire et de la restauration réapparaît, en partie,
        dans la cuisine. S'y ajoute une hypothèse d'efficacité : la part du gaz dans la
        cuisson tombe de {gasShare2019} % à {gasShareTarget} %, au profit de l'induction et du
        four électrique.
      nl: >
        negaWatt kiest {targetValue} kWh per huishouden per jaar, ofwel {changePct} % — de
        enige post van de woning die het scenario doelbewust laat stijgen. De logica is die van
        minder verwerkte en meer thuis bereide voeding: de energie die uit de voedingsindustrie
        en de horeca verdwijnt, komt deels terug in de keuken. Daar komt een
        efficiëntieveronderstelling bij: het gasaandeel in het koken daalt van
        {gasShare2019} % naar {gasShareTarget} %, ten gunste van inductie en de elektrische
        oven.
      en: >
        negaWatt settles on {targetValue} kWh per household per year, i.e. {changePct}% — the
        only housing service the scenario deliberately pushes up. The logic is one of less
        processed food prepared more often at home: the energy that leaves the food industry
        and the catering trade reappears, in part, in the kitchen. An efficiency assumption
        comes with it: the gas share of cooking falls from {gasShare2019}% to
        {gasShareTarget}%, in favour of induction and the electric oven.
    debate:
      fr: >
        C'est le seul levier du scénario dont la sobriété *augmente* la consommation du secteur
        étudié. Le gain supposé se trouve hors du modèle — moins d'industrie agroalimentaire,
        moins de restauration, moins de gaspillage — et n'est donc ni chiffré ni vérifiable
        ici. Le poste est petit ({cookingSharePct} % du thermique), mais l'argument, lui, est
        structurel : une sobriété peut en financer une autre.
      nl: >
        Dit is de enige hefboom van het scenario waarvan de soberheid het verbruik van de
        onderzochte sector *verhoogt*. De veronderstelde winst zit buiten het model — minder
        voedingsindustrie, minder horeca, minder verspilling — en is hier dus niet becijferd en
        niet verifieerbaar. De post is klein ({cookingSharePct} % van het thermische deel),
        maar het argument is structureel: de ene soberheid kan de andere financieren.
      en: >
        This is the only lever in the scenario where sufficiency *raises* the consumption of
        the sector under study. The assumed gain sits outside the model — less food industry,
        less catering, less waste — and is therefore neither quantified nor checkable here. The
        service is small ({cookingSharePct}% of the thermal total), but the argument is
        structural: one kind of sufficiency can pay for another.

  # ------------------------------------------------------------ 7 -------------
  district-heat:
    short:
      fr: Réseaux de chaleur
      nl: Warmtenetten
      en: District heating
    question:
      fr: "Quelle part de la chaleur des logements pourrait être réalistement livrée par un réseau de chaleur en 2050 ?"
      nl: "Welk aandeel van de warmte voor woningen zou in 2050 realistisch gezien door een warmtenet kunnen worden geleverd?"
      en: "What share of residential heating could realistically be supplied by a district heating network by 2050?"
    subtitle:
      fr: "Chauffage des locaux et eau chaude sanitaire livrés par un réseau de chaleur plutôt que par un système individuel. Ce levier ne change pas la demande, seulement sa source."
      nl: "Ruimteverwarming en sanitair warm water geleverd door een warmtenet in plaats van door een individuele ketel. Deze hefboom verandert de vraag niet, alleen de bron."
      en: "Space heating and domestic hot water delivered by a district heating network rather than by an individual boiler. This lever does not change demand, only its source."
    tangible:
      fr: "{value} % de la chaleur des logements livrée par un réseau."
      nl: "{value} % van de warmte in woningen geleverd door een net."
      en: "{value}% of home heat delivered by a network."
    facts:
      - kind: structure
        text:
          fr: >
            En Belgique, les réseaux de chaleur sont anecdotiques : {refValue} % de la chaleur
            des logements en 2019, soit {servedTwh2019} TWh sur les {networkableTwh} TWh
            raccordables — chauffage plus eau chaude, eux-mêmes {networkableSharePct} % de
            l'énergie thermique du logement. Le froid de réseau est hors du modèle.
          nl: >
            In België zijn warmtenetten anekdotisch: {refValue} % van de warmte in woningen in
            2019, ofwel {servedTwh2019} TWh op de {networkableTwh} TWh die aansluitbaar zijn —
            verwarming plus warm water, samen {networkableSharePct} % van de thermische energie
            van de woning. Koudenetten vallen buiten het model.
          en: >
            In Belgium district heating is anecdotal: {refValue}% of home heat in 2019, i.e.
            {servedTwh2019} TWh out of the {networkableTwh} TWh that could be networked —
            space heating plus hot water, themselves {networkableSharePct}% of the home's
            thermal energy. District cooling is outside the model.
        source: nW-BE §2.1.3 (JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            Ailleurs, c'est la norme et non l'exception : la chaleur de réseau couvre 40 % de
            toute l'énergie livrée aux ménages danois et 38 % au Suède, contre 8,6 % dans
            l'UE27 et 0,2 % en Belgique. Attention à la base : ces chiffres portent sur
            l'ensemble de l'énergie des ménages, appareils compris, donc sur un dénominateur
            plus large que cette question.
          nl: >
            Elders is het de regel en niet de uitzondering: netwarmte dekt 40 % van alle aan
            Deense huishoudens geleverde energie en 38 % in Zweden, tegenover 8,6 % in de EU27
            en 0,2 % in België. Let op de basis: die cijfers gaan over alle energie van de
            huishoudens, toestellen inbegrepen, dus over een ruimere noemer dan deze vraag.
          en: >
            Elsewhere it is the rule rather than the exception: network heat covers 40% of all
            the energy delivered to Danish households and 38% in Sweden, against 8.6% in the
            EU27 and 0.2% in Belgium. Mind the basis: these figures cover all household
            energy, appliances included, so a wider denominator than this question.
        source: "Eurostat, nrg_bal_c — derived heat as a share of household final energy consumption, 2023"
        url: https://ec.europa.eu/eurostat/databrowser/view/nrg_bal_c/default/table
      - kind: structure
        text:
          fr: >
            Le plafond n'est pas technique mais géographique : l'habitat belge est dispersé, et
            un réseau demande une densité de chaleur. Des travaux récents situent le potentiel
            technico-économique du résidentiel belge à {potentialPct} % de la demande de
            chaleur à l'horizon 2050 ; PATHS2050 (EnergyVille) retient {paths2050Pct} % pour
            l'ensemble des bâtiments.
          nl: >
            Het plafond is niet technisch maar geografisch: de Belgische bebouwing is verspreid,
            en een net vraagt warmtedichtheid. Recent werk plaatst het technisch-economische
            potentieel van de Belgische woningen op {potentialPct} % van de warmtevraag tegen
            2050; PATHS2050 (EnergyVille) houdt {paths2050Pct} % aan voor alle gebouwen samen.
          en: >
            The ceiling is geographic rather than technical: Belgian settlement is dispersed,
            and a network needs heat density. Recent work puts the techno-economic potential of
            Belgian housing at {potentialPct}% of heat demand by 2050; PATHS2050 (EnergyVille)
            uses {paths2050Pct}% for all buildings together.
        source: "Lund et al. (2025), District heating in clean energy systems, Nature Reviews Clean Technology; EnergyVille PATHS2050 (2025)"
        url: https://doi.org/10.1038/s44359-025-00076-8
      - kind: caution
        text:
          fr: >
            Ce levier ne modifie pas la demande d'énergie utile mesurée ici : c'est pourquoi
            cet écran n'affiche pas l'encadré d'effet des autres questions. Le bénéfice est en
            amont —
            géothermie, chaleur fatale industrielle, cogénération biomasse, stockage saisonnier
            — dans une partie du système que ce modèle de demande ne représente pas. En 2019,
            les réseaux belges ont livré {servedTwh2019} TWh aux logements, de quoi chauffer à
            peu près un logement sur 400.
          nl: >
            Deze hefboom wijzigt de hier gemeten nuttige energievraag niet: daarom toont dit
            scherm het effectkader van de andere vragen niet. Het voordeel zit stroomopwaarts —
            geothermie, industriële restwarmte, biomassawarmtekracht, seizoensopslag — in een
            deel van het systeem dat dit vraagmodel niet weergeeft. In 2019 leverden de
            Belgische netten {servedTwh2019} TWh aan de woningen, genoeg voor ongeveer één
            woning op 400.
          en: >
            This lever does not change the useful energy demand measured here: that is why this
            screen carries none of the effect box the other questions show. The benefit sits
            upstream — geothermal energy,
            industrial waste heat, biomass cogeneration, seasonal storage — in a part of the
            system this demand model does not represent. In 2019 Belgian networks delivered
            {servedTwh2019} TWh to homes, enough for roughly one dwelling in 400.
        source: nW-BE §2.1.3, arithmetic on the 2019 value
    historyAbsent: true
    historyNote:
      fr: Aucune série observée de la part des réseaux de chaleur dans les logements belges n'a été exportée pour l'atelier ; seul le point de 2019 est connu, et il est proche de zéro.
      nl: Er is voor de workshop geen waargenomen reeks van het aandeel warmtenetten in Belgische woningen geëxporteerd; alleen het punt van 2019 is bekend, en het ligt dicht bij nul.
      en: No observed series of the district-heating share of Belgian homes was exported for the workshop; only the 2019 point is known, and it is close to zero.
    justification:
      fr: >
        négaWatt retient {targetValue} % de la chaleur des bâtiments livrée par un réseau en
        2050, contre {refValue} % en 2019 — soit {networkableTwhTarget} TWh de chauffage et
        d'eau chaude raccordés côté logement. C'est un déploiement massif à l'échelle belge,
        mais volontairement en deçà du potentiel technico-économique de {potentialPct} %, jugé
        hors d'atteinte, et un peu au-dessus des {paths2050Pct} % de PATHS2050. La motivation
        n'est pas la sobriété mais le couplage sectoriel : un réseau permet des pompes à
        chaleur industrielles sur géothermie, chaleur fatale ou cogénération biomasse, et un
        stockage thermique saisonnier qui donne de la flexibilité à tout le système.
      nl: >
        negaWatt kiest {targetValue} % van de gebouwwarmte geleverd door een net in 2050,
        tegenover {refValue} % in 2019 — ofwel {networkableTwhTarget} TWh verwarming en warm
        water aangesloten aan de woningzijde. Dat is een massale uitrol op Belgische schaal,
        maar bewust onder het technisch-economische potentieel van {potentialPct} %, dat als
        onhaalbaar wordt beschouwd, en iets boven de {paths2050Pct} % van PATHS2050. De
        motivering is niet soberheid maar sectorkoppeling: een net maakt industriële
        warmtepompen op geothermie, restwarmte of biomassawarmtekracht mogelijk, en
        seizoensopslag die het hele systeem flexibiliteit geeft.
      en: >
        negaWatt settles on {targetValue}% of building heat delivered by a network in 2050,
        against {refValue}% in 2019 — that is {networkableTwhTarget} TWh of space heating and
        hot water connected on the housing side. This is a massive deployment on the Belgian
        scale, but deliberately below the {potentialPct}% techno-economic potential, judged out
        of reach, and a little above PATHS2050's {paths2050Pct}%. The motivation is not
        sufficiency but sector coupling: a network makes industrial heat pumps on geothermal
        energy, waste heat or biomass cogeneration possible, along with seasonal thermal
        storage that gives the whole system flexibility.
    debate:
      fr: >
        Passer de presque rien à un logement sur sept en trente ans suppose un rythme de
        chantier que rien, en Belgique, n'a jamais approché — et le potentiel de
        {potentialPct} % est technico-économique, pas déployé. Le levier a par ailleurs une
        propriété inhabituelle : il ne change rien à la demande, donc rien au modèle de
        demande. Tout son intérêt est dans la partie du système que cet atelier ne montre pas.
      nl: >
        Van bijna niets naar één woning op zeven in dertig jaar veronderstelt een bouwtempo dat
        in België nooit ook maar benaderd is — en het potentieel van {potentialPct} % is
        technisch-economisch, niet uitgerold. De hefboom heeft bovendien een ongewone
        eigenschap: hij verandert niets aan de vraag, en dus niets aan het vraagmodel. Zijn hele
        belang zit in het deel van het systeem dat deze workshop niet toont.
      en: >
        Going from almost nothing to one dwelling in seven in thirty years assumes a build rate
        that nothing in Belgium has ever come close to — and the {potentialPct}% potential is
        techno-economic, not deployed. The lever also has an unusual property: it changes
        nothing about demand, and therefore nothing in the demand model. Its whole point lies
        in the part of the system this workshop does not show.
