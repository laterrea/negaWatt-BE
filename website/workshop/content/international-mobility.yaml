levers:

  # ------------------------------------------------------------ 1 -------------
  long-haul-flights:
    short:
      fr: Voyages long-courriers
      nl: Langeafstandsreizen
      en: Long-haul trips
    question:
      fr: "Combien de voyages long-courriers par personne et par vie est un objectif 2050 réaliste ?"
      nl: "Hoeveel langeafstandsreizen per persoon per leven is een realistisch doel voor 2050?"
      en: "How many long-haul trips per person per lifetime is a realistic 2050 objective?"
    subtitle:
      fr: "Aller-retour de {tripKm} km — Bruxelles-Shanghai ou Bruxelles-Los Angeles — sur une vie de {lifeYears} ans, moyenne sur toute la population. En 2019, tout le long-courrier belge revenait à {pctPop2019} % des habitants faisant ce voyage une fois dans l'année."
      nl: "Retourreis van {tripKm} km — Brussel-Shanghai of Brussel-Los Angeles — over een leven van {lifeYears} jaar, gemiddeld over de hele bevolking. In 2019 kwam alle Belgische langeafstandsluchtvaart neer op {pctPop2019} % van de inwoners die die reis één keer in het jaar maakten."
      en: "A return trip of {tripKm} km — Brussels to Shanghai or Los Angeles — over a lifetime of {lifeYears} years, averaged over the whole population. In 2019, all of Belgium's long-haul flying came to {pctPop2019}% of inhabitants making that trip once in the year."
    tangible:
      fr: "{value} voyages long-courriers sur une vie entière, pour chaque habitant en moyenne."
      nl: "{value} langeafstandsreizen in een heel leven, voor elke inwoner gemiddeld."
      en: "{value} long-haul trips in a whole lifetime, for every inhabitant on average."
    facts:
      - kind: trend
        text:
          fr: >
            Voici la seule courbe aérienne réellement mesurée pour la Belgique : tous vols
            confondus, long-courrier et court-courrier ensemble, en kilomètres par personne
            et par jour. Elle monte sans interruption jusqu'en 2019, s'effondre en 2020,
            et n'a pas retrouvé son niveau d'avant. Elle ne sépare pas les deux types de
            vol : le classeur qui porte cette répartition n'est pas public.
          nl: >
            Dit is de enige echt gemeten luchtvaartcurve voor België: alle vluchten samen,
            lange en korte afstand, in kilometers per persoon per dag. Ze stijgt
            onafgebroken tot 2019, stort in 2020 in, en heeft haar oude niveau niet
            teruggevonden. Ze scheidt de twee vluchttypes niet: het werkboek met die
            opsplitsing is niet publiek.
          en: >
            This is the only genuinely measured aviation curve for Belgium: all flights
            together, long-haul and short-haul, in kilometres per person per day. It rises
            without interruption to 2019, collapses in 2020, and has not recovered its
            earlier level. It does not separate the two haul types: the workbook carrying
            that split is not public.
        source: JRC-IDEES-2023 (passenger transport); population Statbel
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: aviation_km_day
          decimals: 1
          caption:
            fr: Avion, tous vols confondus, par habitant, de 2000 à 2023
            nl: Vliegtuig, alle vluchten samen, per inwoner, van 2000 tot 2023
            en: Air travel, both haul types together, per inhabitant, 2000 to 2023
      - kind: benchmark
        label:
          fr: Ailleurs
          nl: Elders
          en: Elsewhere
        text:
          fr: >
            Le vol est très inégalement réparti, et de très loin. En 2018, 11 % de la
            population mondiale a pris l'avion et au plus 4 % un vol international ; le
            centile des voyageurs les plus fréquents — au plus 1 % de l'humanité — pèse
            probablement plus de la moitié des émissions de l'aviation de passagers. Un
            seul utilisateur d'avion privé peut émettre jusqu'à 7 500 tonnes de CO₂ par an.
          nl: >
            Vliegen is bijzonder ongelijk verdeeld, en dat bij lange na niet een beetje. In
            2018 nam 11 % van de wereldbevolking het vliegtuig en ten hoogste 4 % een
            internationale vlucht; het percentiel van de meest frequente vliegers — ten
            hoogste 1 % van de mensheid — weegt vermoedelijk meer dan de helft van de
            uitstoot van de passagiersluchtvaart. Eén enkele gebruiker van een privéjet kan
            tot 7.500 ton CO₂ per jaar uitstoten.
          en: >
            Flying is very unequally shared, and by a very long way. In 2018, 11% of the
            world's population travelled by air and at most 4% took an international
            flight; the percentile of the most frequent fliers — at most 1% of humanity —
            likely accounts for more than half of the emissions from passenger air travel.
            A single user of a private aircraft can emit up to 7,500 tonnes of CO₂ a year.
        source: "Gössling & Humpe (2020), The global scale, distribution and growth of aviation, Global Environmental Change 65: 102194"
        url: https://doi.org/10.1016/j.gloenvcha.2020.102194
      - kind: benchmark
        label:
          fr: Qui ne vole pas
          nl: Wie niet vliegt
          en: Who does not fly
        text:
          fr: >
            Vu depuis l'autre bout : en 2019, une modélisation de l'ICCT estime que 76 % des
            habitants de la planète n'ont pris aucun vol dans l'année. L'écart suit le
            revenu du pays — 51 % de non-voyageurs dans les pays à revenu élevé, 98 % dans
            les pays à faible revenu — et les 20 % les plus riches du monde effectuent
            environ 80 % des vols. Les voyageurs très fréquents, plus de six vols par an,
            sont 2 % de l'humanité.
          nl: >
            Van de andere kant bekeken: voor 2019 schat een model van het ICCT dat 76 % van
            de wereldbevolking dat jaar geen enkele vlucht nam. Het verschil volgt het
            inkomen van het land — 51 % niet-vliegers in landen met een hoog inkomen, 98 %
            in landen met een laag inkomen — en de rijkste 20 % van de wereld maakt zowat
            80 % van alle vluchten. Zeer frequente vliegers, meer dan zes vluchten per jaar,
            zijn 2 % van de mensheid.
          en: >
            Seen from the other end: for 2019, an ICCT model estimates that 76% of the
            world's inhabitants took no flight at all in the year. The gap follows country
            income — 51% non-fliers in high-income countries, 98% in low-income ones — and
            the world's richest 20% make about 80% of all flights. Very frequent fliers,
            more than six flights a year, are 2% of humanity.
        source: "ICCT (2022), Aviation climate finance using a global frequent flying levy"
        url: https://theicct.org/wp-content/uploads/2022/09/global-aviation-frequent-flying-levy-sep22.pdf
        chart:
          kind: bars
          unit: "% who took no flight in 2019"
          decimals: 0
          highlight: 0
          labels:
            - {fr: Monde, nl: Wereld, en: World}
            - {fr: Revenu élevé, nl: Hoog inkomen, en: High income}
            - {fr: Moyen supérieur, nl: Hoger middeninkomen, en: Upper middle}
            - {fr: Moyen inférieur, nl: Lager middeninkomen, en: Lower middle}
            - {fr: Revenu faible, nl: Laag inkomen, en: Low income}
          y: [76, 51, 69, 88, 98]
          caption:
            fr: Part de la population qui n'a pris aucun vol en 2019, par groupe de revenu du pays
            nl: Aandeel van de bevolking dat in 2019 geen enkele vlucht nam, per inkomensgroep van het land
            en: Share of the population taking no flight in 2019, by country income group
      - kind: caution
        text:
          fr: >
            Le chiffre le plus cité sur ce sujet — « 80 % de l'humanité n'a *jamais* pris
            l'avion » — ne repose sur aucune donnée. Il remonte à une phrase du PDG de
            Boeing sur un plateau de télévision en décembre 2017, reprise depuis sans
            source. Personne ne mesure le nombre de personnes qui n'ont jamais volé de leur
            vie : les compagnies comptent des passagers embarqués, pas des individus. Les
            chiffres solides portent tous sur une seule année.
          nl: >
            Het meest geciteerde cijfer over dit onderwerp — "80 % van de mensheid heeft
            *nooit* gevlogen" — berust op geen enkel gegeven. Het gaat terug op een uitspraak
            van de CEO van Boeing in een televisieprogramma in december 2017, sindsdien
            zonder bron overgenomen. Niemand meet hoeveel mensen in hun leven nooit gevlogen
            hebben: luchtvaartmaatschappijen tellen ingestapte passagiers, geen personen. De
            stevige cijfers gaan allemaal over één jaar.
          en: >
            The most quoted figure on this subject — "80% of humanity has *never* flown" —
            rests on no data at all. It goes back to a remark by Boeing's CEO on a television
            show in December 2017, repeated ever since without a source. Nobody measures how
            many people have never flown in their life: airlines count boarded passengers,
            not individuals. The solid figures are all about a single year.
        source: "Our World in Data, Climate change and flying (note on the origin of the 80% figure)"
        url: https://ourworldindata.org/carbon-footprint-flying
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario retient {changePct} % de kilomètres long-courriers par personne. En
            personnes : {peopleTarget} voyages de {tripKm} km par an, soit
            {pctPopTarget:d1} % de la population, ou un voyage par personne tous les
            {yearsPerTripTarget} ans. Le long-courrier monte à {shareAirPkmTarget} % des
            voyageurs-kilomètres aériens, parce que le court-courrier baisse encore plus.
          nl: >
            Het scenario kiest {changePct} % langeafstandskilometers per persoon. In
            personen: {peopleTarget} reizen van {tripKm} km per jaar, ofwel
            {pctPopTarget:d1} % van de bevolking, of één reis per persoon elke
            {yearsPerTripTarget} jaar. Langeafstand stijgt naar {shareAirPkmTarget} % van de
            reizigerskilometers door de lucht, omdat de korte afstand nog sterker daalt.
          en: >
            The scenario settles on {changePct}% of long-haul kilometres per person. In
            people: {peopleTarget} trips of {tripKm} km a year, or {pctPopTarget}% of the
            population, or one trip per person every {yearsPerTripTarget} years. Long-haul
            rises to {shareAirPkmTarget}% of air passenger-kilometres, because short-haul
            falls further still.
        source: nW-BE §2.1
    historyAbsent: true
    historyNote:
      fr: La seule série aérienne mesurée dans le projet mélange long-courrier et court-courrier ; le classeur JRC-IDEES « Transport », qui contient la répartition, n'est pas dans le dépôt.
      nl: De enige gemeten luchtvaartreeks in het project mengt lange en korte afstand; het JRC-IDEES-werkboek "Transport", dat de opsplitsing bevat, zit niet in de repository.
      en: The only measured aviation series in the project mixes long-haul and short-haul; the JRC-IDEES "Transport" workbook, which holds the split, is not in the repository.
    justification:
      fr: >
        négaWatt retient {targetValue} voyages long-courriers par vie, contre {refValue} en
        2019, soit {changePct} % de kilomètres par personne. Le raisonnement est assumé et
        chiffré dans le rapport : le report modal est « à peine faisable » sur ces
        distances et la décarbonation reste incertaine — les carburants durables (SAF) sont
        en quantité limitée, l'hydrogène et l'électrique ne sont pas à cette échelle — donc
        « une réduction des très longues distances apparaît essentielle ». En personnes,
        cela fait passer de {people2019} à {peopleTarget} voyages de {tripKm} km par an,
        soit de {pctPop2019} % à {pctPopTarget:d1} % de la population, ou un voyage par
        personne tous les {yearsPerTripTarget} ans — près de cinq fois sur une vie. Le
        rapport juge cet objectif « à la fois réaliste et socialement acceptable ».
      nl: >
        negaWatt kiest {targetValue} langeafstandsreizen per leven, tegenover {refValue} in
        2019, ofwel {changePct} % kilometers per persoon. De redenering staat becijferd in
        het rapport: modale verschuiving is op deze afstanden "nauwelijks haalbaar" en de
        decarbonisatie blijft onzeker — duurzame brandstoffen (SAF) zijn beperkt beschikbaar,
        waterstof en elektrisch zijn niet op deze schaal — dus "een vermindering van de zeer
        lange afstanden lijkt essentieel". In personen gaat dat van {people2019} naar
        {peopleTarget} reizen van {tripKm} km per jaar, ofwel van {pctPop2019} % naar
        {pctPopTarget:d1} % van de bevolking, of één reis per persoon elke
        {yearsPerTripTarget} jaar — bijna vijf keer in een leven. Het rapport vindt dit doel
        "zowel realistisch als sociaal aanvaardbaar".
      en: >
        negaWatt settles on {targetValue} long-haul trips per lifetime, against {refValue} in
        2019, i.e. {changePct}% of kilometres per person. The reasoning is stated and
        quantified in the report: modal shift is "hardly feasible" at these distances and
        decarbonisation remains uncertain — sustainable fuels (SAF) are in limited supply,
        hydrogen and electric are not at this scale — so "a reduction in very long-distance
        travel appears essential". In people, that takes it from {people2019} to
        {peopleTarget} trips of {tripKm} km a year, from {pctPop2019}% to {pctPopTarget}% of
        the population, or one trip per person every {yearsPerTripTarget} years — nearly five
        times over a lifetime. The report judges this objective "both realistic and socially
        acceptable".
    debate:
      fr: >
        « Socialement acceptable » suppose une réponse à la question que le modèle ne pose
        pas : *pour qui* ? Une moyenne par habitant ne dit rien de la répartition, et la
        répartition est extrêmement inégale — au plus 1 % de la population mondiale pour la
        moitié des émissions. Réduire de {changePct:abs} % la moyenne peut vouloir dire
        rationner le seul voyage d'une vie d'un ménage modeste, ou supprimer le dixième
        voyage annuel d'un cadre. Ce sont deux politiques opposées, et le scénario ne
        choisit pas. À l'inverse, l'hypothèse ne suppose aucune rupture technologique, ce
        qui la rend plus robuste que la plupart des autres.
      nl: >
        "Sociaal aanvaardbaar" veronderstelt een antwoord op de vraag die het model niet
        stelt: *voor wie*? Een gemiddelde per inwoner zegt niets over de verdeling, en de
        verdeling is uiterst ongelijk — ten hoogste 1 % van de wereldbevolking voor de helft
        van de uitstoot. Het gemiddelde met {changePct:abs} % verlagen kan betekenen dat de
        enige reis van een leven van een bescheiden huishouden gerantsoeneerd wordt, of dat
        de tiende jaarlijkse reis van een kaderlid wegvalt. Dat zijn twee tegengestelde
        beleidskeuzes, en het scenario kiest niet. Omgekeerd veronderstelt de hypothese geen
        enkele technologische doorbraak, wat haar robuuster maakt dan de meeste andere.
      en: >
        "Socially acceptable" presumes an answer to the question the model does not ask: *for
        whom*? An average per inhabitant says nothing about the distribution, and the
        distribution is extremely unequal — at most 1% of the world's population for half the
        emissions. Cutting the average by {changePct:abs}% may mean rationing a modest
        household's one trip of a lifetime, or removing an executive's tenth trip of the
        year. Those are opposite policies, and the scenario does not choose. Conversely, the
        assumption requires no technological breakthrough, which makes it more robust than
        most of the others.

