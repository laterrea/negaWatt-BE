# -----------------------------------------------------------------------------
# The +/- effects chart on the summary screen. Enabled because every lever of this
# topic carries a usable single-lever response (D40). Air freight included: its
# tonne-kilometres leave this topic's energy proportionally, and where they land
# (rail, in the inland topic) is stated on the card rather than in the bar.
summaryChart:
  enabled: true
  unit: TWh
  decimals: 2
  caption:
    fr: >
      Ce que chacune de vos réponses fait, à elle seule, à la demande d'énergie de
      l'aviation belge en 2050 — par rapport au maintien du niveau d'aujourd'hui pour le
      même indicateur.
    nl: >
      Wat elk van jullie antwoorden op zichzelf doet met de energievraag van de Belgische
      luchtvaart in 2050 — vergeleken met het behoud van het huidige niveau voor dezelfde
      indicator.
    en: >
      What each of your answers does, on its own, to the energy demand of Belgian aviation
      in 2050 — compared with keeping today's level of the same indicator.
  note:
    fr: >
      Chaque barre est exacte pour son levier pris seul, les autres restant à leur valeur
      du scénario. Les leviers se combinent de façon multiplicative, donc leur somme n'est
      qu'un ordre de grandeur.
    nl: >
      Elke balk is exact voor zijn eigen hefboom alleen, met de andere op hun
      scenariowaarde. De hefbomen werken multiplicatief samen, dus hun som is enkel een
      grootteorde.
    en: >
      Each bar is exact for its own lever taken alone, with the others left at their
      scenario value. The levers compound multiplicatively, so their sum is an order of
      magnitude only.


