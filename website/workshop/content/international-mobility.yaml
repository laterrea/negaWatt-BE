  short-haul-flights:
    short:
      fr: Voyages court-courriers
      nl: Korteafstandsreizen
      en: Short-haul trips
    question:
      fr: "Combien de voyages court-courriers par personne et par vie est un objectif 2050 réaliste ?"
      nl: "Hoeveel korteafstandsreizen per persoon per leven is een realistisch doel voor 2050?"
      en: "How many short-haul trips per person per lifetime is a realistic 2050 objective?"
    subtitle:
      fr: "Aller-retour de {tripKm} km — Bruxelles-Barcelone — sur une vie de {lifeYears} ans, moyenne sur toute la population. Vols intra-européens."
      nl: "Retourreis van {tripKm} km — Brussel-Barcelona — over een leven van {lifeYears} jaar, gemiddeld over de hele bevolking. Intra-Europese vluchten."
      en: "A return trip of {tripKm} km — Brussels to Barcelona — over a lifetime of {lifeYears} years, averaged over the whole population. Intra-European flights."
    tangible:
      fr: "{value} voyages court-courriers sur une vie entière, pour chaque habitant en moyenne."
      nl: "{value} korteafstandsreizen in een heel leven, voor elke inwoner gemiddeld."
      en: "{value} short-haul trips in a whole lifetime, for every inhabitant on average."
    facts:
      - kind: trend
        text:
          fr: >
            La seule courbe aérienne mesurée mélange les deux distances : tous vols
            confondus, en kilomètres par personne et par jour. L'intra-européen en
            représente {shareAirPkm2019} % des voyageurs-kilomètres, mais bien plus que
            cela en nombre de vols, puisque les trajets sont huit fois plus courts.
          nl: >
            De enige gemeten luchtvaartcurve mengt de twee afstanden: alle vluchten samen,
            in kilometers per persoon per dag. Intra-Europees is daarvan
            {shareAirPkm2019} % van de reizigerskilometers, maar veel meer dan dat in
            aantal vluchten, omdat de ritten acht keer korter zijn.
          en: >
            The only measured aviation curve mixes the two distances: all flights together,
            in kilometres per person per day. Intra-European is {shareAirPkm2019}% of those
            passenger-kilometres, but far more than that in number of flights, since the
            journeys are eight times shorter.
        source: JRC-IDEES-2023 (passenger transport); population Statbel
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: aviation_km_day
          decimals: 1
          caption:
            fr: Avion, tous vols confondus, par habitant, de 2000 à 2023
            nl: Vliegtuig, alle vluchten samen, per inwoner, van 2000 tot 2023
            en: Air travel, both haul types together, per inhabitant, 2000 to 2023
      - kind: structure
        text:
          fr: >
            Une surprise du modèle : en 2019, un vol intra-européen consommait
            {srtKwhPkm2019} kWh par voyageur-kilomètre, contre {carKwhPkm2019} pour la
            voiture. Attention à la base : les deux chiffres sont *par passager transporté*,
            et la voiture belge moyenne ne transporte que {carOccupancy2019} personne. La
            comparaison ci-dessus est donc celle d'un avion plein face à une voiture qui
            n'emmène qu'une personne ; à deux dans la voiture, l'avion consomme déjà près
            du double par personne, à quatre près du quadruple. Ce qui rend l'avion
            problématique n'est donc pas son rendement par kilomètre, c'est le nombre de
            kilomètres qu'il rend possibles en un week-end.
          nl: >
            Een verrassing van het model: in 2019 verbruikte een intra-Europese vlucht
            {srtKwhPkm2019} kWh per reizigerskilometer, tegenover {carKwhPkm2019} voor de
            auto. Let op de basis: beide cijfers zijn *per vervoerde passagier*, en de
            gemiddelde Belgische auto vervoert maar {carOccupancy2019} persoon. De
            vergelijking hierboven zet dus een vol vliegtuig naast een auto met één
            inzittende; met twee in de auto verbruikt het vliegtuig al bijna het dubbele
            per persoon, met vier bijna het viervoudige. Wat het vliegtuig problematisch
            maakt is dus niet het rendement per kilometer, maar het aantal kilometers dat
            het in één weekend mogelijk maakt.
          en: >
            A surprise from the model: in 2019 an intra-European flight used
            {srtKwhPkm2019} kWh per passenger-kilometre, against {carKwhPkm2019} for the
            car. Mind the basis: both figures are *per passenger carried*, and the average
            Belgian car carries {carOccupancy2019} person. What the comparison really sets
            side by side is a full aircraft against a car taking one person; with two
            aboard the car, flying already costs nearly twice as much per person, with four
            nearly four times. What makes flying a problem is therefore not its efficiency
            per kilometre but the number of kilometres it makes possible in a weekend.
        source: nW-BE §2.1 and §2.3 (JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            L'avion est très inégalement partagé, y compris en Europe de l'Ouest. Dans une
            enquête menée auprès de plus de 12 000 personnes en Belgique, en France, en
            Allemagne, en Espagne, aux Pays-Bas et au Royaume-Uni, 52 % des personnes ne
            prennent l'avion aucune fois dans l'année et 11 % le prennent plus de trois
            fois. Chez les ménages disposant de moins de 20 000 € par an, 70 % ne volent
            pas du tout ; chez ceux de plus de 100 000 €, ils ne sont que 20 %, et 35 %
            font au moins trois allers-retours par an.
          nl: >
            Vliegen is zeer ongelijk verdeeld, ook in West-Europa. In een enquête bij meer
            dan 12.000 mensen in België, Frankrijk, Duitsland, Spanje, Nederland en het
            Verenigd Koninkrijk neemt 52 % van de mensen het vliegtuig geen enkele keer in
            het jaar en 11 % meer dan drie keer. Bij huishoudens met minder dan 20.000 € per
            jaar vliegt 70 % helemaal niet; bij die met meer dan 100.000 € is dat maar 20 %,
            en 35 % maakt minstens drie retourvluchten per jaar.
          en: >
            Flying is very unequally shared, in western Europe too. In a survey of more than
            12,000 people in Belgium, France, Germany, Spain, the Netherlands and the United
            Kingdom, 52% of people do not fly at all in a given year and 11% fly more than
            three times. Among households on less than €20,000 a year, 70% do not fly at
            all; among those above €100,000 only 20% do not, and 35% take at least three
            return flights a year.
        source: "More in Common, Europe Talks Flying (2024), analysed by the New Economics Foundation, A frequent flying levy in Europe (October 2024)"
        url: https://neweconomics.org/2024/10/a-frequent-flying-levy-in-europe
      - kind: benchmark
        label:
          fr: Répartition des vols
          nl: Verdeling van de vluchten
          en: How flights are shared
        text:
          fr: >
            Mise en courbe, cette inégalité prend une forme reconnaissable. Au Royaume-Uni,
            le seul pays d'Europe où douze ans d'enquêtes auprès des ménages permettent de
            la tracer : 59 % des ménages ne prennent aucun vol dans une année moyenne, les
            20 % les plus voyageurs en prennent 76 % et le 1 % le plus voyageur en prend
            10 %. L'indice de Gini des vols y vaut 0,75.
          nl: >
            In een curve krijgt die ongelijkheid een herkenbare vorm. In het Verenigd
            Koninkrijk, het enige Europese land waar twaalf jaar huishoudenquêtes toelaten
            ze te tekenen: 59 % van de huishoudens neemt in een gemiddeld jaar geen enkele
            vlucht, de 20 % meest reizende huishoudens nemen er 76 % en het meest reizende
            procent neemt er 10 %. De Gini-index van de vluchten bedraagt er 0,75.
          en: >
            Drawn as a curve, that inequality takes a recognisable shape. In the United
            Kingdom, the one European country where twelve years of household surveys make
            it drawable: 59% of households take no flight in an average year, the 20% who
            travel most take 76% of the flights and the top 1% takes 10%. The Gini index of flights is 0.75.
        source: "Büchs & Mattioli (2021), Trends in air travel inequality in the UK, Travel Behaviour and Society 25, 92-101"
        url: https://eprints.whiterose.ac.uk/id/eprint/174427/1/1-s2.0-S2214367X21000466-main.pdf
        chart:
          kind: line
          unit: "% of flights taken, cumulative"
          decimals: 0
          x: [0, 59, 80, 90, 99, 100]
          y: [0, 0, 24, 49, 90, 100]
          caption:
            fr: Ménages britanniques classés du moins au plus voyageur (axe horizontal, 0 à 100 %) et part cumulée des vols qu'ils prennent
            nl: Britse huishoudens gerangschikt van minst naar meest reizend (horizontale as, 0 tot 100 %) en het cumulatieve aandeel van de vluchten dat zij nemen
            en: UK households ranked from least to most travelling (horizontal axis, 0 to 100%) and the cumulative share of flights they take
      - kind: lever
        label:
          fr: Ce que le train pourrait reprendre
          nl: Wat de trein zou kunnen overnemen
          en: What rail could take over
        text:
          fr: >
            Beaucoup de vols, peu d'énergie. En 2019, 24 % des décollages européens
            faisaient moins de 500 km, mais ne pesaient que 3,8 % du CO₂ de l'aviation ;
            les vols de plus de 4 000 km, 6 % des décollages, en pesaient 48 %. Interdire
            les vols les plus courts touche donc énormément de trajets et très peu
            d'énergie — c'est entre 500 et 1 500 km, la moitié des décollages et un
            cinquième du CO₂, que se joue vraiment le report vers le train.
          nl: >
            Veel vluchten, weinig energie. In 2019 was 24 % van de Europese vertrekken
            korter dan 500 km, goed voor slechts 3,8 % van de CO₂ van de luchtvaart; de
            vluchten van meer dan 4.000 km, 6 % van de vertrekken, waren goed voor 48 %.
            De kortste vluchten verbieden raakt dus heel veel ritten en heel weinig
            energie — het is tussen 500 en 1.500 km, de helft van de vertrekken en een
            vijfde van de CO₂, dat de verschuiving naar de trein zich echt afspeelt.
          en: >
            Many flights, little energy. In 2019, 24% of European departures were shorter
            than 500 km but accounted for only 3.8% of aviation's CO₂; flights over
            4,000 km, 6% of departures, accounted for 48%. Banning the shortest flights
            therefore touches a great many journeys and very little energy — it is between
            500 and 1,500 km, half of all departures and a fifth of the CO₂, that the shift
            to rail is really played out.
        source: "EUROCONTROL, Think Paper #11, Plane and train: getting the balance right (2021), fig. 2"
        url: https://www.eurocontrol.int/sites/default/files/2021-06/eurocontrol-think-paper-11-plane-and-train-right-balance.pdf
        chart:
          kind: bars
          unit: "% of aviation CO2"
          decimals: 1
          highlight: 0
          labels:
            - {fr: "moins de 500 km — 24 % des vols", nl: "minder dan 500 km — 24 % van de vluchten", en: "under 500 km — 24% of flights"}
            - {fr: "500 à 1 500 km — 46 %", nl: "500 tot 1.500 km — 46 %", en: "500 to 1,500 km — 46%"}
            - {fr: "1 500 à 4 000 km — 24 %", nl: "1.500 tot 4.000 km — 24 %", en: "1,500 to 4,000 km — 24%"}
            - {fr: "plus de 4 000 km — 6 %", nl: "meer dan 4.000 km — 6 %", en: "over 4,000 km — 6%"}
          y: [3.8, 21.6, 27.0, 47.6]
          caption:
            fr: Part du CO₂ de l'aviation européenne par distance de vol, 2019 ; entre parenthèses, la part des décollages
            nl: Aandeel van de CO₂ van de Europese luchtvaart per vluchtafstand, 2019; tussen haakjes het aandeel van de vertrekken
            en: Share of European aviation CO₂ by flight distance, 2019; in brackets, the share of departures
      - kind: benchmark
        label:
          fr: Quand le train est déjà là
          nl: Waar de trein er al is
          en: Where rail is already there
        text:
          fr: >
            Là où le train existe et va vite, il a déjà gagné : sur Bruxelles-Paris il
            prend 89 % du marché air+rail, Lyon-Paris 83 %, Milan-Rome 75 %,
            Barcelone-Madrid 62 %, Bruxelles-Londres 55 %. Au-delà d'environ 1 000 km, sa
            part tombe presque à zéro, et sur 58 liaisons européennes étudiées, 7
            seulement sont plus rapides en train de porte à porte. La même étude chiffre le
            plafond européen : dans le meilleur des cas — grande vitesse entre toutes les
            grandes villes, ou trains 10 % plus rapides, ou moitié plus de trains de nuit —
            le report modal retirerait 6 à 11 % du CO₂ de l'aviation intra-européenne.
          nl: >
            Waar de trein bestaat en snel is, heeft hij al gewonnen: op Brussel-Parijs neemt
            hij 89 % van de markt lucht+spoor, Lyon-Parijs 83 %, Milaan-Rome 75 %,
            Barcelona-Madrid 62 %, Brussel-Londen 55 %. Voorbij ongeveer 1.000 km valt zijn
            aandeel bijna tot nul terug, en van 58 onderzochte Europese verbindingen zijn er
            maar 7 sneller per trein van deur tot deur. Dezelfde studie becijfert het
            Europese plafond: in het beste geval — hogesnelheidslijnen tussen alle grote
            steden, of 10 % snellere treinen, of de helft meer nachttreinen — zou de modale
            verschuiving 6 tot 11 % van de CO₂ van de intra-Europese luchtvaart wegnemen.
          en: >
            Where rail exists and is fast, it has already won: on Brussels-Paris it takes 89%
            of the air + rail market, Lyon-Paris 83%, Milan-Rome 75%, Barcelona-Madrid 62%,
            Brussels-London 55%. Beyond about 1,000 km its share falls to nearly zero, and of
            58 European links studied only 7 are faster by train door to door. The same study
            puts a ceiling on Europe: in the best case — high-speed lines between every major
            city, or trains 10% faster, or half again as many night trains — modal shift
            would remove 6 to 11% of intra-European aviation's CO₂.
        source: "Bleijenberg / Koios Strategy for Transport & Environment, Air2Rail (2020), tabl. 5 and conclusion"
        url: https://uploads.transportenvironment.org/production/files/2020_03_Air2Rail_Koios_strategy_rev.pdf
        chart:
          kind: bars
          unit: "% of the air and rail market"
          decimals: 0
          highlight: [0, 4]
          labels:
            - {fr: Bruxelles-Paris, nl: Brussel-Parijs, en: Brussels-Paris}
            - {fr: Lyon-Paris, nl: Lyon-Parijs, en: Lyon-Paris}
            - {fr: Milan-Rome, nl: Milaan-Rome, en: Milan-Rome}
            - {fr: Barcelone-Madrid, nl: Barcelona-Madrid, en: Barcelona-Madrid}
            - {fr: Bruxelles-Londres, nl: Brussel-Londen, en: Brussels-London}
          y: [89, 83, 75, 62, 55]
          caption:
            fr: Part du train dans le marché air+rail, huit liaisons européennes où les deux existent
            nl: Aandeel van de trein in de markt lucht+spoor, Europese verbindingen waar beide bestaan
            en: Rail's share of the air + rail market, European links where both exist
      - kind: tangible
        text:
          fr: >
            {refValue} voyages sur une vie, c'est un aller-retour Bruxelles-Barcelone tous
            les {monthsPerTrip2019} mois, pour chaque habitant, du nourrisson au
            centenaire. En énergie, un tel voyage coûtait environ {kwhPerTrip2019} kWh par
            passager en 2019, soit de l'ordre de {litresPerTrip2019} litres de kérosène.
          nl: >
            {refValue} reizen in een leven is één retourreis Brussel-Barcelona elke
            {monthsPerTrip2019} maanden, voor elke inwoner, van baby tot honderdjarige. In
            energie kostte zo'n reis in 2019 ongeveer {kwhPerTrip2019} kWh per passagier,
            in de orde van {litresPerTrip2019} liter kerosine.
          en: >
            {refValue} trips over a lifetime is one Brussels-Barcelona return every
            {monthsPerTrip2019} months, for every inhabitant, from newborn to centenarian. In
            energy, one such trip cost about {kwhPerTrip2019} kWh per passenger in 2019, of
            the order of {litresPerTrip2019} litres of kerosene.
        source: nW-BE §2.1 and §2.3, arithmetic on the 2019 values; Jet A-1 at 43 MJ/kg and 0.80 kg/litre
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario retire {shiftPct} % des kilomètres intra-européens, et il ne les
            supprime pas : il les *reporte* intégralement, {toRailSpdPct} points vers la
            grande vitesse, {toRailCnvPct} vers le train classique et {toCoachPct} vers
            l'autocar. Et là, le rendement compte enfin : le panier d'arrivée demande
            {railKwhPkmTarget} kWh par voyageur-kilomètre en 2050 contre
            {srtKwhPkmTarget} pour l'avion, un facteur six.
          nl: >
            Het scenario haalt {shiftPct} % van de intra-Europese kilometers weg, en schrapt
            ze niet: het *verschuift* ze volledig, {toRailSpdPct} punten naar de
            hogesnelheidstrein, {toRailCnvPct} naar de klassieke trein en {toCoachPct} naar de
            autocar. En daar telt het rendement eindelijk: het aankomstmandje vraagt
            {railKwhPkmTarget} kWh per reizigerskilometer in 2050 tegenover
            {srtKwhPkmTarget} voor het vliegtuig, een factor zes.
          en: >
            The scenario removes {shiftPct}% of intra-European kilometres, and does not
            delete them: it *shifts* them entirely, {toRailSpdPct} points to high-speed
            rail, {toRailCnvPct} to conventional rail and {toCoachPct} to the coach. And there
            efficiency finally matters: the receiving basket needs {railKwhPkmTarget} kWh per
            passenger-kilometre in 2050 against {srtKwhPkmTarget} for the plane, a factor of
            six.
        source: nW-BE §2.1
      - kind: benchmark
        reveal: true
        label:
          fr: Pourquoi surtout la grande vitesse
          nl: Waarom vooral de hogesnelheidstrein
          en: Why mostly high-speed rail
        text:
          fr: >
            Le vol intra-européen moyen au départ de Belgique faisait 1 150 km en 2019, et à
            cette distance la question n'est pas de savoir si un train existe, mais s'il va
            vite. Le rail domine en dessous de 2 h 30 de trajet et peut tenir la moitié du
            marché jusqu'à 3 h 30 ; là où il gagne vraiment, c'est toujours sur ligne rapide —
            Paris-Lyon, Madrid-Barcelone, Amsterdam-Paris. Sur voie classique, aux mêmes
            distances, il perd : Berlin-Vienne, 603 km, c'est un million de passagers par
            avion contre quelques dizaines de milliers par train. D'où la plus grosse part au
            train rapide. Mais la prudence reste de mise : sur Barcelone-Paris, 945 km et
            pourtant une liaison TGV, l'avion garde presque tout le marché, parce que le
            réseau européen à grande vitesse roule en moyenne à 45 % de sa vitesse nominale.
          nl: >
            De gemiddelde intra-Europese vlucht vanuit België was in 2019 1.150 km lang, en op
            die afstand is de vraag niet of er een trein bestaat, maar of hij snel is. Het
            spoor domineert onder 2 u 30 reistijd en kan tot 3 u 30 de helft van de markt
            houden; waar het echt wint, is dat altijd op een snelle lijn — Parijs-Lyon,
            Madrid-Barcelona, Amsterdam-Parijs. Op klassieke sporen verliest het bij dezelfde
            afstanden: Berlijn-Wenen, 603 km, dat is een miljoen passagiers per vliegtuig
            tegenover enkele tienduizenden per trein. Vandaar het grootste deel voor de snelle
            trein. Toch blijft voorzichtigheid geboden: op Barcelona-Parijs, 945 km en toch een
            TGV-verbinding, houdt het vliegtuig bijna de hele markt, omdat het Europese
            hogesnelheidsnet gemiddeld op 45 % van zijn nominale snelheid rijdt.
          en: >
            The average intra-European flight out of Belgium was 1,150 km in 2019, and at that
            distance the question is not whether a train exists but whether it is fast. Rail
            dominates below 2h30 of journey time and can hold half the market up to 3h30; where
            it really wins, it is always on a fast line — Paris-Lyon, Madrid-Barcelona,
            Amsterdam-Paris. On conventional track, at the same distances, it loses:
            Berlin-Vienna, 603 km, is a million passengers by air against a few tens of
            thousands by rail. Hence the larger share to fast rail. Caution is still in order,
            though: on Barcelona-Paris, 945 km and a TGV route at that, the plane keeps almost
            the whole market, because Europe's high-speed network runs at an average of 45% of
            its design speed.
        source: "AEE, Transport and Environment Report 2020 — Train or plane?, p. 17 et tabl. 5.1 ; vitesse réelle du réseau : Cour des comptes européenne, rapport spécial 19/2018 ; distance de vol : JRC-IDEES-2023"
        url: https://www.eea.europa.eu/en/analysis/publications/transport-and-environment-report-2020/transport-and-environment-report-2020/@@download/file
    historyAbsent: true
    historyNote:
      fr: La seule série aérienne mesurée dans le projet mélange long-courrier et court-courrier ; le classeur JRC-IDEES « Transport », qui contient la répartition, n'est pas dans le dépôt.
      nl: De enige gemeten luchtvaartreeks in het project mengt lange en korte afstand; het JRC-IDEES-werkboek "Transport", dat de opsplitsing bevat, zit niet in de repository.
      en: The only measured aviation series in the project mixes long-haul and short-haul; the JRC-IDEES "Transport" workbook, which holds the split, is not in the repository.
    justification:
      fr: >
        négaWatt retient {targetValue} voyages court-courriers par vie contre {refValue} en
        2019 — la plus forte réduction de tout l'atelier, {shiftPct} % des kilomètres
        intra-européens. C'est aussi la plus facile à défendre : sur ces distances « les
        vols court-courriers devraient basculer vers des modes moins intensifs en énergie
        partout où c'est possible », et le report est intégral — {toRailSpdPct} points vers
        la grande vitesse, {toRailCnvPct} vers le train classique, {toCoachPct} vers
        l'autocar. Le gain énergétique est réel parce que le panier d'arrivée demande
        {railKwhPkmTarget} kWh par voyageur-kilomètre contre {srtKwhPkmTarget} pour l'avion.
        À noter : l'avion intra-européen conserve la moitié de son intensité de 2019, alors
        que la voiture, elle, passe à {carKwhPkmTarget} kWh/pkm — un facteur
        {ratioTarget} en faveur de la route électrifiée.
      nl: >
        negaWatt kiest {targetValue} korteafstandsreizen per leven tegenover {refValue} in
        2019 — de sterkste verlaging van de hele workshop, {shiftPct} % van de intra-Europese
        kilometers. Het is ook de gemakkelijkst te verdedigen: op deze afstanden "zouden
        korteafstandsvluchten waar mogelijk moeten overschakelen naar minder energie-intensieve
        modi", en de verschuiving is volledig — {toRailSpdPct} punten naar de hogesnelheidstrein,
        {toRailCnvPct} naar de klassieke trein, {toCoachPct} naar de autocar. De
        energiewinst is reëel omdat het aankomstmandje {railKwhPkmTarget} kWh per
        reizigerskilometer vraagt tegenover {srtKwhPkmTarget} voor het vliegtuig. Merk op: het
        intra-Europese vliegtuig houdt de helft van zijn intensiteit van 2019, terwijl de auto
        naar {carKwhPkmTarget} kWh/pkm gaat — een factor {ratioTarget} in het voordeel van de
        geëlektrificeerde weg.
      en: >
        negaWatt settles on {targetValue} short-haul trips per lifetime against {refValue} in
        2019 — the deepest reduction in the whole workshop, {shiftPct}% of intra-European
        kilometres. It is also the easiest to defend: at these distances "short-haul flights
        should shift towards less energy-intensive modes of transport wherever possible", and
        the shift is complete — {toRailSpdPct} points to high-speed rail, {toRailCnvPct} to
        conventional rail, {toCoachPct} to the coach. The energy gain is real because the
        receiving basket needs {railKwhPkmTarget} kWh per passenger-kilometre against
        {srtKwhPkmTarget} for the plane. Note: the intra-European plane keeps half its 2019
        intensity, while the car drops to {carKwhPkmTarget} kWh/pkm — a factor of
        {ratioTarget} in favour of the electrified road.
    debate:
      fr: >
        Le report suppose une offre ferroviaire qui n'existe pas encore : sur les liaisons
        que l'avion assure aujourd'hui, il faudrait des trains de nuit, des billets
        intégrés et des capacités que personne n'a chiffrées ici. Rien dans le modèle ne
        garantit que le train soit *disponible* : la demande y est simplement déplacée.
        L'ordre de grandeur est d'ailleurs sévère : la seule étude européenne qui chiffre
        un plafond, celle citée sur la fiche « Quand le train est déjà là », trouve 6 à
        11 % du CO₂ de l'aviation intra-européenne évitables par report modal — et encore,
        en supposant la grande vitesse entre toutes les grandes villes. Le scénario demande
        beaucoup plus que cela, et le suppose acquis. À l'inverse, la comparaison des
        intensités est sans appel, et c'est le seul levier de l'aviation où le report modal
        fait réellement gagner de l'énergie.
      nl: >
        De verschuiving veronderstelt een spooraanbod dat nog niet bestaat: op de verbindingen
        die het vliegtuig vandaag verzorgt, zouden nachttreinen, geïntegreerde tickets en
        capaciteiten nodig zijn die hier door niemand becijferd zijn. Niets in het model
        garandeert dat de trein *beschikbaar* is: de vraag wordt er gewoon verplaatst. De
        orde van grootte is bovendien streng: de enige Europese studie die een plafond
        becijfert, die op de kaart "Waar de trein er al is", vindt 6 tot 11 % van de CO₂ van
        de intra-Europese luchtvaart vermijdbaar door modale verschuiving — en dan nog met
        hogesnelheidslijnen tussen alle grote steden. Het scenario vraagt veel meer dan dat
        en veronderstelt het als verworven. Omgekeerd is de vergelijking van de intensiteiten
        onweerlegbaar, en dit is de enige luchtvaarthefboom waar modale verschuiving
        werkelijk energie uitspaart.
      en: >
        The shift assumes a rail offer that does not yet exist: on the routes the plane serves
        today it would need night trains, integrated ticketing and capacity that nobody has
        quantified here. Nothing in the model guarantees the train is *available*: demand is
        simply moved. The order of magnitude is severe, too: the one European study that puts
        a ceiling on this, the one quoted on the "Where rail is already there" card, finds 6
        to 11% of intra-European aviation CO₂ avoidable by modal shift — and that assuming
        high-speed lines between every major city. The scenario asks for considerably more
        than that, and takes it as given. Conversely, the comparison of intensities is
        unanswerable, and this is the only aviation lever where modal shift genuinely saves
        energy.

  # ------------------------------------------------------------ 3 -------------
  long-haul-load:
    short:
      fr: Remplissage long-courrier
      nl: Bezetting langeafstand
      en: Long-haul load
    question:
      fr: "Quel remplissage des vols long-courriers viser en 2050 ?"
      nl: "Welke bezetting van langeafstandsvluchten moeten we in 2050 nastreven?"
      en: "What filling of long-haul flights should 2050 aim for?"
    subtitle:
      fr: "Compté en passagers effectivement transportés par vol, sièges vides compris. Le chiffre mêle donc le taux de remplissage et la taille des avions."
      nl: "Geteld in werkelijk vervoerde passagiers per vlucht, lege stoelen inbegrepen. Het cijfer mengt dus de bezettingsgraad en de grootte van de vliegtuigen."
      en: "Counted in passengers actually carried per flight, empty seats included. The figure therefore mixes the load factor with the size of the aircraft."
    tangible:
      fr: "{value} passagers par vol long-courrier, en moyenne sur tous les vols."
      nl: "{value} passagiers per langeafstandsvlucht, gemiddeld over alle vluchten."
      en: "{value} passengers per long-haul flight, averaged over every flight."
    facts:
      - kind: trend
        text:
          fr: >
            En hausse continue : {occu2000} passagers par vol long-courrier en 2000,
            {refValue} en 2019 — soit +{histGainPct2019} % — puis {occu2023} en 2023,
            +{histGainPct} % sur vingt-trois ans. Ces gains viennent d'avions plus grands
            autant que d'avions plus pleins. Méfiance sur le dernier point : 2023 est une
            année de rattrapage, où les avions étaient anormalement remplis.
          nl: >
            Continu stijgend: {occu2000} passagiers per langeafstandsvlucht in 2000,
            {refValue} in 2019 — ofwel +{histGainPct2019} % — dan {occu2023} in 2023,
            +{histGainPct} % over drieëntwintig jaar. Die winst komt evenveel van grotere
            vliegtuigen als van vollere. Wees voorzichtig met het laatste punt: 2023 is een
            inhaaljaar waarin de vliegtuigen abnormaal vol zaten.
          en: >
            Rising steadily: {occu2000} passengers per long-haul flight in 2000, {refValue}
            in 2019 — that is +{histGainPct2019}% — then {occu2023} in 2023, +{histGainPct}%
            over twenty-three years. The gain comes from bigger aircraft as much as from
            fuller ones. Treat the last point with care: 2023 was a catch-up year, with
            aircraft abnormally full.
        source: nW-BE §2.3 (JRC-IDEES-2023)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: tangible
        text:
          fr: >
            Passer de {refValue} à {occu2023} passagers par vol — ce que la période
            2019-2023 a déjà fait — retire environ un dixième des {lngKwhPkm2019} kWh
            consommés par voyageur-kilomètre, sans qu'aucun voyage soit supprimé. Un avion
            plus plein est de l'énergie gratuite.
          nl: >
            Van {refValue} naar {occu2023} passagiers per vlucht gaan — wat de periode
            2019-2023 al deed — haalt ongeveer een tiende weg van de {lngKwhPkm2019} kWh die
            per reizigerskilometer verbruikt worden, zonder dat één reis wegvalt. Een
            vollere vlucht is gratis energie.
          en: >
            Going from {refValue} to {occu2023} passengers per flight — which 2019 to 2023
            already did — takes about a tenth off the {lngKwhPkm2019} kWh used per
            passenger-kilometre, without a single trip being cancelled. A fuller plane is
            free energy.
        source: nW-BE §2.3, arithmetic on the observed values
      - kind: caution
        label:
          fr: Ce que le calcul ne relie pas
          nl: Wat de berekening niet verbindt
          en: What the calculation does not link
        text:
          fr: >
            Dans la feuille de calcul, le remplissage et la consommation de l'avion sont
            deux réglages *indépendants* : ajouter des passagers par vol ne fait pas monter
            la consommation par kilomètre d'avion. C'est exact si les passagers
            supplémentaires occupent des sièges vides, et faux s'il faut de plus gros
            appareils — un avion plus grand consomme plus par kilomètre. L'histoire donne
            l'ordre de grandeur de l'erreur : entre 2000 et 2019, le long-courrier au départ
            de Belgique a gagné {histGainPct2019} % de passagers par vol pendant que sa
            consommation par kilomètre baissait de {fuelChangePct2019:abs} %, de
            {kwhKm2000} à {kwhKm2019} kWh. Sur vingt ans, le progrès technique a plus
            qu'absorbé l'effet de taille.
          nl: >
            In het rekenblad zijn de bezetting en het verbruik van het vliegtuig twee
            *onafhankelijke* instellingen: passagiers per vlucht toevoegen doet het verbruik
            per vliegtuigkilometer niet stijgen. Dat klopt als de extra passagiers lege
            stoelen innemen, en klopt niet als er grotere toestellen nodig zijn — een groter
            vliegtuig verbruikt meer per kilometer. De geschiedenis geeft de orde van
            grootte van de fout: tussen 2000 en 2019 won de langeafstand vanuit België
            {histGainPct2019} % passagiers per vlucht terwijl haar verbruik per kilometer
            met {fuelChangePct2019:abs} % daalde, van {kwhKm2000} naar {kwhKm2019} kWh. Over
            twintig jaar heeft de technische vooruitgang het grootte-effect meer dan
            opgeslorpt.
          en: >
            In the workbook, how full the aircraft is and how much it burns are two
            *independent* settings: adding passengers per flight does not raise fuel use per
            aircraft-kilometre. That is right if the extra passengers fill empty seats, and
            wrong if bigger aircraft are needed — a bigger aircraft burns more per
            kilometre. History gives the order of magnitude of the error: between 2000 and
            2019, long-haul out of Belgium gained {histGainPct2019}% passengers per flight
            while its fuel use per kilometre fell by {fuelChangePct2019:abs}%, from
            {kwhKm2000} to {kwhKm2019} kWh. Over twenty years, technical progress more than
            absorbed the size effect.
        source: nW-BE §2.3 (JRC-IDEES-2023, occupancy and effective vehicle efficiency)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: lever
        label:
          fr: Sièges × remplissage
          nl: Stoelen × bezetting
          en: Seats × load factor
        text:
          fr: >
            Un taux de remplissage parle plus qu'un nombre de passagers, et les deux se
            déduisent l'un de l'autre : *passagers par vol = nombre de sièges × taux de
            remplissage*. Le remplissage moyen mondial était de {loadFactor2019} % des
            sièges en 2019 et de {loadFactor2024} % en 2024. Les {refValue} passagers par
            vol long-courrier de 2019 correspondent donc à un appareil d'environ
            {seatsImplied2019} sièges rempli aux quatre cinquièmes.
          nl: >
            Een bezettingsgraad zegt meer dan een aantal passagiers, en het een volgt uit
            het ander: *passagiers per vlucht = aantal stoelen × bezettingsgraad*. De
            gemiddelde wereldwijde bezetting was {loadFactor2019} % van de stoelen in 2019
            en {loadFactor2024} % in 2024. De {refValue} passagiers per langeafstandsvlucht van 2019
            komen dus overeen met een toestel van ongeveer {seatsImplied2019} stoelen dat
            voor vier vijfde vol zit.
          en: >
            A load factor says more than a passenger count, and each follows from the
            other: *passengers per flight = number of seats × load factor*. The average
            world load factor was {loadFactor2019}% of seats in 2019 and
            {loadFactor2024}% in 2024. The {refValue} passengers per long-haul flight of
            2019 therefore correspond to an aircraft of about {seatsImplied2019} seats
            filled to four fifths.
        source: "IATA, Industry Statistics (passenger load factor, world)"
        url: https://www.iata.org/en/iata-repository/pressroom/fact-sheets/industry-statistics/
        chart:
          kind: bars
          unit: seats per flight
          decimals: 0
          highlight: 1
          labels:
            - {fr: "Europe, 2018", nl: "Europa, 2018", en: "Europe, 2018"}
            - {fr: "Europe, 2024", nl: "Europa, 2024", en: "Europe, 2024"}
          y: [173, 183]
          source: "EUROCONTROL, Data Snapshot #54, Further, higher, bigger (2025)"
          url: https://www.eurocontrol.int/sites/default/files/2025-07/eurocontrol-data-snapshot-54.pdf
          caption:
            fr: Sièges offerts par vol, moyenne du réseau européen — les compagnies ont surtout agrandi les avions
            nl: Aangeboden stoelen per vlucht, gemiddelde van het Europese netwerk — de maatschappijen hebben vooral de vliegtuigen vergroot
            en: Seats offered per flight, European network average — airlines have mostly made the aircraft bigger
      - kind: benchmark
        label:
          fr: Jusqu'où peut-on remplir ?
          nl: Hoe vol kan het?
          en: How full can it get?
        text:
          fr: >
            Le plafond n'est pas 100 %, mais il est nettement au-dessus de la moyenne :
            Ryanair, qui ne vend qu'une classe et ne fait pas de correspondances, publie
            des taux de remplissage autour de 96 % sur l'année entière. L'écart entre la
            moyenne du secteur et ce chiffre-là mesure la marge disponible *sans* agrandir
            les avions — après quoi il faut de plus gros appareils.
          nl: >
            Het plafond is geen 100 %, maar het ligt duidelijk boven het gemiddelde:
            Ryanair, dat maar één klasse verkoopt en geen overstappen aanbiedt, publiceert
            bezettingsgraden rond 96 % over het hele jaar. Het verschil tussen het
            sectorgemiddelde en dat cijfer meet de beschikbare marge *zonder* de
            vliegtuigen te vergroten — daarna zijn grotere toestellen nodig.
          en: >
            The ceiling is not 100%, but it is well above the average: Ryanair, which sells
            a single class and offers no connections, publishes load factors of around 96%
            over the full year. The gap between the industry average and that figure
            measures the room available *without* making the aircraft bigger — beyond it,
            bigger aircraft are needed.
        source: "Ryanair, Traffic and Load Factor Stats"
        url: https://investor.ryanair.com/traffic/
    justification:
      fr: >
        négaWatt retient {targetValue} passagers par vol long-courrier, soit
        +{gainPct} % par rapport à {refValue} en 2019. Le choix est explicitement prudent :
        la période 2000-2023 a fait +{histGainPct} %, et le scénario n'en retient que la
        moitié, sur une période plus longue. Combiné à la baisse de consommation par
        kilomètre d'avion, cela fait passer le long-courrier de {lngTwh} à
        {lngTwhTarget} TWh, la réduction du nombre de voyages faisant le reste.
      nl: >
        negaWatt kiest {targetValue} passagiers per langeafstandsvlucht, ofwel +{gainPct} %
        tegenover {refValue} in 2019. De keuze is uitdrukkelijk voorzichtig: de periode
        2000-2023 deed +{histGainPct} %, en het scenario houdt daar maar de helft van over,
        over een langere periode. Samen met de daling van het verbruik per vliegtuigkilometer
        gaat de langeafstand van {lngTwh} naar {lngTwhTarget} TWh, waarbij de vermindering van
        het aantal reizen de rest doet.
      en: >
        negaWatt settles on {targetValue} passengers per long-haul flight, i.e. +{gainPct}%
        against {refValue} in 2019. The choice is explicitly cautious: 2000 to 2023 delivered
        +{histGainPct}%, and the scenario keeps only half of that, over a longer period.
        Combined with the fall in fuel per aircraft-kilometre, it takes long-haul from
        {lngTwh} to {lngTwhTarget} TWh, with the reduction in trips doing the rest.
    debate:
      fr: >
        Le scénario retient exactement la moitié de la tendance observée sur tous ses
        leviers techniques de l'aviation. C'est cohérent, mais discutable dans les deux
        sens : la prudence est défendable si l'on croit que les gains faciles sont derrière
        nous, et intenable si l'on remarque que 2023 avait déjà dépassé l'objectif
        intermédiaire. Et la tendance elle-même dépend de l'année d'arrivée : mesurée
        jusqu'en 2019 plutôt que jusqu'en 2023, elle vaut +{histGainPct2019} % au lieu de
        +{histGainPct} %, et la même règle donnerait un objectif sensiblement plus bas. En clair, ce levier a probablement plus de marge que le scénario ne
        lui en donne — ce qui rend d'autant plus lourde la réduction demandée aux voyages.
      nl: >
        Het scenario houdt op al zijn technische luchtvaarthefbomen exact de helft van de
        waargenomen trend over. Dat is coherent, maar in beide richtingen betwistbaar: de
        voorzichtigheid is verdedigbaar als men denkt dat de gemakkelijke winsten achter ons
        liggen, en onhoudbaar als men merkt dat 2023 het tussentijdse doel al voorbij was. En
        de trend zelf hangt af van het eindjaar: tot 2019 gemeten in plaats van tot 2023
        bedraagt hij +{histGainPct2019} % in plaats van +{histGainPct} %, en dezelfde regel
        zou een merkelijk lager doel geven.
        Kortom: deze hefboom heeft vermoedelijk meer marge dan het scenario hem geeft — wat de
        gevraagde vermindering van de reizen des te zwaarder maakt.
      en: >
        The scenario keeps exactly half the observed trend on every one of its technical
        aviation levers. That is consistent, but arguable in both directions: the caution is
        defensible if you think the easy gains are behind us, and untenable if you notice that
        2023 had already passed the interim objective. And the trend itself depends on the
        year it stops: measured to 2019 rather than to 2023 it is +{histGainPct2019}% instead
        of +{histGainPct}%, and the same rule would give a noticeably lower objective. In short, this lever probably has more
        room than the scenario gives it — which makes the reduction demanded of travel that
        much heavier.

