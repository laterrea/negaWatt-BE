      en: >
        negaWatt settles on {targetValue} passengers per intra-European flight, i.e.
        +{gainPct}% against {refValue} in 2019 — half the +{histGainPct}% observed between
        2000 and 2023. Combined with fuel use per aircraft-kilometre, it brings the kerosene
        part of intra-European down to {srtKeroTwhTarget} TWh, with the reduction in the
        number of flights doing most of the work.
    debate:
      fr: >
        C'est le levier le moins coûteux et le moins ambitieux du lot : la moitié d'une
        tendance qui, elle, ne s'est jamais arrêtée. Le paradoxe est que le remplissage a
        surtout progressé grâce au low-cost, c'est-à-dire grâce à ce qui a fait exploser le
        nombre de vols. Améliorer le remplissage tout en divisant les vols par deux n'est
        donc pas la simple addition de deux tendances passées.
      nl: >
        Dit is de minst kostelijke en minst ambitieuze hefboom van de reeks: de helft van een
        trend die zelf nooit is gestopt. De paradox is dat de bezetting vooral is gestegen
        dankzij low cost, dat wil zeggen dankzij wat het aantal vluchten heeft doen
        ontploffen. De bezetting verbeteren én de vluchten halveren is dus niet de simpele
        som van twee voorbije trends.
      en: >
        This is the cheapest and least ambitious lever of the set: half of a trend that has
        itself never stopped. The paradox is that load rose mainly thanks to low-cost
        carriers — that is, thanks to what made the number of flights explode. Improving load
        while halving flights is therefore not the simple sum of two past trends.

  # ------------------------------------------------------------ 5 -------------
  # One question for the two fuel parameters of section 2.3. They were asked
  # separately until the 2026 review and were very nearly the same question; the
  # merged value is the aircraft-km-weighted average, on which the topic's
  # kerosene demand depends exactly. See workshop_levers/international_mobility.py.
  plane-fuel:
    short:
      fr: Consommation des avions
      nl: Verbruik van de vliegtuigen
      en: Aircraft fuel use
    question:
      fr: "Quelle consommation par kilomètre d'avion viser en 2050 ?"
      nl: "Welk verbruik per vliegtuigkilometer moeten we in 2050 nastreven?"
      en: "What fuel use per aircraft-kilometre should 2050 aim for?"
    subtitle:
      fr: "Énergie dans les réservoirs par kilomètre parcouru par l'avion, quel que soit le carburant. Moyenne des vols intra-européens ({kwhKmIntra2019} kWh/km en 2019) et long-courriers ({kwhKmExtra2019}), pondérée par les kilomètres-avion. Par avion, pas par passager : un appareil plus grand consomme plus par kilomètre et moins par voyageur."
      nl: "Energie in de tanks per door het vliegtuig afgelegde kilometer, welke brandstof het ook is. Gemiddelde van de intra-Europese ({kwhKmIntra2019} kWh/km in 2019) en de langeafstandsvluchten ({kwhKmExtra2019}), gewogen met de vliegtuigkilometers. Per vliegtuig, niet per passagier: een groter toestel verbruikt meer per kilometer en minder per reiziger."
      en: "Energy in the tanks per kilometre flown by the aircraft, whatever the fuel. The average of intra-European ({kwhKmIntra2019} kWh/km in 2019) and long-haul flights ({kwhKmExtra2019}), weighted by aircraft-kilometres. Per aircraft, not per passenger: a bigger aircraft uses more per kilometre and less per traveller."
    tangible:
      fr: "{value} kWh par kilomètre d'avion, tous vols confondus."
      nl: "{value} kWh per vliegtuigkilometer, alle vluchten samen."
      en: "{value} kWh per aircraft-kilometre, all flights together."
    facts:
      - kind: trend
        label:
          fr: Le long-courrier s'est amélioré
          nl: De langeafstand is verbeterd
          en: Long-haul improved
        text:
          fr: >
            Le gros porteur est la plus forte amélioration technique de l'aviation belge :
            {kwhKmExtra2000} kWh par kilomètre d'avion en 2000, {kwhKmExtra2019} en 2019,
            soit {histChangeExtra2019Pct} %. La courbe descend jusque vers 2013 puis se
            stabilise — les gains faciles sont derrière.
          nl: >
            De widebody is de sterkste technische verbetering van de Belgische luchtvaart:
            {kwhKmExtra2000} kWh per vliegtuigkilometer in 2000, {kwhKmExtra2019} in 2019,
            ofwel {histChangeExtra2019Pct} %. De curve daalt tot rond 2013 en vlakt dan af —
            de gemakkelijke winsten liggen achter ons.
          en: >
            The wide-body is the strongest technical improvement in Belgian aviation:
            {kwhKmExtra2000} kWh per aircraft-kilometre in 2000, {kwhKmExtra2019} in 2019,
            that is {histChangeExtra2019Pct}%. The curve falls until about 2013 and then
            flattens — the easy gains are behind us.
        source: JRC-IDEES-2023 (Transport, effective vehicle efficiency)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: avia_fuel_extra
          decimals: 0
          caption:
            fr: Vols long-courriers au départ de Belgique, kWh par kilomètre d'avion, 2000 à 2023
            nl: Langeafstandsvluchten vanuit België, kWh per vliegtuigkilometer, 2000 tot 2023
            en: Long-haul flights leaving Belgium, kWh per aircraft-kilometre, 2000 to 2023
      - kind: trend
        label:
          fr: L'intra-européen, non
          nl: De intra-Europese vluchten niet
          en: Intra-European did not
        text:
          fr: >
            Sur le court-courrier, la courbe descend jusqu'en 2006 puis *remonte* :
            {kwhKmIntra2000} kWh par kilomètre d'avion en 2000, un creux vers 2006, et
            {kwhKmIntra2019} en 2019 — soit +{histChangeIntra2019Pct} % en dix-neuf ans. Ce n'est pas une
            régression technique : les appareils sont devenus nettement plus grands, et un
            avion plus grand consomme plus par kilomètre tout en consommant moins par
            passager. Les années 2020 à 2023 restent perturbées par la crise sanitaire et
            ne disent rien d'une tendance.
          nl: >
            Op de korte afstand daalt de curve tot 2006 en *stijgt* daarna:
            {kwhKmIntra2000} kWh per vliegtuigkilometer in 2000, een dal rond 2006, en
            {kwhKmIntra2019} in 2019 — ofwel +{histChangeIntra2019Pct} % in negentien jaar. Dat is geen technische
            achteruitgang: de toestellen zijn duidelijk groter geworden, en een groter
            vliegtuig verbruikt meer per kilometer en toch minder per passagier. De jaren
            2020 tot 2023 blijven verstoord door de gezondheidscrisis en zeggen niets over
            een trend.
          en: >
            On short-haul the curve falls until 2006 and then *rises again*:
            {kwhKmIntra2000} kWh per aircraft-kilometre in 2000, a trough around 2006, and
            {kwhKmIntra2019} in 2019 — that is +{histChangeIntra2019Pct}% in nineteen years. This is not a technical
            regression: the aircraft became markedly bigger, and a bigger aircraft uses more
            per kilometre while using less per passenger. The years 2020 to 2023 remain
            disturbed by the health crisis and say nothing about a trend.
        source: JRC-IDEES-2023 (Transport, effective vehicle efficiency)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: avia_fuel_intra
          decimals: 0
          caption:
            fr: Vols intra-européens au départ de Belgique, kWh par kilomètre d'avion, 2000 à 2023
            nl: Intra-Europese vluchten vanuit België, kWh per vliegtuigkilometer, 2000 tot 2023
            en: Intra-European flights leaving Belgium, kWh per aircraft-kilometre, 2000 to 2023
      - kind: benchmark
        label:
          fr: Décarbonation de l'aviation
          nl: Decarbonisatie van de luchtvaart
          en: Decarbonising aviation
        text:
          fr: >
            Le secteur lui-même n'attend presque rien de ce levier. Dans son engagement
            *Fly Net Zero by 2050*, l'IATA répartit les réductions attendues en
            {iataSaf} % par les carburants durables, {iataCcs} % par la capture de carbone,
            {iataNewTech} % par les avions électriques et à hydrogène — et *{iataOps} %*
            par l'efficacité opérationnelle. Or c'est cette dernière ligne, avec une partie
            de la précédente, qui correspond à la question posée ici : tout le reste change
            ce que l'on brûle, pas la quantité que l'avion a besoin de brûler.
          nl: >
            De sector zelf verwacht bijna niets van deze hefboom. In zijn engagement *Fly
            Net Zero by 2050* verdeelt IATA de verwachte reducties in {iataSaf} % door
            duurzame brandstoffen, {iataCcs} % door koolstofafvang, {iataNewTech} % door
            elektrische en waterstofvliegtuigen — en *{iataOps} %* door operationele
            efficiëntie. Net die laatste lijn, samen met een deel van de vorige, komt
            overeen met de vraag die hier gesteld wordt: al de rest verandert wat er
            verbrand wordt, niet hoeveel het vliegtuig moet verbranden.
          en: >
            The industry itself expects almost nothing from this lever. In its *Fly Net Zero
            by 2050* commitment, IATA splits the expected reductions into {iataSaf}% from
            sustainable fuels, {iataCcs}% from carbon capture, {iataNewTech}% from electric
            and hydrogen aircraft — and *{iataOps}%* from operational efficiency. It is that
            last line, together with part of the one before it, that matches the question
            asked here: all the rest changes what is burned, not how much the aircraft needs
            to burn.
        source: "IATA, Commitment to Fly Net Zero by 2050, as quoted in nW-BE §2.3"
        url: https://www.iata.org/en/programs/sustainability/flynetzero/
      - kind: caution
        text:
          fr: >
            Attention au piège de l'unité. Ce curseur porte sur l'avion, pas sur le
            passager : le tirer vers le haut peut vouloir dire des appareils plus grands, ce
            qui *réduit* la consommation par voyageur si le remplissage suit. Cette question
            et les deux précédentes se lisent donc ensemble — le rendement réellement vu par
            le voyageur est leur rapport, pas l'une des trois.
          nl: >
            Let op de valkuil van de eenheid. Deze schuif gaat over het vliegtuig, niet over
            de passagier: hem omhoog trekken kan grotere toestellen betekenen, wat het
            verbruik per reiziger *verlaagt* als de bezetting volgt. Deze vraag en de twee
            vorige worden dus samen gelezen — het rendement dat de reiziger echt ziet is hun
            verhouding, niet één van de drie.
          en: >
            Mind the unit trap. This slider is about the aircraft, not the passenger: pulling
            it up can mean bigger aircraft, which *lowers* consumption per traveller if load
            follows. This question and the two before it are read together — the efficiency
            a traveller actually experiences is their ratio, not any one of the three.
        source: nW-BE §2.3
      - kind: structure
        reveal: true
        label:
          fr: Une moyenne qui cache deux choix
          nl: Een gemiddelde dat twee keuzes verbergt
          en: An average hiding two choices
        text:
          fr: >
            La question est posée sur la moyenne, mais le scénario fixe deux valeurs
            distinctes : {fuelTargetExtra} kWh par kilomètre en long-courrier
            ({changeExtraPct} %) et {fuelTargetIntra} en intra-européen
            (+{changeIntraPct} %). C'est le seul indicateur technique de l'atelier que le
            scénario laisse se dégrader, et il le fait là où les avions grandissent. La
            moyenne des deux, {kwhKmAvgTarget} kWh par kilomètre, est ce qui détermine la
            demande : {keroTwhTarget} TWh de kérosène en 2050 contre {keroTwh} en 2019.
          nl: >
            De vraag gaat over het gemiddelde, maar het scenario legt twee verschillende
            waarden vast: {fuelTargetExtra} kWh per kilometer op de lange afstand
            ({changeExtraPct} %) en {fuelTargetIntra} intra-Europees (+{changeIntraPct} %).
            Het is de enige technische indicator van de workshop die het scenario laat
            verslechteren, en dat gebeurt net waar de vliegtuigen groter worden. Het
            gemiddelde van beide, {kwhKmAvgTarget} kWh per kilometer, bepaalt de vraag:
            {keroTwhTarget} TWh kerosine in 2050 tegenover {keroTwh} in 2019.
          en: >
            The question is asked about the average, but the scenario sets two distinct
            values: {fuelTargetExtra} kWh per kilometre for long-haul ({changeExtraPct}%)
            and {fuelTargetIntra} for intra-European (+{changeIntraPct}%). It is the one
            technical indicator in the workshop that the scenario lets get worse, and it
            does so exactly where aircraft are growing. The average of the two,
            {kwhKmAvgTarget} kWh per kilometre, is what sets demand: {keroTwhTarget} TWh of
            kerosene in 2050 against {keroTwh} in 2019.
        source: nW-BE §2.3
    justification:
      fr: >
        négaWatt retient {targetValue} kWh par kilomètre d'avion en moyenne, soit
        {avgChangePct} % par rapport à {refValue} en 2019. La règle appliquée est la même
        pour les deux types de vol : la moitié de la tendance observée entre 2000 et 2023,
        {histChangeExtraPct} % pour le long-courrier et +{histChangeIntraPct} % pour
        l'intra-européen. Le rapport ne décide pas quel carburant remplit le réservoir : les
        carburants durables sont réservés en priorité au long-courrier, mais leur
        disponibilité est jugée limitée, et c'est le modèle PyPSA qui arbitrera ensuite
        entre kérosène, SAF et capture de carbone.
      nl: >
        negaWatt kiest {targetValue} kWh per vliegtuigkilometer gemiddeld, ofwel
        {avgChangePct} % tegenover {refValue} in 2019. De toegepaste regel is voor beide
        vluchttypes dezelfde: de helft van de tussen 2000 en 2023 waargenomen trend,
        {histChangeExtraPct} % voor de lange afstand en +{histChangeIntraPct} % voor
        intra-Europees. Het rapport beslist niet welke brandstof de tank vult: duurzame
        brandstoffen worden met prioriteit voor de langeafstand voorbehouden, maar hun
        beschikbaarheid wordt als beperkt beschouwd, en het PyPSA-model zal nadien kiezen
        tussen kerosine, SAF en koolstofafvang.
      en: >
        negaWatt settles on {targetValue} kWh per aircraft-kilometre on average, i.e.
        {avgChangePct}% against {refValue} in 2019. The rule applied is the same for both
        flight types: half the trend observed between 2000 and 2023, {histChangeExtraPct}%
        for long-haul and +{histChangeIntraPct}% for intra-European. The report does not
        decide what fuel fills the tank: sustainable fuels are reserved as a priority for
        long-haul, but their availability is judged limited, and it is the PyPSA model that
        will later choose between kerosene, SAF and carbon capture.
    debate:
      fr: >
        Retenir la moitié de la tendance passée est prudent, et discutable pour trois
        raisons. D'abord la période : la tendance est mesurée jusqu'en 2023, une année où
        le trafic n'était pas revenu à la normale et où la consommation par kilomètre est
        anormalement haute ; arrêtée en 2019, la même règle donnerait un objectif plus
        exigeant sur le long-courrier et presque neutre sur le court-courrier. Ensuite la
        règle elle-même : appliquer mécaniquement « la moitié de la tendance » revient, sur
        l'intra-européen, à prolonger à moitié une dégradation, sans argument propre.
        Enfin, le vrai point aveugle est ailleurs : les effets non-CO₂ du vol en altitude,
        traînées de condensation comprises, ne sont pas dans ce modèle du tout.
      nl: >
        De helft van de voorbije trend aanhouden is voorzichtig, en om drie redenen
        betwistbaar. Eerst de periode: de trend wordt gemeten tot 2023, een jaar waarin het
        verkeer nog niet genormaliseerd was en het verbruik per kilometer abnormaal hoog
        ligt; tot 2019 gemeten zou dezelfde regel een veeleisender doel geven voor de lange
        afstand en een bijna neutraal doel voor de korte. Dan de regel zelf: "de helft van
        de trend" mechanisch toepassen komt er intra-Europees op neer een verslechtering
        half door te trekken, zonder eigen argument. Ten slotte zit het echte blinde punt
        elders: de niet-CO₂-effecten van vliegen op hoogte, condensatiesporen inbegrepen,
        zitten helemaal niet in dit model.
      en: >
        Keeping half the past trend is cautious, and open to question on three counts.
        First the period: the trend is measured to 2023, a year when traffic had not
        returned to normal and fuel use per kilometre is abnormally high; stopped in 2019,
        the same rule would give a more demanding objective on long-haul and an almost
        neutral one on short-haul. Then the rule itself: mechanically applying "half the
        trend" amounts, on intra-European, to extending a deterioration by half, with no
        argument of its own. Finally, the real blind spot is elsewhere: the non-CO₂ effects
        of flying at altitude, contrails included, are not in this model at all.

  # ------------------------------------------------------------ 6 -------------
  hydrogen-flights:
    short:
      fr: Avions à hydrogène
      nl: Waterstofvliegtuigen
      en: Hydrogen aircraft
    question:
      fr: "Quelle part des vols intra-européens à l'hydrogène est un objectif 2050 réaliste ?"
      nl: "Welk aandeel intra-Europese vluchten op waterstof is een realistisch doel voor 2050?"
      en: "What share of intra-European flights on hydrogen is a realistic 2050 objective?"
    subtitle:
      fr: "Part des voyageurs-kilomètres intra-européens volée sur avion à hydrogène en 2050. Le reste vole sur carburant liquide."
      nl: "Aandeel van de intra-Europese reizigerskilometers gevlogen met een waterstofvliegtuig in 2050. De rest vliegt op vloeibare brandstof."
      en: "Share of intra-European passenger-kilometres flown on hydrogen aircraft in 2050. The rest flies on liquid fuel."
    tangible:
      fr: "{value} % des kilomètres intra-européens volés à l'hydrogène en 2050."
      nl: "{value} % van de intra-Europese kilometers op waterstof gevlogen in 2050."
      en: "{value}% of intra-European kilometres flown on hydrogen in 2050."
    facts:
      - kind: trend
        text:
          fr: >
            Il n'y a rien à observer : aucun avion de ligne à hydrogène ne vole. Le projet
            le plus avancé, le ZEROe d'Airbus — {zeroeSeats} places,
            {zeroeRangeKm} km d'autonomie, mise en service visée pour 2035 — vient d'être
            reporté de cinq à dix ans, budget réduit.
          nl: >
            Er is niets te observeren: geen enkel waterstoflijnvliegtuig vliegt. Het meest
            gevorderde project, de ZEROe van Airbus — {zeroeSeats} plaatsen,
            {zeroeRangeKm} km bereik, indienststelling gepland voor 2035 — is net met vijf tot
            tien jaar uitgesteld, met een verlaagd budget.
          en: >
            There is nothing to observe: no hydrogen airliner flies. The most advanced
            project, Airbus's ZEROe — {zeroeSeats} seats, {zeroeRangeKm} km of range, entry
            into service targeted for 2035 — has just been postponed by five to ten years,
            with a reduced budget.
        source: nW-BE §2.3 (Airbus ZEROe programme)
      - kind: structure
        text:
          fr: >
            L'hydrogène n'est pas un gain d'énergie mais un changement de vecteur. Un avion
            à hydrogène demanderait {h2KwhPkm} kWh par voyageur-kilomètre, contre
            {keroKwhPkm2019} pour l'intra-européen au kérosène de 2019 : le même ordre de
            grandeur. Ce que cela change est la nature de l'énergie à produire, ce qu'un
            modèle de demande ne voit pas.
          nl: >
            Waterstof is geen energiewinst maar een verandering van energiedrager. Een
            waterstofvliegtuig zou {h2KwhPkm} kWh per reizigerskilometer vragen, tegenover
            {keroKwhPkm2019} voor de intra-Europese kerosinevlucht van 2019: dezelfde
            grootteorde. Wat het verandert is de aard van de te produceren energie, en dat
            ziet een vraagmodel niet.
          en: >
            Hydrogen is not an energy saving but a change of carrier. A hydrogen aircraft
            would need {h2KwhPkm} kWh per passenger-kilometre, against {keroKwhPkm2019} for
            the kerosene intra-European flight of 2019: the same order of magnitude. What it
            changes is the nature of the energy to be produced, which a demand model does not
            see.
        source: nW-BE §2.3 (Airbus ZEROe and JRC-IDEES-2023)
      - kind: benchmark
        text:
          fr: >
            Le secteur lui-même n'y croit qu'à la marge. Dans son engagement *Fly Net Zero
            by 2050*, l'IATA attribue {iataNewTech} % des réductions attendues aux avions
            électriques et à hydrogène, contre {iataSaf} % aux carburants durables,
            {iataCcs} % à la capture de carbone et {iataOps} % à l'efficacité
            opérationnelle.
          nl: >
            De sector zelf gelooft er maar marginaal in. In zijn engagement *Fly Net Zero by
            2050* schrijft IATA {iataNewTech} % van de verwachte reducties toe aan
            elektrische en waterstofvliegtuigen, tegenover {iataSaf} % aan duurzame
            brandstoffen, {iataCcs} % aan koolstofafvang en {iataOps} % aan operationele
            efficiëntie.
          en: >
            The industry itself believes in it only at the margin. In its *Fly Net Zero by
            2050* commitment, IATA attributes {iataNewTech}% of the expected reductions to
            electric and hydrogen aircraft, against {iataSaf}% to sustainable fuels,
            {iataCcs}% to carbon capture and {iataOps}% to operational efficiency.
        source: "IATA, Commitment to Fly Net Zero by 2050, as quoted in nW-BE §2.3"
        url: https://www.iata.org/en/programs/sustainability/flynetzero/
      - kind: caution
        text:
          fr: >
            Ce curseur ne bougera presque pas la jauge : d'un bout à l'autre de son
            parcours, il déplace environ {swingTwh} TWh sur les {srtTwh} TWh de
            l'intra-européen de 2019. C'est voulu, et c'est l'enseignement : l'hydrogène ne
            réduit pas la demande, il change le carburant. Le bénéfice se joue en amont, dans
            la production, que ce modèle de demande ne représente pas.
          nl: >
            Deze schuif zal de meter bijna niet bewegen: van het ene uiterste naar het andere
            verplaatst hij ongeveer {swingTwh} TWh op de {srtTwh} TWh van intra-Europees in
            2019. Dat is bedoeld, en dat is de les: waterstof verlaagt de vraag niet, het
            verandert de brandstof. Het voordeel speelt zich stroomopwaarts af, in de
            productie, die dit vraagmodel niet weergeeft.
          en: >
            This slider will barely move the gauge: from one end of its range to the other it
            shifts about {swingTwh} TWh out of the {srtTwh} TWh of intra-European flying in
            2019. That is deliberate, and it is the lesson: hydrogen does not reduce demand,
            it changes the fuel. The benefit is upstream, in production, which this demand
            model does not represent.
        source: nW-BE §2.3, arithmetic on the exported intensities
    historyAbsent: true
    historyNote:
      fr: "Il n'y a pas de série à montrer : aucun avion de ligne à hydrogène n'a jamais volé commercialement, et la part est nulle sur toute la période observée."
      nl: "Er is geen reeks te tonen: geen enkel waterstoflijnvliegtuig heeft ooit commercieel gevlogen, en het aandeel is nul over de hele waargenomen periode."
      en: "There is no series to show: no hydrogen airliner has ever flown commercially, and the share is zero over the whole observed period."
    justification:
      fr: >
        négaWatt retient {targetValue} % des kilomètres intra-européens à l'hydrogène en
        2050 — soit {shareAllFlightsPct} % de l'ensemble des vols, long-courrier compris.
        Le rapport est explicite sur la raison : « au vu des retards affectant le secteur de
        l'aviation à hydrogène ». Le reste vole sur carburant liquide, sans changement de
        propulsion, et c'est ensuite le modèle PyPSA qui déterminera la stratégie de
        décarbonation — carburants durables, capture de carbone. Le levier ne change donc
        presque rien à la demande d'énergie ({swingTwh} TWh sur toute sa course) : il change
        ce qu'il faudra produire.
      nl: >
        negaWatt kiest {targetValue} % van de intra-Europese kilometers op waterstof in 2050 —
        ofwel {shareAllFlightsPct} % van alle vluchten, langeafstand inbegrepen. Het rapport
        is expliciet over de reden: "gezien de vertragingen in de waterstofluchtvaartsector".
        De rest vliegt op vloeibare brandstof, zonder verandering van voortstuwing, en het is
        daarna het PyPSA-model dat de decarbonisatiestrategie bepaalt — duurzame brandstoffen,
        koolstofafvang. De hefboom verandert dus bijna niets aan de energievraag
        ({swingTwh} TWh over zijn hele bereik): hij verandert wat er geproduceerd moet worden.
      en: >
        negaWatt settles on {targetValue}% of intra-European kilometres on hydrogen in 2050 —
        that is {shareAllFlightsPct}% of all flights, long-haul included. The report is
        explicit about why: "in view of the delays affecting the hydrogen aviation sector".
        The rest flies on liquid fuel with no change of propulsion, and it is then the PyPSA
        model that will determine the decarbonisation strategy — sustainable fuels, carbon
        capture. The lever therefore changes almost nothing about energy demand
        ({swingTwh} TWh across its whole range): it changes what has to be produced.
    debate:
      fr: >
        C'est le levier le plus modeste de l'atelier, et sans doute le plus honnête : plutôt
        que de parier sur une rupture technologique, le scénario demande à la sobriété de
        faire le travail. On peut le lui reprocher — un pari nul sur la technologie est
        aussi un pari — ou l'en créditer, puisque l'histoire des annonces d'avions propres
        lui donne pour l'instant raison. À noter que rien ici ne dit d'où viendrait
        l'hydrogène, ni à quel coût énergétique il serait produit.
      nl: >
        Dit is de meest bescheiden hefboom van de workshop, en vermoedelijk de meest
        eerlijke: in plaats van op een technologische doorbraak te gokken, vraagt het scenario
        aan soberheid om het werk te doen. Men kan dat verwijten — nul inzetten op technologie
        is ook een gok — of het toejuichen, aangezien de geschiedenis van de aankondigingen
        over schone vliegtuigen het voorlopig gelijk geeft. Merk op dat hier niets zegt
        waar de waterstof vandaan zou komen, noch tegen welke energiekost hij geproduceerd
        zou worden.
      en: >
        This is the most modest lever in the workshop, and probably the most honest: rather
        than betting on a technological breakthrough, the scenario asks sufficiency to do the
        work. You can hold that against it — betting nothing on technology is also a bet — or
        credit it, since the history of clean-aircraft announcements has so far proved it
        right. Note that nothing here says where the hydrogen would come from, or at what
        energy cost it would be produced.

  # ------------------------------------------------------------ 7 -------------
  # Added by the 2026 review. Section 3.1.4 of the notebook gained the two
  # parameters this lever reads; both are zero, so the scenario's numbers are
  # unchanged and negaWatt's answer to this question is "no assumption of its own".
  air-freight:
    short:
      fr: Fret aérien
      nl: Luchtvracht
      en: Air freight
    question:
      fr: "Combien de fret aérien par habitant viser en 2050 ?"
      nl: "Hoeveel luchtvracht per inwoner moeten we in 2050 nastreven?"
      en: "How much air freight per inhabitant should 2050 aim for?"
    subtitle:
      fr: "Marchandises transportées par avion, comptées en tonnes-kilomètres par habitant et par an — une tonne sur un kilomètre. La quasi-totalité est internationale. Ce que vous retirez à l'avion, le modèle le reporte sur le rail."
      nl: "Goederen vervoerd per vliegtuig, geteld in tonkilometers per inwoner per jaar — één ton over één kilometer. Vrijwel alles is internationaal. Wat jullie van het vliegtuig afhalen, verschuift het model naar het spoor."
      en: "Goods carried by air, counted in tonne-kilometres per inhabitant per year — one tonne over one kilometre. Almost all of it is international. What you take off the aircraft, the model moves to rail."
    tangible:
      fr: "{value} tonnes-kilomètres de fret aérien par habitant et par an."
      nl: "{value} tonkilometer luchtvracht per inwoner per jaar."
      en: "{value} tonne-kilometres of air freight per inhabitant per year."
    facts:
      - kind: trend
        text:
          fr: >
            C'est le seul flux de marchandises qui n'a pas cessé de croître. Rapporté à
            l'habitant, le fret aérien belge a plus que doublé depuis 2000 pour atteindre
            {airTkm2019} tonnes-kilomètres en 2019, et il a continué de monter après la
            crise sanitaire pendant que le fret routier, lui, reculait.
          nl: >
            Dit is de enige goederenstroom die onafgebroken is blijven groeien. Per inwoner
            is de Belgische luchtvracht sinds 2000 meer dan verdubbeld, tot
            {airTkm2019} tonkilometer in 2019, en ze is na de gezondheidscrisis blijven
            stijgen terwijl het wegvervoer terugliep.
          en: >
            This is the one goods flow that has never stopped growing. Per inhabitant,
            Belgian air freight has more than doubled since 2000 to reach
            {airTkm2019} tonne-kilometres in 2019, and it kept rising after the health
            crisis while road freight fell back.
        source: JRC-IDEES-2023 (Transport, air freight tonne-km); population Statbel
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
        chart:
          kind: line
          series: air_freight_tkm_person
          decimals: 0
          caption:
            fr: Fret aérien au départ de Belgique, tonnes-kilomètres par habitant, de 2000 à 2023
            nl: Luchtvracht vanuit België, tonkilometer per inwoner, van 2000 tot 2023
            en: Air freight leaving Belgium, tonne-kilometres per inhabitant, 2000 to 2023
      - kind: structure
        label:
          fr: Peu de tonnes, beaucoup d'énergie
          nl: Weinig tonnen, veel energie
          en: Few tonnes, much energy
        text:
          fr: >
            Peu de tonnes, beaucoup d'énergie. Le fret aérien ne pèse que
            {airShareTkm2019} % des tonnes-kilomètres belges, mais c'est de loin le mode le
            plus vorace : {airKwhPerTkm2019:d2} kWh par tonne-kilomètre, contre
            {truckKwhPerTkm2019} pour un poids lourd, {navKwhPerTkm2019:d2} pour une péniche
            et {railKwhPerTkm2019:d2} pour le train. Déplacer une tonne par avion coûte donc
            une vingtaine de fois ce qu'elle coûte par train.
          nl: >
            Weinig tonnen, veel energie. Luchtvracht is maar {airShareTkm2019} % van de
            Belgische tonkilometers, maar veruit de meest verslindende modus:
            {airKwhPerTkm2019:d2} kWh per tonkilometer, tegenover {truckKwhPerTkm2019} voor
            een vrachtwagen, {navKwhPerTkm2019:d2} voor een binnenschip en
            {railKwhPerTkm2019:d2} voor de trein. Een ton per vliegtuig verplaatsen kost dus
            een twintigtal keer wat ze per trein kost.
          en: >
            Few tonnes, much energy. Air freight is only {airShareTkm2019}% of Belgian
            tonne-kilometres, but it is by far the hungriest mode:
            {airKwhPerTkm2019:d2} kWh per tonne-kilometre against {truckKwhPerTkm2019} for a
            heavy truck, {navKwhPerTkm2019:d2} for a barge and {railKwhPerTkm2019:d2} for rail.
            Moving a tonne by air therefore costs some twenty times what it costs by train.
        source: nW-BE §3.1 and §3.3 (JRC-IDEES-2023)
        chart:
          kind: bars
          unit: kWh per tonne-km
          decimals: 2
          highlight: 0
          labels:
            - {fr: Avion, nl: Vliegtuig, en: Aircraft}
            - {fr: Poids lourd, nl: Vrachtwagen, en: Heavy truck}
            - {fr: Péniche, nl: Binnenschip, en: Barge}
            - {fr: Train, nl: Trein, en: Rail}
          y: ["{airKwhPerTkm2019}", "{truckKwhPerTkm2019}", "{navKwhPerTkm2019}", "{railKwhPerTkm2019}"]
          caption:
            fr: Énergie finale par tonne-kilomètre, quatre modes de fret, 2019
            nl: Finale energie per tonkilometer, vier vrachtmodi, 2019
            en: Final energy per tonne-kilometre, four freight modes, 2019
      - kind: tangible
        label:
          fr: En vols et en tonnes
          nl: In vluchten en tonnen
          en: In flights and tonnes
        text:
          fr: >
            Tout le fret aérien belge de 2019 tient dans {airFlights2019} vols de
            marchandises, soit une cinquantaine par jour, pour {airTonnes2019} tonnes —
            environ {airTPerFlight} tonnes par vol. À l'échelle d'un habitant, cela fait
            une soixantaine de kilos expédiés par avion chaque année.
          nl: >
            Alle Belgische luchtvracht van 2019 past in {airFlights2019} vrachtvluchten,
            zowat vijftig per dag, voor {airTonnes2019} ton — ongeveer
            {airTPerFlight} ton per vlucht. Per inwoner komt dat neer op een zestigtal kilo
            die elk jaar per vliegtuig verstuurd worden.
          en: >
            All of Belgium's 2019 air freight fits into {airFlights2019} cargo flights,
            about fifty a day, for {airTonnes2019} tonnes — some {airTPerFlight} tonnes per
            flight. Per inhabitant that is about sixty kilos sent by air each year.
        source: JRC-IDEES-2023 (Transport, departing freight flights and tonnes carried)
        url: http://data.europa.eu/89h/1f0b480c-6d21-4d95-897d-20c7ca33df6f
      - kind: structure
        label:
          fr: Ce qui voyage par avion
          nl: Wat per vliegtuig reist
          en: What travels by air
        text:
          fr: >
            L'avion transporte *moins de 1 %* du commerce mondial en tonnes, et environ
            35 % de sa valeur. Ce qui y monte est donc soit cher, soit pressé, soit
            périssable : produits pharmaceutiques, électronique de valeur, fleurs coupées,
            poisson frais, fruits hors saison, pièces de rechange urgentes. Un cinquième du
            fret aérien international relève de l'express — documents et petits colis
            livrés de porte à porte — et les quatre autres cinquièmes du fret général.
          nl: >
            Het vliegtuig vervoert *minder dan 1 %* van de wereldhandel in tonnen, en
            ongeveer 35 % van de waarde ervan. Wat erin gaat is dus duur, of haastig, of
            bederfelijk: farmaceutische producten, dure elektronica, snijbloemen, verse vis,
            fruit buiten het seizoen, dringende wisselstukken. Een vijfde van de
            internationale luchtvracht is express — documenten en kleine pakjes van deur tot
            deur — en de vier andere vijfden zijn algemene vracht.
          en: >
            Aircraft carry *less than 1%* of world trade by weight, and about 35% of its
            value. What goes aboard is therefore either expensive, or in a hurry, or
            perishable: pharmaceuticals, high-value electronics, cut flowers, fresh fish,
            out-of-season fruit, urgent spare parts. A fifth of international air cargo is
            express — documents and small parcels delivered door to door — and the other
            four fifths general freight.
        source: "Boeing, World Air Cargo Forecast 2022-2041, p. 5 and p. 7 (world trade shares from S&P Global GTA)"
        url: https://www.boeing.com/content/dam/boeing/boeingdotcom/market/assets/downloads/Boeing_World_Air_Cargo_Forecast_2022.pdf
        chart:
          kind: bars
          unit: "% of world trade"
          decimals: 0
          highlight: 1
          labels:
            - {fr: en tonnes, nl: in tonnen, en: by weight}
            - {fr: en valeur, nl: in waarde, en: by value}
          y: [1, 35]
          caption:
            fr: Part du commerce mondial transportée par avion — moins de 1 % du poids, environ un tiers de la valeur
            nl: Aandeel van de wereldhandel dat per vliegtuig gaat — minder dan 1 % van het gewicht, ongeveer een derde van de waarde
            en: Share of world trade carried by air — under 1% of the weight, about a third of the value
      - kind: benchmark
        label:
          fr: Liège, un des plus gros d'Europe
          nl: Luik, een van de grootste van Europa
          en: Liège, one of Europe's biggest
        text:
          fr: >
            La Belgique n'est pas un spectateur : Liège est l'un des cinq seuls aéroports de
            l'Union européenne à dépasser le million de tonnes de fret par an, aux côtés de
            Francfort, Paris-Charles-de-Gaulle, Amsterdam-Schiphol et Leipzig-Halle. En
            2024, il a enregistré 24 334 vols de fret et une croissance de 20,4 % en un an —
            la quatrième plus forte des vingt premiers aéroports européens. C'est une
            activité économique réelle, et c'est aussi ce qui rend le chiffre belge par
            habitant si élevé.
          nl: >
            België staat niet aan de zijlijn: Luik is een van de slechts vijf luchthavens van
            de Europese Unie die meer dan een miljoen ton vracht per jaar behandelen, naast
            Frankfurt, Parijs-Charles-de-Gaulle, Amsterdam-Schiphol en Leipzig-Halle. In 2024
            registreerde het 24.334 vrachtvluchten en een groei van 20,4 % op een jaar — de
            vierde sterkste van de twintig grootste Europese luchthavens. Dat is echte
            economische activiteit, en het is ook wat het Belgische cijfer per inwoner zo
            hoog maakt.
          en: >
            Belgium is no bystander: Liège is one of only five airports in the European Union
            handling more than a million tonnes of freight a year, alongside Frankfurt, Paris
            Charles de Gaulle, Amsterdam Schiphol and Leipzig Halle. In 2024 it recorded
            24,334 cargo flights and 20.4% growth in a year — the fourth highest of Europe's
            twenty largest airports. That is real economic activity, and it is also what
            makes the Belgian per-inhabitant figure so high.
        source: "Eurostat, Air freight transport statistics (data extracted December 2025)"
        url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Air_freight_transport_statistics
      - kind: structure
        label:
          fr: Le dossier Alibaba
          nl: Het Alibaba-dossier
          en: The Alibaba file
        text:
          fr: >
            Une partie de cette croissance a un nom. En décembre 2018, l'État belge signe
            avec Alibaba : le groupe annonce un investissement de 75 millions d'euros et un
            site de 220 000 m² à Liège, hub européen de sa logistique Cainiao. Sa raison
            d'être est précisément de faire voyager par avion des colis de faible valeur
            unitaire commandés en ligne — et c'est là que se joue la question. Le commerce
            en ligne transfrontalier emprunte l'avion dans *plus de 80 %* des cas, et le
            nombre de colis livrés dans le monde, 131 milliards par an, était attendu au
            double en quelques années.
          nl: >
            Een deel van die groei heeft een naam. In december 2018 tekent de Belgische staat
            met Alibaba: de groep kondigt een investering van 75 miljoen euro aan en een site
            van 220.000 m² in Luik, Europese hub van haar Cainiao-logistiek. De bestaansreden
            ervan is net om online bestelde pakjes met een lage waarde per stuk door de lucht
            te laten reizen — en daar zit de vraag. Grensoverschrijdende e-commerce gaat in
            *meer dan 80 %* van de gevallen per vliegtuig, en het aantal pakjes dat wereldwijd
            geleverd wordt, 131 miljard per jaar, zou in enkele jaren verdubbelen.
          en: >
            Part of that growth has a name. In December 2018 the Belgian state signed with
            Alibaba: the group announced a €75 million investment and a 220,000 m² site at
            Liège, the European hub of its Cainiao logistics arm. Its whole purpose is to fly
            low-unit-value parcels ordered online — and that is where the question lies.
            Cross-border e-commerce goes by air in *more than 80%* of cases, and the number of
            parcels delivered worldwide, 131 billion a year, was expected to double within a
            few years.
        source: "IATA, Value of Air Cargo — E-Commerce (June 2022); the Liège figures are those announced by Alibaba Group on 5 December 2018"
        url: https://www.iata.org/contentassets/62bae061c05b429ea508cb0c49907c4c/voac-fact-sheet-ecommerce.pdf
      - kind: caution
        text:
          fr: >
            Attention à l'endroit où vont les tonnes. Dans le modèle, ce qui quitte l'avion
            part vers le *rail* : c'est le seul substitut représenté, et il existe
            réellement sur le corridor eurasiatique. La vraie alternative pour l'essentiel
            du fret aérien reste pourtant le bateau — et le transport maritime international
            n'est pas modélisé du tout ici, pas plus que ses émissions. Une partie du fret
            aérien voyage par ailleurs en soute des vols de passagers : la supprimer
            supposerait aussi moins de vols de passagers, ce que les questions précédentes
            décident déjà.
          nl: >
            Let op waar de tonnen naartoe gaan. In het model gaat wat het vliegtuig verlaat
            naar het *spoor*: dat is de enige vervanger die erin zit, en hij bestaat echt op
            de Euraziatische corridor. De echte alternatieve modus voor het grootste deel
            van de luchtvracht blijft echter het schip — en de internationale zeevaart wordt
            hier helemaal niet gemodelleerd, haar uitstoot evenmin. Een deel van de
            luchtvracht reist bovendien in het ruim van passagiersvluchten: die wegnemen
            veronderstelt ook minder passagiersvluchten, wat de vorige vragen al beslissen.
          en: >
            Mind where the tonnes go. In the model, what leaves the aircraft goes to *rail*:
            it is the only substitute represented, and it genuinely exists on the Eurasian
            corridor. The real alternative for most air freight is nonetheless the ship —
            and international shipping is not modelled here at all, nor are its emissions.
            Part of air freight also travels in the hold of passenger flights: removing it
            would also mean fewer passenger flights, which the earlier questions already
            decide.
        source: nW-BE §3.1.4
      - kind: structure
        reveal: true
        label:
          fr: Un angle mort assumé
          nl: Een erkende blinde vlek
          en: An acknowledged blind spot
        text:
          fr: >
            Ici, le scénario ne formule aucune hypothèse propre. Le fret aérien suit
            simplement la baisse générale de l'intensité de transport de marchandises, soit
            {airChangePct} % par habitant, et sa part des tonnes-kilomètres reste à
            {airShareTkmTarget} %. Résultat : il pèse {freightTwhShareTopicTarget} % de
            l'énergie de ce thème en 2050, contre moins d'un cinquième en 2019 — non parce
            qu'il augmente, mais parce que tout le reste diminue autour de lui. Le carnet de
            calcul le signale lui-même : « we should maybe consider reductions of aviation
            intensity, and other modal shifts ».
          nl: >
            Hier formuleert het scenario geen eigen veronderstelling. Luchtvracht volgt
            gewoon de algemene daling van de goederenvervoersintensiteit, ofwel
            {airChangePct} % per inwoner, en haar aandeel in de tonkilometers blijft
            {airShareTkmTarget} %. Gevolg: ze weegt {freightTwhShareTopicTarget} % van de
            energie van dit thema in 2050, tegenover minder dan een vijfde in 2019 — niet
            omdat ze stijgt, maar omdat al de rest eromheen daalt. Het rekenboek signaleert
            het zelf: "we should maybe consider reductions of aviation intensity, and other
            modal shifts".
          en: >
            Here the scenario makes no assumption of its own. Air freight simply follows the
            general fall in freight transport intensity, that is {airChangePct}% per
            inhabitant, and its share of tonne-kilometres stays at {airShareTkmTarget}%. The
            result: it accounts for {freightTwhShareTopicTarget}% of this topic's energy in
            2050, against less than a fifth in 2019 — not because it grows, but because
            everything around it shrinks. The workbook says so itself: "we should maybe
            consider reductions of aviation intensity, and other modal shifts".
        source: nW-BE §3.1 and §3.1.4
    justification:
      fr: >
        négaWatt ne retient ici aucune hypothèse : {targetValue} tonnes-kilomètres par
        habitant en 2050, soit exactement {refValue} de 2019 diminué de la baisse générale
        de {airChangePct:abs} % de l'intensité de transport de marchandises. Aucun report
        modal n'est envisagé, et la section 3.1.4 le dit explicitement. La raison est
        double : le report du fret express vers d'autres modes est jugé difficile, et le
        substitut principal — le bateau — n'existe pas dans ce modèle de demande, qui
        ignore le transport maritime international. C'est donc moins un choix qu'une
        absence de choix, et le rapport le reconnaît en commentaire.
      nl: >
        negaWatt houdt hier geen enkele veronderstelling aan: {targetValue} tonkilometer per
        inwoner in 2050, precies {refValue} van 2019 verminderd met de algemene daling van
        {airChangePct:abs} % van de goederenvervoersintensiteit. Er wordt geen enkele modale
        verschuiving overwogen, en sectie 3.1.4 zegt dat expliciet. De reden is dubbel: de
        verschuiving van expresvracht naar andere modi wordt moeilijk geacht, en de
        belangrijkste vervanger — het schip — bestaat niet in dit vraagmodel, dat de
        internationale zeevaart negeert. Het is dus minder een keuze dan een afwezigheid van
        keuze, en het rapport erkent dat in een commentaar.
      en: >
        negaWatt makes no assumption here: {targetValue} tonne-kilometres per inhabitant in
        2050, exactly the {refValue} of 2019 less the general {airChangePct:abs}% fall in
        freight transport intensity. No modal shift is envisaged, and section 3.1.4 says so
        explicitly. The reason is twofold: shifting express freight to other modes is judged
        difficult, and the main substitute — the ship — does not exist in this demand model,
        which ignores international shipping. It is therefore less a choice than an absence
        of one, and the report acknowledges as much in a comment.
    debate:
      fr: >
        C'est la question la plus inconfortable de l'atelier, parce que la réponse du
        scénario est « rien ». Deux lectures s'opposent. D'un côté, le fret aérien est
        surtout de l'express et du périssable, il dépend de décisions industrielles
        mondiales, et un pays de onze millions d'habitants qui abrite un hub de fret n'en
        décide pas seul. De l'autre, laisser un poste passer à près d'un tiers de l'énergie
        d'un thème sans jamais l'interroger est exactement ce que la méthode négaWatt
        reproche aux scénarios tendanciels — d'autant que le maritime, la seule alternative
        sérieuse, est absent du modèle et que ses émissions n'apparaissent donc nulle part.
      nl: >
        Dit is de ongemakkelijkste vraag van de workshop, omdat het antwoord van het scenario
        "niets" is. Twee lezingen staan tegenover elkaar. Enerzijds is luchtvracht vooral
        expres en bederfelijke waar, hangt ze af van wereldwijde industriële beslissingen, en
        beslist een land van elf miljoen inwoners met een vrachthub daar niet alleen over.
        Anderzijds is een post die naar bijna een derde van de energie van een thema
        opschuift zonder ooit bevraagd te worden precies wat de negaWatt-methode
        trendscenario's verwijt — te meer daar de zeevaart, het enige ernstige alternatief,
        uit het model ontbreekt en haar uitstoot dus nergens verschijnt.
      en: >
        This is the most uncomfortable question in the workshop, because the scenario's
        answer is "nothing". Two readings compete. On one side, air freight is mostly express
        and perishable goods, it depends on worldwide industrial decisions, and a country of
        eleven million inhabitants that hosts a cargo hub does not decide it alone. On the
        other, letting one item drift to nearly a third of a topic's energy without ever
        questioning it is exactly what the négaWatt method reproaches business-as-usual
        scenarios for — all the more so since shipping, the only serious alternative, is
        absent from the model and its emissions therefore appear nowhere.
