    nl: Wat de groepen schreven
    en: What the groups wrote
  reveal.bolder:
    fr: Les groupes ont été plus ambitieux que négaWatt.
    nl: De groepen waren ambitieuzer dan negaWatt.
    en: The groups were bolder than negaWatt.
  reveal.shyer:
    fr: Les groupes ont été plus prudents que négaWatt.
    nl: De groepen waren voorzichtiger dan negaWatt.
    en: The groups were more cautious than negaWatt.
  reveal.aligned:
    fr: Les groupes ont visé presque exactement la même valeur que négaWatt.
    nl: De groepen kwamen vrijwel exact op de negaWatt-waarde uit.
    en: The groups landed almost exactly on the negaWatt value.
  reveal.bolderShort:
    fr: plus ambitieux
    nl: ambitieuzer
    en: bolder
  reveal.shyerShort:
    fr: plus prudent
