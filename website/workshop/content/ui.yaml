  # -------------------------------------------------------------------- units
  # Keyed by the raw `unit` string the notebook exports, so a new lever only
  # needs a line here. Falls back to the raw string if a key is missing.
  "unit.km/person/day":
    fr: km/pers./jour
    nl: km/pers./dag
    en: km/person/day
  "unit.% of motorised km":
    fr: "% des km motorisés"
    nl: "% van de gemotoriseerde km"
    en: "% of motorised km"
  "unit.persons/car":
    fr: personnes/voiture
    nl: personen/auto
    en: people per car
  "unit.% of 2019":
    fr: "% de 2019"
    nl: "% van 2019"
    en: "% of 2019"
  "unit.tkm/person/year":
    fr: tkm/pers./an
    nl: tkm/pers./jaar
    en: tkm/person/year
  "unit.% of tonne-km":
