    nl: "% van de tonkilometers"
    en: "% of tonne-km"
  "unit.tonnes":
    fr: tonnes
    nl: ton
    en: tonnes

  # ------------------------------------------------------------------ generic
  common.source:
    fr: Source
    nl: Bron
    en: Source
