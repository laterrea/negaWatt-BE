# =============================================================================
# negaWatt-BE workshop — interface strings (FR / NL / EN)
#
# Hand-edited. Built into website/data/workshop_content.js by
# scripts/build_workshop_content.py, which fails if any string is missing a
# language. Placeholders in braces are filled in by the page at run time.
#
# NOTE: the Dutch was written by the implementer, not a native speaker, and
# needs a review pass before a real workshop (docs/workshop_module.md, Q5).
# =============================================================================

meta:
  languages: [fr, nl, en]
  default: fr

strings:
  lang.fr: {fr: Français, nl: Frans, en: French}
  lang.nl: {fr: Néerlandais, nl: Nederlands, en: Dutch}
  lang.en: {fr: Anglais, nl: Engels, en: English}

  app.title:
    fr: Atelier négaWatt Belgique
    nl: negaWatt België workshop
    en: negaWatt Belgium workshop
  app.tagline:
    fr: À vous de construire le scénario
    nl: Bouw zelf het scenario
    en: You build the scenario

  # ---------------------------------------------------------------- joining
  join.title:
    fr: Rejoindre un atelier
    nl: Neem deel aan een workshop
    en: Join a workshop
  join.lead:
    fr: Entrez le code affiché par l'animateur, puis donnez un nom à votre groupe.
    nl: Voer de code in die de begeleider toont en geef je groep een naam.
    en: Enter the code shown by the facilitator, then give your group a name.
  join.codeLabel:
    fr: Code de session
    nl: Sessiecode
    en: Session code
  join.groupLabel:
    fr: Nom de votre groupe
    nl: Naam van je groep
    en: Your group's name
  join.groupPlaceholder:
    fr: "p. ex. Table 3, Les cyclistes…"
    nl: "bv. Tafel 3, De fietsers…"
    en: "e.g. Table 3, The cyclists…"
  join.start:
    fr: Commencer
    nl: Beginnen
    en: Start
  join.badCode:
    fr: Ce code ne correspond à aucune session ouverte.
    nl: Deze code hoort bij geen enkele open sessie.
    en: That code does not match any open session.
  join.needName:
    fr: Donnez d'abord un nom à votre groupe.
    nl: Geef je groep eerst een naam.
    en: Give your group a name first.
  join.solo:
    fr: Essayer seul
    nl: Alleen uitproberen
    en: Try it on your own
  join.soloHint:
    fr: Crée une session privée, exclue des résultats collectifs.
    nl: Maakt een privésessie, niet meegerekend in de gezamenlijke resultaten.
    en: Creates a private session, excluded from the collective results.

  # ------------------------------------------------------------------ groups
  group.autoPrefix:
    fr: Groupe
    nl: Groep
    en: Group
  group.rename:
    fr: renommer
    nl: hernoemen
    en: rename
  group.renamePrompt:
    fr: Nom de votre groupe
    nl: Naam van je groep
    en: Your group's name
  group.renameFailed:
    fr: Ce nom est déjà pris.
    nl: Die naam is al in gebruik.
    en: That name is already taken.
  join.badLink:
    fr: Ce lien ne correspond à aucun atelier ouvert. Demandez le lien à l'animateur.
    nl: Deze link hoort bij geen enkele open workshop. Vraag de begeleider om de link.
    en: This link does not match any open workshop. Ask the facilitator for the link.
  facil.workshopName:
    fr: Nom de l'atelier (dans le lien)
    nl: Naam van de workshop (in de link)
    en: Workshop name (used in the link)
  facil.shareLink:
    fr: Lien à partager avec les participants
    nl: Link om met de deelnemers te delen
    en: Link to share with participants
  facil.copyLink:
    fr: Copier le lien
    nl: Link kopiëren
    en: Copy the link
  facil.copied:
    fr: Copié
    nl: Gekopieerd
    en: Copied
  facil.codeFallback:
    fr: Ou, à taper depuis l'écran
    nl: Of, om over te typen van het scherm
    en: Or, to type from the screen
  facil.slugTaken:
    fr: Ce nom d'atelier est déjà utilisé, choisissez-en un autre.
    nl: Deze workshopnaam bestaat al, kies een andere.
    en: That workshop name is already in use, pick another.

  # ------------------------------------------------------------------ playing
  play.progress:
    fr: "Question {n} sur {total}"
    nl: "Vraag {n} van {total}"
    en: "Question {n} of {total}"
  play.dragHint:
    fr: Faites glisser le curseur pour prolonger la courbe jusqu'en 2050.
    nl: Sleep de schuifknop om de curve tot 2050 te verlengen.
    en: Drag the handle to extend the curve to 2050.
  play.unanswered:
    fr: Pas encore de réponse
    nl: Nog geen antwoord
    en: No answer yet
  play.yourAnswer:
    fr: Votre réponse pour 2050
    nl: Jullie antwoord voor 2050
    en: Your answer for 2050
  play.refValue:
    fr: "En {year}"
    nl: "In {year}"
    en: "In {year}"
  play.facts.title:
    fr: Quelques repères
    nl: Enkele referentiepunten
    en: A few reality checks
  play.facts.kind.trend:
    fr: Tendance passée
    nl: Trend uit het verleden
    en: Past trend
  play.facts.kind.structure:
    fr: Contexte belge
    nl: Belgische context
    en: Belgian context
  play.facts.kind.benchmark:
    fr: Ailleurs en Europe
    nl: Elders in Europa
    en: Elsewhere in Europe
  play.facts.kind.tangible:
    fr: Concrètement
    nl: Concreet
    en: In practice
  play.facts.kind.caution:
    fr: À manier avec prudence
    nl: Met voorzichtigheid te hanteren
    en: Handle with care
  play.leverage.title:
    fr: Effet sur la demande d'énergie
    nl: Effect op de energievraag
    en: Effect on energy demand
  play.leverage.value:
    fr: "{twh} TWh en 2050 pour la mobilité intérieure"
    nl: "{twh} TWh in 2050 voor de binnenlandse mobiliteit"
    en: "{twh} TWh in 2050 for inland mobility"
  # Compared with the observed 2019 demand, never with negaWatt: see
  # docs/workshop_module.md, decision D17.
  play.leverage.vs2019:
    fr: "soit {delta} % de moins qu'en {year}"
    nl: "dat is {delta} % minder dan in {year}"
    en: "that is {delta}% less than in {year}"
  play.leverage.above2019:
    fr: "soit {delta} % de plus qu'en {year}"
    nl: "dat is {delta} % meer dan in {year}"
    en: "that is {delta}% more than in {year}"
  play.leverage.hidden:
    fr: Révélé après votre réponse
    nl: Wordt na jullie antwoord getoond
    en: Revealed once you answer
  play.leverage.caveat:
    fr: Effet de ce seul levier, les autres hypothèses restant inchangées.
    nl: Effect van deze ene hefboom, met de andere veronderstellingen ongewijzigd.
    en: The effect of this lever alone, with the other assumptions left unchanged.
  play.confidence.label:
    fr: Votre degré de certitude
    nl: Hoe zeker zijn jullie?
    en: How sure are you?
  play.confidence.hunch:
    fr: Intuition
    nl: Gevoel
    en: A hunch
  play.confidence.fairly:
    fr: Assez sûrs
    nl: Redelijk zeker
    en: Fairly sure
  play.confidence.confident:
    fr: Confiants
    nl: Overtuigd
    en: Confident
  play.condition.label:
    fr: Pour que cela arrive, il faudrait que…
    nl: Om dit te bereiken, zou…
    en: For this to happen, it would take…
  play.condition.placeholder:
    fr: une phrase, la condition qui compte le plus
    nl: één zin, de belangrijkste voorwaarde
    en: one sentence, the condition that matters most
  play.back:
    fr: Précédent
    nl: Vorige
    en: Back
  play.next:
    fr: Suivant
    nl: Volgende
    en: Next
  play.finish:
    fr: Terminer
    nl: Afronden
    en: Finish
  play.done.title:
    fr: C'est envoyé, merci !
    nl: Verzonden, bedankt!
    en: Sent — thank you!
  play.done.body:
    fr: Vos réponses sont enregistrées. Elles apparaîtront sur l'écran commun lors de la mise en commun.
    nl: Jullie antwoorden zijn opgeslagen. Ze verschijnen straks op het gezamenlijke scherm.
    en: Your answers are saved. They will appear on the shared screen during the reveal.
  play.done.review:
    fr: Revoir nos réponses
    nl: Onze antwoorden bekijken
    en: Review our answers
  play.saved:
    fr: Enregistré
    nl: Opgeslagen
    en: Saved
  play.offline:
    fr: Hors ligne — vos réponses sont gardées sur cet appareil et renvoyées dès le retour du réseau.
    nl: Offline — jullie antwoorden blijven op dit toestel en worden verzonden zodra er weer verbinding is.
    en: Offline — your answers are kept on this device and sent as soon as the network returns.

  # ------------------------------------------------------------------ reveal
  reveal.title:
    fr: Mise en commun
    nl: Gezamenlijke resultaten
    en: The reveal
  reveal.waiting:
    fr: En attente des réponses…
    nl: Wachten op antwoorden…
    en: Waiting for answers…
  reveal.groups:
