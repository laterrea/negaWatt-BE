# =============================================================================
# negaWatt-BE workshop — interface strings (FR / NL / EN)
#
# Hand-edited. Built into website/data/workshop_content.js by
# scripts/build_workshop_content.py, which fails if any string is missing a
# language. Placeholders in braces are filled in by the page at run time.
#
# NOTE: the Dutch was written by the implementer, not a native speaker, and
# needs a review pass before a real workshop (docs/workshop_module.md, Q5).
# =============================================================================

meta:
  languages: [fr, nl, en]
  default: fr

strings:
  lang.fr: {fr: Français, nl: Frans, en: French}
  lang.nl: {fr: Néerlandais, nl: Nederlands, en: Dutch}
  lang.en: {fr: Anglais, nl: Engels, en: English}

  app.title:
    fr: Atelier négaWatt Belgique
    nl: negaWatt België workshop
    en: negaWatt Belgium workshop
  app.tagline:
    fr: À vous de construire le scénario
    nl: Bouw zelf het scenario
    en: You build the scenario

  # --------------------------------------------------------------- starting
  start.title:
    fr: Commencer l'atelier
    nl: De workshop starten
    en: Start the workshop
  start.lead:
    fr: Donnez un nom à votre groupe si vous voulez, puis lancez-vous. Il n'y a rien d'autre à saisir.
    nl: Geef je groep een naam als je wil, en begin. Er is niets anders in te vullen.
    en: Give your group a name if you like, then go. There is nothing else to fill in.
  start.topicLabel:
    fr: Thème
    nl: Thema
    en: Topic
  start.groupLabel:
    fr: Nom de votre groupe (facultatif)
    nl: Naam van je groep (optioneel)
    en: Your group's name (optional)
  start.groupPlaceholder:
    fr: "p. ex. Table 3 — ou laissez vide"
    nl: "bv. Tafel 3 — of laat leeg"
    en: "e.g. Table 3 — or leave it empty"
  start.go:
    fr: Commencer
    nl: Beginnen
    en: Start
  start.facilitator:
    fr: Pour l'animateur
    nl: Voor de begeleider
    en: For the facilitator
  start.openReveal:
    fr: Écran de mise en commun
    nl: Gezamenlijk scherm
    en: The reveal screen
  start.printCards:
    fr: Imprimer les fiches
    nl: Kaarten afdrukken
    en: Print the fact cards

  # ------------------------------------------------------------------ groups
  group.autoPrefix:
    fr: Groupe
    nl: Groep
    en: Group
  group.rename:
    fr: renommer
    nl: hernoemen
    en: rename
  group.renamePrompt:
    fr: Nom de votre groupe
    nl: Naam van je groep
    en: Your group's name
  group.renameFailed:
    fr: Le changement de nom n'a pas pu être enregistré.
    nl: De naamswijziging kon niet worden opgeslagen.
    en: The new name could not be saved.

  # ------------------------------------------------------------------ playing
  play.progress:
    fr: "Question {n} sur {total}"
    nl: "Vraag {n} van {total}"
    en: "Question {n} of {total}"
  play.dragHint:
    fr: Faites glisser le curseur pour prolonger la courbe jusqu'en 2050.
    nl: Sleep de schuifknop om de curve tot 2050 te verlengen.
    en: Drag the handle to extend the curve to 2050.
  play.unanswered:
    fr: Pas encore de réponse
    nl: Nog geen antwoord
    en: No answer yet
  play.yourAnswer:
    fr: Votre réponse pour 2050
    nl: Jullie antwoord voor 2050
    en: Your answer for 2050
  play.refValue:
    fr: "En {year}"
    nl: "In {year}"
    en: "In {year}"
  play.facts.title:
    fr: Quelques repères
    nl: Enkele referentiepunten
    en: A few reality checks
  play.facts.kind.trend:
    fr: Tendance passée
    nl: Trend uit het verleden
    en: Past trend
  play.facts.kind.structure:
    fr: Contexte belge
    nl: Belgische context
    en: Belgian context
  play.facts.kind.benchmark:
    fr: Ailleurs en Europe
    nl: Elders in Europa
    en: Elsewhere in Europe
  play.facts.kind.tangible:
    fr: Concrètement
    nl: Concreet
    en: In practice
  play.facts.kind.caution:
    fr: À manier avec prudence
    nl: Met voorzichtigheid te hanteren
    en: Handle with care
  play.leverage.title:
    fr: Ce que votre réponse change
    nl: Wat jullie antwoord verandert
    en: What your answer changes
  play.leverage.saves:
    fr: "{delta} TWh de moins en 2050"
    nl: "{delta} TWh minder in 2050"
    en: "{delta} TWh less in 2050"
  play.leverage.costs:
    fr: "{delta} TWh de plus en 2050"
    nl: "{delta} TWh meer in 2050"
    en: "{delta} TWh more in 2050"
  play.leverage.neutral:
    fr: Effet négligeable sur la demande d'énergie
    nl: Verwaarloosbaar effect op de energievraag
    en: A negligible effect on energy demand
  play.leverage.versus:
    fr: "par rapport au maintien du niveau de {year} ({ref})"
    nl: "vergeleken met het handhaven van het niveau van {year} ({ref})"
    en: "compared with staying at the {year} level ({ref})"
  play.leverage.versusPlain:
    fr: "par rapport au maintien du niveau de {year}"
    nl: "vergeleken met het handhaven van het niveau van {year}"
    en: "compared with staying at the {year} level"
  play.leverage.hidden:
    fr: Révélé après votre réponse
    nl: Wordt na jullie antwoord getoond
    en: Revealed once you answer
  play.leverage.caveat:
    fr: "Effet de ce seul levier : les sept autres hypothèses restent inchangées."
    nl: "Effect van deze ene hefboom: de zeven andere veronderstellingen blijven ongewijzigd."
    en: "This lever alone: the other seven assumptions are left unchanged."
  play.confidence.label:
    fr: Votre degré de certitude
    nl: Hoe zeker zijn jullie?
    en: How sure are you?
  play.confidence.hunch:
    fr: Intuition
    nl: Gevoel
    en: A hunch
  play.confidence.fairly:
    fr: Assez sûrs
    nl: Redelijk zeker
    en: Fairly sure
  play.confidence.confident:
    fr: Confiants
    nl: Overtuigd
    en: Confident
  play.condition.label:
    fr: Pour que cela arrive, il faudrait que…
    nl: Om dit te bereiken, zou…
    en: For this to happen, it would take…
  play.condition.placeholder:
    fr: une phrase, la condition qui compte le plus
    nl: één zin, de belangrijkste voorwaarde
    en: one sentence, the condition that matters most
  play.back:
    fr: Précédent
    nl: Vorige
    en: Back
  play.next:
    fr: Suivant
    nl: Volgende
    en: Next
  play.finish:
    fr: Terminer
    nl: Afronden
    en: Finish
  play.done.title:
    fr: C'est envoyé, merci !
    nl: Verzonden, bedankt!
    en: Sent — thank you!
  play.done.body:
    fr: Vos réponses sont enregistrées. Elles apparaîtront sur l'écran commun lors de la mise en commun.
    nl: Jullie antwoorden zijn opgeslagen. Ze verschijnen straks op het gezamenlijke scherm.
    en: Your answers are saved. They will appear on the shared screen during the reveal.
  play.done.review:
    fr: Revoir nos réponses
    nl: Onze antwoorden bekijken
    en: Review our answers
  play.saved:
    fr: Enregistré
    nl: Opgeslagen
    en: Saved
  play.offline:
    fr: Hors ligne — vos réponses sont gardées sur cet appareil et renvoyées dès le retour du réseau.
    nl: Offline — jullie antwoorden blijven op dit toestel en worden verzonden zodra er weer verbinding is.
    en: Offline — your answers are kept on this device and sent as soon as the network returns.

  # ------------------------------------------------------------------ reveal
  reveal.title:
