    nl: "{n} groepen"
    en: "{n} groups"
  reveal.groupsOne:
    fr: 1 groupe
    nl: 1 groep
    en: 1 group
  reveal.groupsLabel:
    fr: groupes
    nl: groepen
    en: groups
  reveal.sessionsLabel:
    fr: sessions
    nl: sessies
    en: sessions
  reveal.sessions:
    fr: "{n} sessions"
    nl: "{n} sessies"
    en: "{n} sessions"
  reveal.mean:
    fr: Moyenne des groupes
    nl: Gemiddelde van de groepen
    en: Group average
  reveal.nwValue:
    fr: Valeur du scénario négaWatt
    nl: Waarde van het negaWatt-scenario
    en: The negaWatt scenario's value
  reveal.show:
    fr: Révéler la valeur négaWatt
    nl: Toon de negaWatt-waarde
    en: Reveal the negaWatt value
  reveal.why:
    fr: Pourquoi cette valeur
    nl: Waarom deze waarde
    en: Why this value
  reveal.debate:
    fr: Ce qu'on peut lui reprocher
    nl: Wat je erop kunt aanmerken
    en: What can be held against it
  reveal.conditions:
    fr: Ce que les groupes ont écrit
    nl: Wat de groepen schreven
    en: What the groups wrote
  reveal.bolder:
    fr: Les groupes ont été plus ambitieux que négaWatt.
    nl: De groepen waren ambitieuzer dan negaWatt.
    en: The groups were bolder than negaWatt.
  reveal.shyer:
    fr: Les groupes ont été plus prudents que négaWatt.
    nl: De groepen waren voorzichtiger dan negaWatt.
    en: The groups were more cautious than negaWatt.
  reveal.aligned:
    fr: Les groupes ont visé presque exactement la même valeur que négaWatt.
    nl: De groepen kwamen vrijwel exact op de negaWatt-waarde uit.
    en: The groups landed almost exactly on the negaWatt value.
  reveal.bolderShort:
    fr: plus ambitieux
    nl: ambitieuzer
    en: bolder
  reveal.shyerShort:
    fr: plus prudent
    nl: voorzichtiger
    en: more cautious
  reveal.alignedShort:
    fr: identique
    nl: gelijk
    en: same
  reveal.next:
    fr: Levier suivant
    nl: Volgende hefboom
    en: Next lever
  reveal.prev:
    fr: Levier précédent
    nl: Vorige hefboom
    en: Previous lever
  reveal.summary:
    fr: Vue d'ensemble
    nl: Overzicht
    en: Overview
  reveal.closest:
    fr: Groupe le plus proche de négaWatt
    nl: Groep die negaWatt het dichtst benadert
    en: Closest to negaWatt
  reveal.boldest:
    fr: Groupe le plus ambitieux
    nl: Meest ambitieuze groep
    en: Boldest group
  reveal.needKey:
    fr: Clé d'animateur requise pour agréger plusieurs sessions.
    nl: Begeleiderssleutel nodig om meerdere sessies samen te voegen.
    en: A facilitator key is needed to aggregate several sessions.

