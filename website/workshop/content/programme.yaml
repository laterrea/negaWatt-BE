# =============================================================================
# negaWatt-BE workshop — which questions are played (the line-up)
#
# HAND-EDITED. The one place to switch questions on and off.
#
#   active      the line-up in use. Change it, then rebuild:
#                   python scripts/build_workshop_content.py
#               (no notebook run needed). `--lineup <name>` builds another one
#               without editing this file; `--check --lineup <name>` validates it.
#   lineups     each line-up names the themes the entry page offers, in that order,
#               and for each theme the questions it plays, in letter order (A, B, C…
#               on the screen, on the printed cards and on the reveal). `all` plays
#               every question of the theme's file, in file order.
#
# A question left out is NOT deleted: it stays in its topic file and its lever
# module, is still built and checked, and becomes "archived" — off the play screen
# and the printed cards (cards.html?all=1 still prints it), but shown on the reveal
# whenever the date window holds answers to it. Answers are stored by question id,
# so switching a question off and on again loses nothing.
#
# A theme may play questions worded in another theme's file if its own file says
# `include: [<topic>, …]` — `buildings-heat` does this with residential and tertiary
# questions. Groups are stored under the theme they played, so a sitting of
# `buildings-heat` and an older one of `residential-heat` stay apart on the reveal.
#
# See docs/workshop_module.md, D69 and D70.
# =============================================================================

active: workshop-2026-11

lineups:

  # Every question, as played until October 2026 (four themes, 30 questions).
  full:
    topics:
      inland-mobility: all
      # the seven questions played until October 2026; plane-trips and plane-load,
      # added after them in the file, stand for four of them since November 2026
      international-mobility: [long-haul-flights, short-haul-flights, long-haul-load,
                               short-haul-load, plane-fuel, hydrogen-flights, air-freight]
      residential-heat: all
      tertiary-heat: all

  # The workshop of 2 November 2026: nine questions in three themes, "the collective,
  # sufficiency and clarity first" (docs/workshop_2026-11/request_scenario_fiches.md).
  # Active since 30 October 2026; `full` gives back the thirty questions of September-
  # October 2026 (python scripts/build_workshop_content.py --lineup full).
  workshop-2026-11:
    topics:
      inland-mobility: [car-share, car-occupancy, car-energy]
      international-mobility: [plane-trips, plane-load, air-freight]
      buildings-heat: [floor-area, thermostat, ter-thermostat]

# -----------------------------------------------------------------------------
# Question ids retired before line-ups existed: no file defines them any more, but
# the database may hold answers under them (truck-load, car-energy__speed and
# car-energy__size do, from September-October 2026). Listed so that every stored
# answer can be traced to what was asked; the build refuses to reuse one of these
# ids, since an old answer would then be read with a new meaning.
# docs/workshop_question_ids.md is generated from this and the lever exports.
retired:
  truck-load:
    topic: inland-mobility
    unit: tonnes (average payload per vehicle-km, empty runs included)
    commit: aa62082
    replacedBy: [truck-fill]
    why: "a payload in tonnes became a filling rate in %, D62"
  car-energy__speed:
    topic: inland-mobility
    unit: "% less energy per km (speed slider of car-energy)"
    commit: b21345c
    replacedBy: [car-energy__speed-kmh]
    why: "the slider now speaks km/h less on average, D64"
  car-energy__size:
    topic: inland-mobility
    unit: "% less energy per km (size slider of car-energy)"
    commit: b21345c
    replacedBy: [car-energy__mass]
    why: "the slider now speaks an average car mass in kg, D64"
  long-haul-fuel:
    topic: international-mobility
    unit: kWh per long-haul aircraft-km
    commit: 1f10348
    replacedBy: [plane-fuel]
    why: "merged with short-haul-fuel into the fleet average, D45"
  short-haul-fuel:
    topic: international-mobility
    unit: kWh per short-haul aircraft-km
    commit: 1f10348
    replacedBy: [plane-fuel]
    why: "merged with long-haul-fuel into the fleet average, D45"
  insulation:
    topic: residential-heat
    unit: kWh/m²/year of heating need
    commit: e4f58a4
    replacedBy: [renovation-rate, renovation-depth]
    why: "split into the rate and the depth of renovation, D51"
