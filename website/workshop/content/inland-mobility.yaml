# =============================================================================
# negaWatt-BE workshop — topic: inland mobility
#
# HAND-EDITED. Wording, facts and justifications live here; every *number* comes
# either from the notebook (as a {placeholder}, resolved at build time from the
# lever's `facts` block in website/data/levers_transport.js) or from an external
# source quoted with its URL.
#
# Built by scripts/build_workshop_content.py, which refuses to build if a string
# is missing a language, a fact has no source, a placeholder does not resolve, or
# the lever ids here and in the notebook export disagree.
#
# NOTE: the Dutch was written by the implementer, not a native speaker, and needs
# a review pass before a real workshop (docs/workshop_module.md, Q5).
# =============================================================================

topic: inland-mobility
sector: transport

title:
  fr: Mobilité intérieure
  nl: Binnenlandse mobiliteit
  en: Inland mobility

lead:
  fr: >
    Les déplacements de personnes et de marchandises à l'intérieur de la Belgique.
    L'aviation fait l'objet d'un autre atelier.
  nl: >
    Het vervoer van personen en goederen binnen België. De luchtvaart komt in een
    andere workshop aan bod.
  en: >
    Moving people and goods inside Belgium. Aviation is the subject of a separate
    workshop.

intro:
  fr: >
    Vous allez fixer huit hypothèses de comportement et de politique publique pour
    2050 — celles qui *produisent* les chiffres d'énergie du scénario négaWatt.
    Vous ne connaissez pas encore les valeurs retenues par négaWatt : à vous de
    décider ce qui vous paraît à la fois souhaitable et atteignable. Chaque
    question tient sur un écran, avec quelques repères factuels pour nourrir la
    discussion.
  nl: >
    Jullie stellen acht gedrags- en beleidsveronderstellingen voor 2050 vast —
    precies die welke de energiecijfers van het negaWatt-scenario *voortbrengen*.
    De waarden van negaWatt kennen jullie nog niet: beslis zelf wat jullie zowel
    wenselijk als haalbaar vinden. Elke vraag past op één scherm, met een paar
    feitelijke referentiepunten voor de discussie.
  en: >
    You are going to set eight behavioural and policy assumptions for 2050 — the
    ones that *produce* the negaWatt scenario's energy figures. You do not yet
    know the values negaWatt chose: decide what strikes you as both desirable and
    achievable. Each question fits on one screen, with a few factual anchors to
    feed the discussion.

# The +/- effects chart on the summary screen. Opt-in per topic (D40): it needs
# every lever of the topic to carry a usable single-lever `impact` response, and
# the build refuses to turn it on otherwise.
summaryChart:
  enabled: true
  unit: TWh
  decimals: 2
  caption:
    fr: >
      Ce que chacune de vos réponses fait, à elle seule, à la demande d'énergie de la
      mobilité intérieure belge en 2050 — par rapport au maintien du niveau d'aujourd'hui
      pour le même indicateur.
    nl: >
      Wat elk van jullie antwoorden op zichzelf doet met de energievraag van de Belgische
      binnenlandse mobiliteit in 2050 — vergeleken met het behoud van het huidige niveau
      voor dezelfde indicator.
    en: >
      What each of your answers does, on its own, to the energy demand of Belgian inland
      mobility in 2050 — compared with keeping today's level of the same indicator.
  note:
    fr: >
      Chaque barre est exacte pour son levier pris seul, les sept autres restant à leur
      valeur du scénario. Les leviers se combinent de façon multiplicative, donc leur
      somme n'est qu'un ordre de grandeur.
    nl: >
      Elke balk is exact voor zijn eigen hefboom alleen, met de zeven andere op hun
      scenariowaarde. De hefbomen werken multiplicatief samen, dus hun som is enkel een
      grootteorde.
    en: >
      Each bar is exact for its own lever taken alone, with the other seven left at their
      scenario value. The levers compound multiplicatively, so their sum is an order of
      magnitude only.

# -----------------------------------------------------------------------------
levers:

  # ------------------------------------------------------------ 1 -------------
  ground-km-day:
    short:
      fr: Distance parcourue par jour
      nl: Afgelegde afstand per dag
      en: Distance travelled per day
    question:
      fr: "Jusqu'où la sobriété peut-elle ramener la mobilité motorisée quotidienne en 2050 ?"
      nl: "Tot hoever kan soberheid de dagelijkse gemotoriseerde mobiliteit in 2050 terugbrengen?"
      en: "How far can sufficiency bring daily motorised travel down by 2050?"
    subtitle:
      fr: >
        Voiture, bus et autocar, train, tram et métro, deux-roues motorisés : en kilomètres
        par personne et par jour, à l'intérieur du pays. La marche, le vélo et l'avion sont
        comptés à part.
      nl: >
        Auto, bus en touringcar, trein, tram en metro, gemotoriseerde tweewielers: in
        kilometers per persoon per dag, binnen het land. Wandelen, fietsen en vliegen worden
        apart geteld.
      en: >
        Car, bus and coach, train, tram and metro, motorised two-wheelers: in kilometres per
        person per day, inside the country. Walking, cycling and flying are counted
        separately.
    tangible:
      fr: "{value} km par jour, pour chaque habitant, nourrissons et centenaires compris."
      nl: "{value} km per dag, voor elke inwoner, van baby tot honderdjarige."
      en: "{value} km a day, for every inhabitant, newborns and centenarians included."
    facts:
      - kind: structure
        reveal: true
        text:
          fr: >
            Le scénario réduit la mobilité totale de {totalIntensityChangePct:abs} %, mais
            l'essentiel vient de l'avion : les kilomètres aériens par personne chutent de
            {aviationChangePct:abs} %, contre {changePct:abs} % pour le sol motorisé.
          nl: >
            Het scenario verlaagt de totale mobiliteit met {totalIntensityChangePct:abs} %,
            maar het grootste deel komt van de luchtvaart: de vliegkilometers per persoon
            dalen met {aviationChangePct:abs} %, tegenover {changePct:abs} % op de grond.
          en: >
            The scenario cuts total mobility by {totalIntensityChangePct:abs}%, but most of it
            comes from aviation: air kilometres per person fall {aviationChangePct:abs}%, against
            {changePct:abs}% for motorised ground travel.
        source: nW-BE §1.2.1 and §2.1.1
      - kind: structure
        text:
          fr: >
            En 2019, les {refValue} km parcourus chaque jour au sol par Belge se répartissaient
            ainsi : {carKmDay2019} km en voiture, {busKmDay2019} km en bus et autocar,
            {railKmDay2019} km en train, {tramKmDay2019} km en tram ou métro et
            {motoKmDay2019} km en deux-roues motorisés. *La voiture pèse à elle seule les
            quatre cinquièmes.* S'y ajoutent, hors de cette question, {bikeKmDay2019} km à vélo,
            {walkKmDay2019} km à pied et 8,7 km en avion.
          nl: >
            In 2019 verdeelden de {refValue} km die elke Belg dagelijks over land aflegde zich
            zo: {carKmDay2019} km met de auto, {busKmDay2019} km met bus en touringcar,
            {railKmDay2019} km met de trein, {tramKmDay2019} km met tram of metro en
            {motoKmDay2019} km met gemotoriseerde tweewielers. *De auto alleen al is goed voor
            vier vijfde.* Daar komen, buiten deze vraag, nog {bikeKmDay2019} km met de fiets,
            {walkKmDay2019} km te voet en 8,7 km door de lucht bij.
          en: >
            In 2019 the {refValue} km every Belgian covered on the ground each day split as
            {carKmDay2019} km by car, {busKmDay2019} km by bus and coach, {railKmDay2019} km by
            train, {tramKmDay2019} km by tram or metro and {motoKmDay2019} km by motorised
            two-wheelers. *The car alone accounts for four fifths of it.* On top of that, and
            outside this question, come {bikeKmDay2019} km by bicycle, {walkKmDay2019} km on
            foot and 8.7 km by air.
        source: JRC-IDEES-2023, population Statbel
        url: https://joint-research-centre.ec.europa.eu/potencia/jrc-idees_en
        chart:
          kind: bars
          unit: km/person/day
          decimals: 1
          highlight: 0
          labels:
            - {fr: Voiture, nl: Auto, en: Car}
            - {fr: Bus/car, nl: Bus, en: Bus}
            - {fr: Train, nl: Trein, en: Train}
            - {fr: Tram/métro, nl: Tram/metro, en: Tram/metro}
            - {fr: Moto, nl: Motor, en: Two-wheeler}
          y: ["{carKmDay2019}", "{busKmDay2019}", "{railKmDay2019}",
              "{tramKmDay2019}", "{motoKmDay2019}"]
          caption:
            fr: Kilomètres motorisés par personne et par jour en Belgique, par mode, 2019
            nl: Gemotoriseerde kilometers per persoon per dag in België, per modus, 2019
            en: Motorised kilometres per person per day in Belgium, by mode, 2019
      - kind: benchmark
        text:
          fr: >
            Une revue de la littérature (Peeters et al., 2026) situe une mobilité terrestre
            soutenable entre {peetersMinKmDay} et {peetersMaxKmDay} km par personne et par
            jour — la valeur belge de 2019 se situe dans le haut de cette fourchette. Les
            auteurs insistent sur l'absence de consensus.
          nl: >
            Een literatuurstudie (Peeters et al., 2026) plaatst duurzame landmobiliteit
            tussen {peetersMinKmDay} en {peetersMaxKmDay} km per persoon per dag — de
            Belgische waarde van 2019 zit in de bovenste helft van die vork. De auteurs
            benadrukken het gebrek aan consensus.
          en: >
            A literature review (Peeters et al., 2026) puts sustainable ground mobility
            between {peetersMinKmDay} and {peetersMaxKmDay} km per person per day — Belgium's
            2019 value sits in the upper part of that range. The authors stress the lack of
            consensus.
        source: "Peeters et al. (2026), Energy Research & Social Science"
        url: https://doi.org/10.1016/j.erss.2026.104580
      - kind: benchmark
        text:
          fr: >
            Sur la même définition — sol motorisé, trajets intérieurs — un Japonais parcourt
            *29,4 km par jour* et un Américain *62,5*, soit près du double d'un Belge. À l'autre
            bout, la moyenne mondiale tourne autour de 22 km/jour et l'Afrique subsaharienne
            autour de 6, mais ces deux derniers chiffres comptent *tous* les modes, avion et
            marche compris, et ne sont donc pas strictement comparables.
          nl: >
            Op dezelfde definitie — gemotoriseerd over land, binnenlandse verplaatsingen — legt
            een Japanner *29,4 km per dag* af en een Amerikaan *62,5*, bijna het dubbele van een
            Belg. Aan de andere kant ligt het wereldgemiddelde rond 22 km/dag en
            Sub-Saharaans Afrika rond 6, maar die laatste twee tellen *alle* modi mee, vliegtuig
            en wandelen inbegrepen, en zijn dus niet strikt vergelijkbaar.
          en: >
            On the same definition — motorised ground travel, domestic trips — a Japanese
            resident covers *29.4 km a day* and an American *62.5*, nearly twice a Belgian. At
            the other end, the world average is about 22 km/day and Sub-Saharan Africa about 6,
            but those last two count *every* mode, aviation and walking included, so they are
            not strictly comparable.
        source: "MLIT via ITPS Japan (FY2018) ; FHWA Highway Statistics 2023, table VM-1 ; ITF Transport Outlook 2023, fig. 2.2 (monde, tous modes)"
        url: https://www.fhwa.dot.gov/policyinformation/statistics/2023/vm1.cfm
        chart:
          kind: bars
          unit: km/person/day
          decimals: 1
          highlight: 3
          labels:
            - {fr: Afrique subsah., nl: Sub-Sah. Afrika, en: Sub-Sah. Africa}
            - {fr: Monde, nl: Wereld, en: World}
            - {fr: Japon, nl: Japan, en: Japan}
            - {fr: Belgique, nl: België, en: Belgium}
            - {fr: États-Unis, nl: Verenigde Staten, en: United States}
          y: [5.7, 21.7, 29.4, "{refValue}", 62.5]
          caption:
            fr: >
              Distance motorisée par personne et par jour. Belgique et Japon : sol motorisé
              intérieur ; États-Unis : route intérieure ; monde et Afrique : tous modes
            nl: >
              Gemotoriseerde afstand per persoon per dag. België en Japan: binnenlands over
              land; Verenigde Staten: binnenlandse weg; wereld en Afrika: alle modi
            en: >
              Motorised distance per person per day. Belgium and Japan: domestic ground;
              United States: domestic road; world and Africa: all modes
    justification:
      fr: >
        négaWatt retient {targetValue} km/jour. La mobilité motorisée terrestre ne baisse que de
        {changePct:abs} % : le télétravail, un habitat plus urbain, des vacances plus proches, le
        vieillissement de la population et le renchérissement des transports pèsent dans ce sens,
        et le Bureau fédéral du Plan projette une intensité à peu près stable à politique
        inchangée. Le gros de la réduction de {totalIntensityChangePct:abs} % de la mobilité
        totale est obtenu sur l'avion (−{aviationChangePct:abs} % par personne), pas sur les
        trajets quotidiens. Tous modes terrestres compris, le scénario aboutit à environ
        12 650 pkm par personne et par an — près du haut de la fourchette de Peeters et al.
      nl: >
        negaWatt kiest {targetValue} km/dag. De gemotoriseerde landmobiliteit daalt met slechts
        {changePct:abs} %: telewerk, meer stedelijk wonen, vakanties dichter bij huis, de
        vergrijzing en duurdere mobiliteit werken in die richting, en het Federaal Planbureau
        verwacht bij ongewijzigd beleid een ongeveer stabiele intensiteit. Het grootste deel van
        de daling van {totalIntensityChangePct:abs} % in de totale mobiliteit komt van de
        luchtvaart (−{aviationChangePct:abs} % per persoon), niet van de dagelijkse
        verplaatsingen. Alle landmodi samen komt het scenario uit op ongeveer 12.650 pkm per
        persoon per jaar — dicht bij de bovengrens van Peeters et al.
      en: >
        negaWatt settles on {targetValue} km/day. Motorised ground travel falls by only
        {changePct:abs}%: teleworking, more urban housing, closer holidays, an ageing population
        and higher transport costs all push that way, and the Federal Planning Bureau projects a
        roughly flat intensity under unchanged policy. Most of the
        {totalIntensityChangePct:abs}% cut in total mobility is taken on aviation
        (−{aviationChangePct:abs}% per person), not on daily travel. Across all ground modes the
        scenario lands at about 12,650 pkm per person per year — near the top of the range in
        Peeters et al.
    debate:
      fr: >
        La revue du scénario reproche à ce −10 % d'être un chiffre rond appliqué à l'identique à
        quatre secteurs différents, et de renverser trente ans de tendance sans qu'aucune
        politique précise ne soit chiffrée.
      nl: >
        De review van het scenario verwijt deze −10 % een rond getal te zijn dat identiek op vier
        verschillende sectoren wordt toegepast, en dertig jaar trend om te buigen zonder dat één
        concreet beleid becijferd wordt.
      en: >
        The scenario's peer review objects that this −10% is a round number applied identically
        to four different sectors, and that it reverses a thirty-year trend without any specific
        policy being quantified.

  car-share:
    short:
      fr: Part de la voiture
      nl: Aandeel van de auto
      en: Car share
    question:
      fr: "Quelle part de la voiture dans les kilomètres motorisés est un objectif 2050 réaliste ?"
      nl: "Welk aandeel van de auto in de gemotoriseerde kilometers is een realistisch doel voor 2050?"
      en: "What car share of motorised kilometres is a realistic 2050 objective?"
    subtitle:
      fr: Le reste se répartit entre bus, tram, métro, train et deux-roues.
      nl: De rest verdeelt zich over bus, tram, metro, trein en tweewielers.
      en: The rest is shared between buses, trams, metro, trains and two-wheelers.
    tangible:
      fr: "{value} % en voiture — le reste par les transports publics et les deux-roues."
      nl: "{value} % met de auto — de rest met openbaar vervoer en tweewielers."
      en: "{value}% by car — the rest by public transport and two-wheelers."
    facts:
      - kind: trend
        text:
          fr: >
            Presque immobile depuis vingt ans : 81,4 % en 2000, {refValue} % en 2019,
            78,5 % en 2023. Le pic de 83 % en 2021 était un effet Covid — on a fui les
            transports publics.
          nl: >
            Al twintig jaar bijna onveranderd: 81,4 % in 2000, {refValue} % in 2019,
            78,5 % in 2023. De piek van 83 % in 2021 was een covid-effect — men meed het
            openbaar vervoer.
          en: >
            Almost motionless for twenty years: 81.4% in 2000, {refValue}% in 2019, 78.5% in
            2023. The 83% spike in 2021 was a Covid effect — people avoided public transport.
        source: JRC-IDEES-2023, population Statbel
        url: https://joint-research-centre.ec.europa.eu/potencia/jrc-idees_en
      - kind: caution
        text:
          fr: >
            Attention au raccourci : ce sont les Pays-Bas qui affichent la *plus forte* part de
            la voiture (85,3 % en 2023), parce que les kilomètres à vélo ne comptent pas dans
            cet indicateur. Rouler beaucoup à vélo ne suffit pas à faire baisser cette part.
          nl: >
            Pas op met de conclusie: Nederland heeft juist het *hoogste* autoaandeel (85,3 % in
            2023), omdat fietskilometers niet in deze indicator meetellen. Veel fietsen alleen
            verlaagt dit aandeel niet.
          en: >
            Careful with the shortcut: the Netherlands has the *highest* car share of all
            (85.3% in 2023), because cycling kilometres are not counted in this indicator.
            Cycling a lot is not by itself enough to bring this share down.
        source: "Eurostat, tran_hv_psmod"
        url: https://ec.europa.eu/eurostat/databrowser/view/tran_hv_psmod/default/table?lang=en
      - kind: benchmark
        text:
          fr: >
            La Suisse est le pays le moins dépendant de la voiture d'Europe occidentale :
            72,5 % des voyageurs-kilomètres en voiture et 21,2 % en train (2023), contre
            80,4 % et 9,4 % en Belgique.
          nl: >
            Zwitserland is het minst autoafhankelijke land van West-Europa: 72,5 % van de
            reizigerskilometers met de auto en 21,2 % met de trein (2023), tegenover 80,4 %
            en 9,4 % in België.
          en: >
            Switzerland is western Europe's least car-dependent country: 72.5% of
            passenger-kilometres by car and 21.2% by train (2023), against 80.4% and 9.4% in
            Belgium.
        source: "Eurostat, tran_hv_psmod"
        url: https://ec.europa.eu/eurostat/databrowser/view/tran_hv_psmod/default/table?lang=en
      - kind: structure
        reveal: true
        text:
          fr: >
            négaWatt déplace {shiftPct} % des kilomètres-voiture : {toBusPct} points vers le
            bus, {toRailPct} vers le train, {toBikePct} vers le vélo, le reste vers tram,
            métro, deux-roues et marche.
          nl: >
            negaWatt verschuift {shiftPct} % van de autokilometers: {toBusPct} punten naar de
            bus, {toRailPct} naar de trein, {toBikePct} naar de fiets, de rest naar tram,
            metro, tweewielers en wandelen.
          en: >
            negaWatt moves {shiftPct}% of car-kilometres away: {toBusPct} points to buses,
            {toRailPct} to trains, {toBikePct} to cycling, the rest to trams, metro,
            two-wheelers and walking.
        source: nW-BE §2.1.2
      - kind: structure
        text:
          fr: >
            Avoir une voiture est d'abord une question de revenu. À Bruxelles, *26 %* des ménages
            gagnant moins de 2 000 € net par mois possèdent une voiture, contre *91 %* de ceux
            qui dépassent 10 000 € ; deux voitures ou plus, c'est 2 % contre environ la moitié.
            À l'échelle du pays, 22,7 % des Belges sous le seuil de pauvreté déclarent ne pas
            pouvoir s'offrir de voiture, contre 3,6 % au-dessus.
          nl: >
            Een auto hebben is in de eerste plaats een kwestie van inkomen. In Brussel heeft
            *26 %* van de huishoudens met minder dan 2.000 € netto per maand een auto, tegenover
            *91 %* van wie boven 10.000 € zit; twee auto's of meer is 2 % tegenover ongeveer de
            helft. Landelijk zegt 22,7 % van de Belgen onder de armoedegrens zich geen auto te
            kunnen veroorloven, tegenover 3,6 % erboven.
          en: >
            Owning a car is first of all a question of income. In Brussels, *26%* of households
            earning under €2,000 net a month have a car, against *91%* of those above €10,000;
            for two cars or more it is 2% against roughly half. Nationally, 22.7% of Belgians
            below the poverty line say they cannot afford a car, against 3.6% above it.
        source: "Observatoire de la mobilité de Bruxelles-Capitale (2022) ; Eurostat ilc_mddu05 (2025)"
        url: https://be.brussels/fr/transport-mobilite/enjeux-de-la-mobilite/observatoire-thematique/automobile/equipements-automobiles-des-menages
      - kind: structure
        text:
          fr: >
            La géographie pèse autant que le revenu. En 2025, un habitant de la Wallonie rurale
            parcourt *25,8 km par jour en voiture*, un Bruxellois *7,8* — trois fois moins. La
            voiture assure 86,7 % des distances en Wallonie rurale contre 52,3 % à Bruxelles.
            Là où l'offre de transport public est faible, 5 % seulement des ménages se passent
            de voiture ; là où elle est bonne, 37 %. Sans desserte rurale, cet indicateur ne
            bouge pas.
          nl: >
            Geografie weegt even zwaar als inkomen. In 2025 legt een inwoner van landelijk
            Wallonië *25,8 km per dag met de auto* af, een Brusselaar *7,8* — drie keer minder.
            De auto zorgt voor 86,7 % van de afstanden in landelijk Wallonië tegenover 52,3 % in
            Brussel. Waar het openbaarvervoeraanbod zwak is, doet slechts 5 % van de huishoudens
            het zonder auto; waar het goed is, 37 %. Zonder plattelandsbediening beweegt deze
            indicator niet.
          en: >
            Geography weighs as much as income. In 2025 someone living in rural Wallonia covers
            *25.8 km a day by car*, a Brussels resident *7.8* — three times less. The car carries
            86.7% of distance travelled in rural Wallonia against 52.3% in Brussels. Where public
            transport supply is poor, only 5% of households manage without a car; where it is
            good, 37%. Without rural service, this indicator does not move.
        source: "SPF Mobilité, Enquête fédérale sur la mobilité 2025 ; Bureau fédéral du Plan, WP 02-25"
        url: https://mobilit.belgium.be/sites/default/files/documents/publications/2026/EFM2025_update.pdf
        chart:
          kind: bars
          unit: km/person/day
          decimals: 1
          highlight: 3
          labels:
            - {fr: Bruxelles, nl: Brussel, en: Brussels}
            - {fr: Villes, nl: Steden, en: Cities}
            - {fr: Hors villes, nl: Buiten steden, en: Outside cities}
            - {fr: Wallonie rurale, nl: Landelijk Wallonië, en: Rural Wallonia}
          y: [7.8, 10.7, 21.8, 25.8]
          caption:
            fr: Kilomètres parcourus en voiture par personne et par jour, 2025
            nl: Autokilometers per persoon per dag, 2025
            en: Car kilometres per person per day, 2025
      - kind: trend
        text:
          fr: >
            La Belgique a déjà eu un réseau rural dense, et l'a démantelé. Les *tramways
            vicinaux* culminaient à environ *4 800 km de lignes en 1945* — davantage que les
            3 619 km du réseau ferré actuel — et desservaient les villages. Il n'en restait
            978 km en 1960 ; les dernières lignes ont fermé en 1978. Seul le tram côtier,
            67 km, a survécu.
          nl: >
            België had ooit een dicht plattelandsnet en heeft het afgebroken. De
            *buurtspoorwegen* piekten rond *4.800 km lijnen in 1945* — meer dan de 3.619 km
            van het huidige spoornet — en bedienden de dorpen. In 1960 restte er 978 km; de
            laatste lijnen sloten in 1978. Alleen de Kusttram, 67 km, overleefde.
          en: >
            Belgium once had a dense rural network and dismantled it. The *vicinal tramways*
            peaked at about *4,800 km of line in 1945* — more than today's 3,619 km railway —
            and served the villages. Only 978 km were left by 1960; the last lines closed in
            1978. The 67 km Coast Tram is the sole survivor.
        source: "VlaTAM (Vlaams Tram- en Autobusmuseum) ; Science Museum Group, SNCV ; Infrabel (3 619 km, 2023)"
        url: https://www.vlatam.be/buurtspoorwegen/
      - kind: tangible
        text:
          fr: >
            Le train transporte aujourd'hui environ 9 % des voyageurs-kilomètres belges. Faire
            reculer nettement la voiture suppose d'augmenter l'offre par habitant alors que la
            population croît de 10 % d'ici 2050. Vision Rail 2040 vise
            {railShareTarget2040} % de part modale pour le rail.
          nl: >
            De trein vervoert vandaag ongeveer 9 % van de Belgische reizigerskilometers. De auto
            duidelijk terugdringen vraagt meer aanbod per inwoner, terwijl de bevolking tot 2050
            met 10 % groeit. Vision Rail 2040 mikt op {railShareTarget2040} % modaal aandeel voor
            het spoor.
          en: >
            Rail carries about 9% of Belgian passenger-kilometres today. Pushing the car back
            substantially means more service per inhabitant while the population grows 10% by
            2050. Vision Rail 2040 targets a {railShareTarget2040}% rail modal share.
        source: nW-BE §2.1.3, Vision Rail 2040
    justification:
      fr: >
        négaWatt retient {targetValue} %. C'est la pièce maîtresse du volet voyageurs :
        {shiftPct} % des kilomètres-voiture sont repris par d'autres modes, en supposant un
        investissement massif dans le rail, le bus et le vélo. La voiture reste néanmoins le
        premier mode.
      nl: >
        negaWatt kiest {targetValue} %. Dit is het hart van het personenvervoerluik:
        {shiftPct} % van de autokilometers wordt door andere modi overgenomen, met een
        massale investering in spoor, bus en fiets. De auto blijft toch de belangrijkste modus.
      en: >
        negaWatt settles on {targetValue}%. This is the centrepiece of the passenger
        scenario: {shiftPct}% of car-kilometres are taken over by other modes, assuming
        massive investment in rail, buses and cycling. The car still remains the leading mode.
    debate:
      fr: >
        Aucun pays de l'UE n'a réalisé un report modal de cette ampleur en trente ans sans un
        investissement transformateur. Les auteurs signalent eux-mêmes que le triplement du
        tram et du métro est « probablement trop élevé ».
      nl: >
        Geen enkel EU-land heeft in dertig jaar een modale verschuiving van deze omvang
        gerealiseerd zonder transformerende investeringen. De auteurs geven zelf aan dat de
        verdrievoudiging van tram en metro "waarschijnlijk te hoog" is.
      en: >
        No EU country has achieved a modal shift of this magnitude within thirty years without
        transformative investment. The authors themselves flag the tripling of tram and metro
        use as "likely too high".

  # ------------------------------------------------------------ 3 -------------
  car-occupancy:
    short:
      fr: Occupation des voitures
      nl: Autobezetting
      en: Car occupancy
    question:
      fr: "Quel taux d'occupation des voitures est un objectif 2050 réaliste ?"
      nl: "Welke autobezetting is een realistisch doel voor 2050?"
      en: "What car occupancy is a realistic 2050 objective?"
    subtitle:
      fr: "Moyenne sur tous les trajets : voyageurs-kilomètres divisés par kilomètres-voiture."
      nl: "Gemiddelde over alle ritten: reizigerskilometers gedeeld door autokilometers."
      en: "Averaged over all trips: passenger-kilometres divided by car-kilometres."
    tangible:
      fr: "{value} personne par voiture en moyenne, sur tous les trajets confondus."
      nl: "{value} personen per auto, gemiddeld over alle ritten samen."
      en: "{value} people per car, averaged over every trip."
    facts:
      - kind: trend
        text:
          fr: >
            Immobile depuis des décennies. En Europe de l'Ouest, ce chiffre est resté entre 1,2
            et 1,5 pendant trente ans malgré de nombreuses initiatives de covoiturage. En
            Angleterre il vaut 1,6 chaque année de 2002 à 2019 sans bouger d'un dixième ; en
            France il est « quasi stable entre 2008 et 2019 », après une baisse de 9 % entre
            1994 et 2008 — et 3 % seulement des passagers déclarent avoir covoituré.
          nl: >
            Al decennia onveranderd. In West-Europa bleef dit cijfer dertig jaar lang tussen 1,2
            en 1,5, ondanks talrijke carpoolinitiatieven. In Engeland is het elk jaar van 2002
            tot 2019 exact 1,6; in Frankrijk is het "quasi stabiel tussen 2008 en 2019", na een
            daling van 9 % tussen 1994 en 2008 — en amper 3 % van de passagiers zegt gecarpoold
            te hebben.
          en: >
            Motionless for decades. In western Europe the figure stayed between 1.2 and 1.5 for
            thirty years despite many carpooling initiatives. In England it reads 1.6 every
            single year from 2002 to 2019 without moving a decimal; in France it is "almost
            stable between 2008 and 2019", after a 9% fall between 1994 and 2008 — and just 3%
            of car passengers say they have carpooled.
        source: "Revue critique du modèle nW-BE §6.1 ; DfT National Travel Survey NTS0905a ; SDES, Enquête mobilité des personnes 2018-2019"
        url: https://www.gov.uk/government/statistical-data-sets/nts09-vehicle-mileage-and-occupancy
      - kind: benchmark
        text:
          fr: >
            1,2 n'est pas un plafond physique : la Roumanie affiche *1,87* personne par voiture
            et la Lettonie *1,74*, contre 1,28 pour la Belgique et 1,17 pour l'Italie. Mais le
            moteur n'est pas le covoiturage — c'est la *rareté de la voiture*. La Lettonie
            compte 381 voitures pour 1 000 habitants contre 510 en Belgique, pour une taille de
            ménage identique : quand une famille n'a qu'une voiture, elle y monte ensemble.
            L'Italie, championne d'Europe du taux d'équipement, est bonne dernière.
          nl: >
            1,2 is geen fysiek plafond: Roemenië haalt *1,87* personen per auto en Letland
            *1,74*, tegenover 1,28 voor België en 1,17 voor Italië. Maar de motor is niet
            carpoolen — het is de *schaarste aan auto's*. Letland telt 381 auto's per 1.000
            inwoners tegen 510 in België, bij een identieke gezinsgrootte: heeft een gezin maar
            één auto, dan stapt het samen in. Italië, Europees kampioen autobezit, staat laatst.
          en: >
            1.2 is no physical ceiling: Romania reaches *1.87* people per car and Latvia *1.74*,
            against 1.28 for Belgium and 1.17 for Italy. But the driver is not carpooling — it
            is *car scarcity*. Latvia has 381 cars per 1,000 inhabitants against Belgium's 510,
            at an identical household size: when a family owns one car, it travels in it
            together. Italy, Europe's most car-equipped country, comes last.
        source: "Eurostat, Passenger mobility statistics (fig. 3, mobilité urbaine, pkm/vkm, enquêtes 2015-2019) ; Eurostat road_eqs_carhab (2019)"
        url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Passenger_mobility_statistics
        chart:
          kind: bars
          unit: persons/car
          decimals: 2
          highlight: 1
          labels:
            - {fr: Italie, nl: Italië, en: Italy}
            - {fr: Belgique, nl: België, en: Belgium}
            - {fr: Danemark, nl: Denemarken, en: Denmark}
            - {fr: Lettonie, nl: Letland, en: Latvia}
            - {fr: Roumanie, nl: Roemenië, en: Romania}
          y: [1.17, 1.28, 1.35, 1.74, 1.87]
          caption:
            fr: >
              Occupation moyenne des voitures, mobilité urbaine, enquêtes 2015-2019 — base
              différente de celle de la question, qui porte sur tous les trajets
            nl: >
              Gemiddelde autobezetting, stedelijke mobiliteit, enquêtes 2015-2019 — andere
              basis dan de vraag hierboven, die over alle ritten gaat
            en: >
              Average car occupancy, urban mobility, 2015-2019 surveys — a different basis
              from the question above, which covers every trip
      - kind: structure
        reveal: true
        text:
          fr: >
            C'est le levier le plus puissant de cet atelier. L'énergie des voitures en 2050
            vaut {carTwhTarget} TWh à 2,0 personnes par voiture ; à 1,5 elle serait de
            9,3 TWh, soit un tiers de plus.
          nl: >
            Dit is de krachtigste hefboom van deze workshop. De auto-energie in 2050 bedraagt
            {carTwhTarget} TWh bij 2,0 personen per auto; bij 1,5 zou dat 9,3 TWh zijn, een
            derde meer.
          en: >
            This is the most powerful lever in the workshop. Car energy in 2050 is
            {carTwhTarget} TWh at 2.0 people per car; at 1.5 it would be 9.3 TWh, a third more.
        source: nW-BE §2.3.5, computed from the scenario
      - kind: caution
        text:
          fr: >
            Les sources ne s'accordent pas. JRC-IDEES donne {occupancyIdees} pour 2019, les
            enquêtes fédérales {occupancySurvey:d2}, et certains indicateurs belges approchent 1,8
            sur une base différente (par trajet plutôt que par kilomètre). Cette question porte
            sur la première définition.
          nl: >
            De bronnen spreken elkaar tegen. JRC-IDEES geeft {occupancyIdees} voor 2019, de
            federale enquêtes {occupancySurvey:d2}, en sommige Belgische indicatoren komen op bijna
            1,8 uit op een andere basis (per rit in plaats van per kilometer). Deze vraag gaat
            over de eerste definitie.
          en: >
            The sources disagree. JRC-IDEES gives {occupancyIdees} for 2019, the federal travel
            surveys {occupancySurvey:d2}, and some Belgian indicators approach 1.8 on a different
            basis (per trip rather than per kilometre). This question is about the first
            definition.
        source: nW-BE §2.1; CE monitor
        url: https://cemonitor.be/en/indicator/mobility/market/car-use-efficiency/
      - kind: tangible
        reveal: true
        text:
          fr: >
            2,0 signifie que le trajet moyen — trajet domicile-travail, école, courses,
            vacances — transporte toujours un passager. C'est sur les trajets domicile-travail,
            qui font l'essentiel du trafic de semaine, que le taux est le plus bas.
          nl: >
            2,0 betekent dat de gemiddelde rit — woon-werk, school, boodschappen, vakantie —
            altijd een passagier vervoert. Juist bij woon-werkverkeer, het gros van het
            weekdagverkeer, is de bezetting het laagst.
          en: >
            2.0 means the average trip — commute, school run, shopping, holiday — always
            carries a passenger. Commuting, which is the bulk of weekday traffic, is where
            occupancy is lowest.
        source: nW-BE, calcul 2050
    historyAbsent: true
    historyNote:
      fr: Aucune série historique d'occupation des voitures n'existe dans les données du projet ; seul le point de 2019 est connu.
      nl: Er bestaat geen historische reeks van autobezetting in de projectdata; alleen het punt van 2019 is bekend.
      en: No historical car-occupancy series exists in the project's data; only the 2019 point is known.
    justification:
      fr: >
        négaWatt retient {targetValue} personnes par voiture, contre {refValue} en 2019
        (+{gainPct} %), grâce au covoiturage. Cette seule hypothèse fait passer l'énergie des
        voitures de {carTwh2019} TWh en 2019 à {carTwhTarget} TWh en 2050, avec le report modal
        et l'électrification.
      nl: >
        negaWatt kiest {targetValue} personen per auto, tegenover {refValue} in 2019
        (+{gainPct} %), dankzij carpoolen. Deze ene veronderstelling brengt de auto-energie van
        {carTwh2019} TWh in 2019 naar {carTwhTarget} TWh in 2050, samen met de modale
        verschuiving en de elektrificatie.
      en: >
        negaWatt settles on {targetValue} people per car, against {refValue} in 2019
        (+{gainPct}%), through carpooling. This assumption alone helps take car energy from
        {carTwh2019} TWh in 2019 to {carTwhTarget} TWh in 2050, together with the modal shift
        and electrification.
    debate:
      fr: >
        La revue qualifie cette hypothèse de « la plus déterminante et la moins étayée de tout
        le modèle » : aucun pays n'a durablement dépassé 1,6 par la seule politique publique, et
        la ramener à 1,5 augmenterait d'un tiers la consommation des voitures.
      nl: >
        De review noemt dit "de meest bepalende en minst onderbouwde veronderstelling van het
        hele model": geen enkel land is via beleid duurzaam boven 1,6 gekomen, en een verlaging
        naar 1,5 zou het autoverbruik met een derde verhogen.
      en: >
        The review calls this "the single most impactful and least supported assumption in the
        entire model": no country has sustained a value above 1.6 through policy alone, and
        relaxing it to 1.5 would raise car energy demand by a third.

  # ------------------------------------------------------------ 4 -------------
  car-energy:
    short:
      fr: Consommation par km
      nl: Verbruik per km
      en: Energy use per km
    question:
      fr: "Jusqu'où la consommation de la voiture moyenne peut-elle descendre en 2050, par rapport à 2019 ?"
      nl: "Tot hoever kan het verbruik van de gemiddelde auto in 2050 zakken, vergeleken met 2019?"
      en: "How far can the average car's energy use per kilometre come down by 2050, against 2019?"
    subtitle:
      fr: >
        L'énergie qu'il faut dépenser pour déplacer le véhicule lui-même : vitesse, masse,
        aérodynamique, conduite. Le passage du thermique à l'électrique, qui pèse bien plus
        lourd encore sur la consommation, est compté séparément.
      nl: >
        De energie die nodig is om het voertuig zelf te verplaatsen: snelheid, massa,
        aerodynamica, rijstijl. De overstap van brandstof naar elektrisch, die nog veel zwaarder
        doorweegt, wordt apart geteld.
      en: >
        The energy it takes to move the vehicle itself: speed, mass, aerodynamics, driving
        style. The switch from combustion to electric, which weighs far more heavily on
        consumption still, is counted separately.
    tangible:
      fr: "{value} % de la consommation de 2019, à motorisation équivalente."
      nl: "{value} % van het verbruik in 2019, bij gelijke motorisering."
      en: "{value}% of the 2019 figure, for an equivalent powertrain."
    facts:
      - kind: structure
        text:
          fr: >
            Un seul chiffre pour trois leviers : abaissement des vitesses, éco-conduite, et
            voitures plus petites et plus légères. Rien d'autre — le rendement de la
            motorisation est compté à part. Le carnet de calcul signale lui-même que la
            répartition entre les trois n'est pas quantifiée ; les trois fiches suivantes en
            donnent l'ordre de grandeur, séparément.
          nl: >
            Eén cijfer voor drie hefbomen: lagere snelheden, ecodriving, en kleinere en lichtere
            auto's. Niets anders — het rendement van de aandrijflijn wordt apart geteld. Het
            rekenboek geeft zelf aan dat de verdeling over de drie niet becijferd is; de drie
            volgende fiches geven de grootteorde van elk afzonderlijk.
          en: >
            One figure for three levers: lower speeds, eco-driving, and smaller, lighter cars.
            Nothing else — powertrain efficiency is counted separately. The notebook itself
            flags that the split between the three is not quantified; the next three cards give
            the order of magnitude of each, separately.
        source: nW-BE §2.3.5
      - kind: lever
        text:
          fr: >
            *La vitesse.* Sur autoroute, la vitesse moyenne réelle est aujourd'hui de
            102 à 105 km/h aux Pays-Bas. Ramener la limite à 90 km/h y réduit l'énergie des
            voitures et camionnettes de *4 à 10 % par kilomètre parcouru* ; à 80 km/h, de
            6 à 14 %. L'estimation est prudente : elle ne compte pas le gain d'une conduite
            moins nerveuse.
          nl: >
            *De snelheid.* Op de snelweg ligt de werkelijke gemiddelde snelheid in Nederland
            vandaag op 102 tot 105 km/u. De limiet naar 90 km/u brengen verlaagt het
            energiegebruik van auto's en bestelwagens er met *4 tot 10 % per afgelegde
            kilometer*; naar 80 km/u met 6 tot 14 %. De schatting is voorzichtig: de winst van
            rustiger rijden zit er niet in.
          en: >
            *Speed.* Real average motorway speed in the Netherlands is 102 to 105 km/h today.
            Bringing the limit down to 90 km/h cuts the energy use of cars and vans there by
            *4 to 10% per kilometre driven*; to 80 km/h, by 6 to 14%. The estimate is
            deliberately conservative: it leaves out the gain from less stop-start driving.
        source: "KiM (Kennisinstituut voor Mobiliteitsbeleid), Effect op energiegebruik van maximumsnelheid 90 en 80 km/u op snelwegen, 2023, §3.3"
        url: https://www.kimnet.nl/site/binaries/site-content/collections/documents/2023/07/17/effect-op-energiegebruik-van-maximumsnelheid-90-en-80-km-u-op-snelwegen/Notitie_KiM_snelheid-energie_Def2.pdf
      - kind: lever
        text:
          fr: >
            *L'éco-conduite.* Le style de conduite fait varier la consommation d'une thermique
            de 15 à 25 %. Mais l'effet d'une formation *s'érode* : mesuré en ville, il retombe
            de 4,6 % à 2,5 % en dix mois, et devient statistiquement indétectable sur autoroute
            après trente semaines. Ce qui tient dans la durée, c'est l'assistance embarquée en
            permanence : *5 à 10 %*.
          nl: >
            *Ecodriving.* De rijstijl laat het verbruik van een brandstofauto met 15 tot 25 %
            variëren. Maar het effect van een opleiding *slijt*: in de stad gemeten zakt het in
            tien maanden van 4,6 % naar 2,5 %, en op de snelweg is het na dertig weken
            statistisch niet meer meetbaar. Wat wél blijft, is permanente hulp aan boord:
            *5 tot 10 %*.
          en: >
            *Eco-driving.* Driving style alone swings a combustion car's fuel use by 15 to 25%.
            But the effect of a training course *decays*: measured in town it falls from 4.6% to
            2.5% within ten months, and on the motorway it becomes statistically undetectable
            after thirty weeks. What lasts is permanent in-car assistance: *5 to 10%*.
        source: "Xu, Li, Liu & Zhao, An Overview of Eco-Driving Theory, Capability Evaluation and Training Applications, Sensors, 2021"
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8512309/
      - kind: lever
        text:
          fr: >
            *La taille et le poids.* Alléger une voiture de 10 % réduit sa consommation de
            *6 à 7 %* si le moteur est redimensionné en conséquence, de 4 à 5 % sinon — soit
            environ 3 à 5 % pour 100 kg sur une voiture de 1 400 kg. Un SUV pèse 200 à 300 kg
            de plus qu'une berline moyenne et émet de l'ordre de 20 % de CO₂ en plus.
          nl: >
            *Grootte en gewicht.* Een auto 10 % lichter maken verlaagt het verbruik met
            *6 tot 7 %* als de motor navenant kleiner wordt, en met 4 tot 5 % zo niet — dus
            ongeveer 3 tot 5 % per 100 kg op een auto van 1.400 kg. Een SUV weegt 200 tot 300 kg
            meer dan een gemiddelde middenklasser en stoot zo'n 20 % meer CO₂ uit.
          en: >
            *Size and weight.* Taking 10% off a car's mass cuts its fuel use by *6 to 7%* if the
            engine is downsized to match, and by 4 to 5% if it is not — so roughly 3 to 5% per
            100 kg on a 1,400 kg car. An SUV weighs 200 to 300 kg more than an average
            medium-sized car and emits on the order of 20% more CO₂.
        source: "ICCT, Lightweighting technology developments, 2017, p. 2 ; AIE, SUVs are setting new sales records each year, 2024"
        url: https://theicct.org/sites/default/files/publications/PV-Lightweighting_Tech-Briefing_ICCT_07032017_0.pdf
      - kind: trend
        text:
          fr: >
            La tendance va exactement dans l'autre sens. La masse moyenne d'une voiture neuve
            dans l'UE est passée d'environ 1 275 kg en 2001 à *1 518 kg en 2022*, soit +19 %.
            La largeur suit : 170,5 cm en 2001, 180,2 cm en 2020 — *un centimètre de plus tous
            les deux ans*. En Belgique, les SUV sont le premier segment des immatriculations
            neuves depuis 2017 : 42 % en 2020, 47,2 % au premier semestre 2021.
          nl: >
            De trend gaat precies de andere kant op. De gemiddelde massa van een nieuwe auto in
            de EU steeg van ongeveer 1.275 kg in 2001 naar *1.518 kg in 2022*, oftewel +19 %. De
            breedte volgt: 170,5 cm in 2001, 180,2 cm in 2020 — *een centimeter meer om de twee
            jaar*. In België zijn SUV's sinds 2017 het grootste segment van de nieuwe
            inschrijvingen: 42 % in 2020, 47,2 % in de eerste helft van 2021.
          en: >
            The trend runs exactly the other way. The average mass of a new car in the EU went
            from about 1,275 kg in 2001 to *1,518 kg in 2022*, up 19%. Width follows: 170.5 cm
            in 2001, 180.2 cm in 2020 — *one centimetre wider every two years*. In Belgium SUVs
            have been the largest new-registration segment since 2017: 42% in 2020, 47.2% in the
            first half of 2021.
        source: "ICCT, European Vehicle Market Statistics Pocketbook 2023/24, p. 6 ; Transport & Environment (2024) ; Vias institute, Les SUV et la sécurité routière, 2022, p. 3 (FEBIAC)"
        url: https://theicct.org/wp-content/uploads/2024/01/Pocketbook_202324_Web.pdf
      - kind: tangible
        reveal: true
        text:
          fr: >
            −{reductionPct} % appliqués à une électrique de 2019 donneraient environ 0,16 kWh/km
            au lieu de {kwhPerKmBev2019}.
          nl: >
            −{reductionPct} % toegepast op een elektrische auto van 2019 geeft ongeveer
            0,16 kWh/km in plaats van {kwhPerKmBev2019}.
          en: >
            −{reductionPct}% applied to a 2019 electric car would give about 0.16 kWh/km instead
            of {kwhPerKmBev2019}.
        source: nW-BE, calcul 2050
    historyAbsent: true
    historyNote:
      fr: L'intensité énergétique des voitures n'est pas disponible en série historique dans les données du projet.
      nl: De energie-intensiteit van auto's is niet als historische reeks beschikbaar in de projectdata.
      en: Car energy intensity is not available as a historical series in the project's data.
    justification:
      fr: >
        négaWatt retient {targetValue} % de la consommation de 2019, soit −{reductionPct} %, en
        additionnant vitesses réduites, éco-conduite et véhicules plus petits et plus légers. Le
        gain propre à la motorisation — passage à l'électrique, freinage récupératif — n'est pas
        dans ce chiffre : il est porté par la composition du parc.
      nl: >
        negaWatt kiest {targetValue} % van het verbruik van 2019, dus −{reductionPct} %, door
        lagere snelheden, ecodriving en kleinere, lichtere voertuigen samen te nemen. De winst
        van de aandrijflijn zelf — overstap naar elektrisch, remenergierecuperatie — zit niet in
        dit cijfer: die zit in de samenstelling van het wagenpark.
      en: >
        negaWatt settles on {targetValue}% of the 2019 figure, i.e. −{reductionPct}%, adding
        together lower speeds, eco-driving and smaller, lighter vehicles. The gain from the
        powertrain itself — the switch to electric, regenerative braking — is not in this
        figure: it is carried by the composition of the fleet.
    debate:
      fr: >
        Les effets ne sont pas décomposés, ce que les auteurs reconnaissent. Et le modèle ne
        contient aucun effet rebond : rouler moins cher, c'est souvent rouler plus.
      nl: >
        De effecten worden niet uitgesplitst, wat de auteurs zelf toegeven. En het model bevat
        geen enkel reboundeffect: goedkoper rijden betekent vaak meer rijden.
      en: >
        The effects are not disaggregated, as the authors acknowledge. And the model contains no
        rebound effect at all: cheaper driving usually means more driving.

  # ------------------------------------------------------------ 5 -------------
  bike-km-day:
    short:
      fr: Kilomètres à vélo
      nl: Fietskilometers
      en: Cycling per day
    question:
      fr: "Quel niveau de pratique du vélo est un objectif 2050 réaliste ?"
      nl: "Welk fietsgebruik is een realistisch doel voor 2050?"
      en: "What level of cycling is a realistic 2050 objective?"
    subtitle:
      fr: "En kilomètres par personne et par jour. Vélos classiques, électriques et speed pedelecs confondus."
      nl: "In kilometers per persoon per dag. Gewone fietsen, elektrische fietsen en speed pedelecs samen."
      en: "In kilometres per person per day. Ordinary bicycles, e-bikes and speed pedelecs together."
    tangible:
      fr: "{value} km par jour et par personne, soit {valuePerYear} km sur l'année."
      nl: "{value} km per dag per persoon, dus {valuePerYear} km op jaarbasis."
      en: "{value} km a day per person, i.e. {valuePerYear} km over a year."
    facts:
      - kind: benchmark
        text:
          fr: >
            Le pays modèle n'est pas celui qu'on croit. Les Néerlandais pédalent *2,9 km par
            personne et par jour*, mais les Danois seulement *1,5* — moins que la Belgique.
            La force du Danemark est dans la part des trajets (14,7 % en 2024), pas dans la
            distance. Seuls les Pays-Bas sont vraiment hors norme.
          nl: >
            Het voorbeeldland is niet wie je denkt. Nederlanders fietsen *2,9 km per persoon
            per dag*, maar Denen slechts *1,5* — minder dan België. De kracht van Denemarken
            zit in het aandeel van de ritten (14,7 % in 2024), niet in de afstand. Alleen
            Nederland is echt een uitschieter.
          en: >
            The model country is not the one you would expect. The Dutch cycle *2.9 km per
            person per day*, but the Danes only *1.5* — less than Belgium. Denmark's strength
            is in the share of journeys (14.7% in 2024), not in distance. Only the Netherlands
            is genuinely an outlier.
        source: "DTU, Transportvaneundersøgelsen — Annual Statistical Report Denmark 2024, tabl. 2-3 ; CBS (NL, 2023)"
        url: https://backend.orbit.dtu.dk/ws/files/400275748/TU_Denmark_2024.pdf
        chart:
          kind: bars
          unit: km/person/day
          decimals: 1
          highlight: 1
          labels:
            - {fr: Danemark, nl: Denemarken, en: Denmark}
            - {fr: Belgique, nl: België, en: Belgium}
            - {fr: Pays-Bas, nl: Nederland, en: Netherlands}
          y: [1.5, "{refValue}", 2.9]
          caption:
            fr: Kilomètres parcourus à vélo par personne et par jour (DK 2024, BE 2019, NL 2023)
            nl: Gefietste kilometers per persoon per dag (DK 2024, BE 2019, NL 2023)
            en: Cycling kilometres per person per day (DK 2024, BE 2019, NL 2023)
      - kind: structure
        text:
          fr: >
            La moyenne belge cache deux pays. En 2025, un Flamand parcourt *2,5 km par jour*
            à vélo — presque le niveau néerlandais — un Bruxellois *0,4* et un Wallon *0,2*,
            soit douze fois moins qu'en Flandre. Fixer un objectif national, c'est surtout
            décider si la Wallonie et Bruxelles rejoignent la Flandre.
          nl: >
            Het Belgische gemiddelde verbergt twee landen. In 2025 fietst een Vlaming
            *2,5 km per dag* — bijna het Nederlandse niveau — een Brusselaar *0,4* en een
            Waal *0,2*, twaalf keer minder dan in Vlaanderen. Een nationaal doel stellen is
            vooral beslissen of Wallonië en Brussel Vlaanderen bijbenen.
          en: >
            The Belgian average hides two countries. In 2025 someone in Flanders cycles
            *2.5 km a day* — nearly the Dutch level — a Brussels resident *0.4* and a Walloon
            *0.2*, twelve times less than Flanders. Setting a national target is mostly
            deciding whether Wallonia and Brussels catch up with Flanders.
        source: "SPF Mobilité, Enquête fédérale sur la mobilité 2025, tabl. 2 (adultes)"
        url: https://mobilit.belgium.be/sites/default/files/documents/publications/2026/EFM2025_update.pdf
        chart:
          kind: bars
          unit: km/person/day
          decimals: 1
          highlight: 0
          labels:
            - {fr: Flandre, nl: Vlaanderen, en: Flanders}
            - {fr: Bruxelles, nl: Brussel, en: Brussels}
            - {fr: Wallonie, nl: Wallonië, en: Wallonia}
          y: [2.5, 0.4, 0.2]
          caption:
            fr: Kilomètres à vélo par personne et par jour, par région, 2025
            nl: Fietskilometers per persoon per dag, per gewest, 2025
            en: Cycling kilometres per person per day, by region, 2025
      - kind: trend
        text:
          fr: >
            Treize ans de politique cyclable flamande n'ont pas déplacé le kilométrage. En
            Flandre, la distance parcourue à vélo oscille entre *1,3 et 1,9 km par personne et
            par jour* de 2007 à 2020, sans direction : 1,77 en 2007-08, 1,32 en 2011-12, 1,86
            en 2018-19, 1,48 en 2019-20. Ce qui progresse, c'est la *part* du vélo — parce que
            la distance totale parcourue, elle, baisse.
          nl: >
            Dertien jaar Vlaams fietsbeleid heeft de kilometers niet verzet. In Vlaanderen
            schommelt de gefietste afstand tussen *1,3 en 1,9 km per persoon per dag* van 2007
            tot 2020, zonder richting: 1,77 in 2007-08, 1,32 in 2011-12, 1,86 in 2018-19, 1,48
            in 2019-20. Wat wél stijgt is het *aandeel* van de fiets — omdat de totaal
            afgelegde afstand daalt.
          en: >
            Thirteen years of Flemish cycling policy did not move the kilometres. In Flanders
            the distance cycled wobbles between *1.3 and 1.9 km per person per day* from 2007
            to 2020 with no direction: 1.77 in 2007-08, 1.32 in 2011-12, 1.86 in 2018-19, 1.48
            in 2019-20. What does rise is cycling's *share* — because total distance travelled
            is falling.
        source: "Onderzoek Verplaatsingsgedrag Vlaanderen, analyserapport OVG 5.5, tabl. 8, 9 et 49"
        url: https://assets.vlaanderen.be/image/upload/v1608199124/Analyserapport_OVG_5.5_def2_mkh0go.pdf
        chart:
          kind: line
          unit: km/person/day
          decimals: 2
          x: [2007, 2008, 2009, 2010, 2011, 2012, 2015, 2016, 2017, 2018, 2019]
          y: [1.77, 1.68, 1.65, 1.46, 1.32, 1.50, 1.42, 1.64, 1.66, 1.86, 1.48]
          caption:
            fr: >
              Flandre : kilomètres à vélo par personne et par jour, vagues OVG 3.0 à 5.5
              (distance totale x part du vélo)
            nl: >
              Vlaanderen: fietskilometers per persoon per dag, OVG-golven 3.0 tot 5.5
              (totale afstand x fietsaandeel)
            en: >
              Flanders: cycling kilometres per person per day, OVG waves 3.0 to 5.5
              (total distance x cycling share)
      - kind: trend
        text:
          fr: >
            Le vélo électrique s'est imposé très vite : il assure {ebikeShareKm2025} % des
            *kilomètres* parcourus à vélo en 2025, mais une part bien plus faible des *trajets*
            (11 % des boucles de déplacement en 2025). L'écart est mécanique : un trajet fait
            {bikeTripKm} km à vélo classique, {ebikeTripKm} km en électrique et
            {pedelecTripKm} km en speed pedelec.
          nl: >
            De elektrische fiets zette snel door: hij dekt {ebikeShareKm2025} % van de
            fiets*kilometers* in 2025, maar een veel kleiner deel van de *ritten* (11 % van de
            verplaatsingslussen in 2025). Het verschil is mechanisch: een rit is {bikeTripKm} km
            met een gewone fiets, {ebikeTripKm} km elektrisch en {pedelecTripKm} km met een
            speed pedelec.
          en: >
            E-bikes took over fast: they carry {ebikeShareKm2025}% of cycling *kilometres* by
            2025, but a far smaller share of *journeys* (11% of trip loops in 2025). The gap is
            mechanical: a trip is {bikeTripKm} km by ordinary bike, {ebikeTripKm} km by e-bike
            and {pedelecTripKm} km by speed pedelec.
        source: "Enquêtes SPF Mobilité 2025 (EFM, fig. 3) ; nW-BE §2.2.1"
        url: https://mobilit.belgium.be/sites/default/files/documents/publications/2026/EFM2025_update.pdf
      - kind: structure
        text:
          fr: >
            Derrière l'écart régional, deux réseaux qui ne se comparent pas. La Flandre compte
            *7 712 km de pistes cyclables le long des seules routes régionales* (2023), dont
            *40,8 % jugées insuffisantes* sur leur conception — et c'est un sous-ensemble, les
            routes communales et provinciales n'y sont pas. Côté wallon, le réseau structurant
            est le *RAVeL : 1 557 km*, dont 861 km d'anciennes voies ferrées et 673 km de
            chemins de halage — un réseau largement récréatif, pas un réseau de déplacement
            quotidien.
          nl: >
            Achter de regionale kloof zitten twee netten die niet vergelijkbaar zijn.
            Vlaanderen telt *7.712 km fietspaden langs enkel de gewestwegen* (2023), waarvan
            *40,8 % onvoldoende scoort* op ontwerp — en dat is een deelverzameling, gemeente-
            en provinciewegen zitten er niet in. In Wallonië is het structurerende net het
            *RAVeL: 1.557 km*, waarvan 861 km oude spoorlijnen en 673 km jaagpaden — grotendeels
            recreatief, geen net voor dagelijkse verplaatsingen.
          en: >
            Behind the regional gap sit two networks that do not compare. Flanders has
            *7,712 km of cycle path along its regional roads alone* (2023), of which *40.8%
            score inadequate* on design — and that is a subset, with municipal and provincial
            roads left out. In Wallonia the structuring network is the *RAVeL: 1,557 km*,
            861 km of it on former railways and 673 km on towpaths — largely recreational,
            not a network for everyday travel.
        source: "Agentschap Wegen en Verkeer, Rapport Fietspaden meetjaar 2023 ; SPW, RAVeL (1 557 km)"
        url: https://wegenenverkeer.be/sites/default/files/uploads/documenten/2024-02-06%20Rapport%20Fietspaden%20meetjaar%202023.pdf
      - kind: structure
        text:
          fr: >
            La Flandre visait {flandersTripTarget} % des déplacements à vélo en 2040 ; le chiffre
            pour l'ensemble de la Belgique était proche de 10 % en 2021.
          nl: >
            Vlaanderen mikte op {flandersTripTarget} % van de verplaatsingen per fiets in 2040;
            voor heel België lag dat cijfer rond 10 % in 2021.
          en: >
            Flanders aimed for {flandersTripTarget}% of journeys by bike by 2040; the figure for
            Belgium as a whole was close to 10% in 2021.
        source: "FietsDNA 2025 / Fietsberaad Vlaanderen, via nW-BE §2.1.4"
    historyAbsent: true
    historyNote:
      fr: Le vélo n'apparaît pas dans les séries JRC-IDEES ; seule l'estimation de 2019 est disponible.
      nl: De fiets komt niet voor in de JRC-IDEES-reeksen; alleen de schatting voor 2019 is beschikbaar.
      en: Cycling does not appear in the JRC-IDEES series; only the 2019 estimate is available.
    justification:
      fr: >
        négaWatt retient {targetValue} km/jour, soit près du double de {refValue} km/jour en 2019.
        Le vélo reçoit {toBikePct} des 30 points de kilomètres-voiture reportés, et le vélo
        électrique étend le rayon d'action utile bien au-delà des 4 km du vélo classique.
      nl: >
        negaWatt kiest {targetValue} km/dag, bijna het dubbele van {refValue} km/dag in 2019. De
        fiets krijgt {toBikePct} van de 30 punten verschoven autokilometers, en de elektrische
        fiets vergroot het bruikbare bereik ver voorbij de 4 km van de gewone fiets.
      en: >
        negaWatt settles on {targetValue} km/day, close to double the {refValue} km/day of 2019.
        Cycling receives {toBikePct} of the 30 points of shifted car-kilometres, and e-bikes
        extend the useful range well beyond the 4 km of an ordinary bicycle.
    debate:
      fr: >
        Une part modale de ce niveau suppose une culture cycliste néerlandaise ou danoise. La
        revue juge cela optimiste pour une moyenne nationale, vu le relief wallon et l'habitat
        dispersé.
      nl: >
        Een modaal aandeel van dit niveau veronderstelt een Nederlandse of Deense fietscultuur.
        De review vindt dat optimistisch als nationaal gemiddelde, gezien het Waalse reliëf en de
        verspreide bebouwing.
      en: >
        A modal share at this level implies a Dutch or Danish cycling culture. The review judges
        that optimistic for a national average, given Wallonia's hills and dispersed settlement.

  # ------------------------------------------------------------ 6 -------------
  freight-tkm:
    short:
      fr: Marchandises transportées
      nl: Vervoerde goederen
      en: Goods moved
    question:
      fr: "Jusqu'où une demande sobre peut-elle ramener le transport de marchandises en 2050 ?"
      nl: "Tot hoever kan een sobere vraag het goederenvervoer in 2050 terugbrengen?"
      en: "How far can a sufficient level of demand bring freight transport down by 2050?"
    subtitle:
      fr: Une tonne-kilomètre = une tonne transportée sur un kilomètre. Route, rail, voie d'eau et fret aérien.
      nl: Eén tonkilometer = één ton over één kilometer. Weg, spoor, waterweg en luchtvracht.
      en: One tonne-kilometre = one tonne carried one kilometre. Road, rail, waterway and air freight.
    tangible:
      fr: "{value} tkm par personne et par an, soit environ {valuePerDay} tkm chaque jour."
      nl: "{value} tkm per persoon per jaar, ongeveer {valuePerDay} tkm per dag."
      en: "{value} tkm per person per year, i.e. about {valuePerDay} tkm a day."
    facts:
      - kind: trend
        text:
          fr: >
            +{growth2000to2019Pct} % entre 2000 et 2019 (de 5 548 à {refValue} tkm par personne),
            avec un pic à 7 533 en 2016 et un creux lors de la crise de 2009.
          nl: >
            +{growth2000to2019Pct} % tussen 2000 en 2019 (van 5.548 naar {refValue} tkm per
            persoon), met een piek van 7.533 in 2016 en een dal tijdens de crisis van 2009.
          en: >
            +{growth2000to2019Pct}% between 2000 and 2019 (from 5,548 to {refValue} tkm per
            person), peaking at 7,533 in 2016 and dipping in the 2009 crisis.
        source: JRC-IDEES-2023, population Statbel
        url: https://joint-research-centre.ec.europa.eu/potencia/jrc-idees_en
      - kind: structure
        text:
          fr: >
            2023 était déjà retombé à {tkm2023} tkm par personne, soit −8 % par rapport à 2019 — mais
            pour des raisons conjoncturelles (industrie faible, prix de l'énergie), pas pour les
            raisons structurelles qu'invoque un scénario de sobriété.
          nl: >
            2023 was al teruggevallen naar {tkm2023} tkm per persoon, −8 % tegenover 2019 — maar om
            conjuncturele redenen (zwakke industrie, energieprijzen), niet om de structurele
            redenen die een soberheidsscenario aanvoert.
          en: >
            2023 had already fallen back to {tkm2023} tkm per person, −8% against 2019 — but for
            cyclical reasons (weak industry, energy prices), not the structural ones a
            sufficiency scenario invokes.
        source: JRC-IDEES-2023, via nW-BE §1.2.2
      - kind: structure
        text:
          fr: >
            Une partie de ce trafic n'est pas de la consommation belge : en 2019, 58,6 % des
            tonnes-kilomètres des poids lourds relevaient du transport international et 41,4 % du
            transport intérieur.
          nl: >
            Een deel van dit verkeer is geen Belgische consumptie: in 2019 was 58,6 % van de
            tonkilometers van zware vrachtwagens internationaal vervoer en 41,4 % binnenlands.
          en: >
            Part of this traffic is not Belgian consumption at all: in 2019, 58.6% of heavy-truck
            tonne-kilometres were international transport and 41.4% domestic.
        source: JRC-IDEES-2023, via nW-BE §3.2.1
      - kind: tangible
        text:
          fr: >
            {refValue} tkm par an et par personne en 2019, c'est environ 19 tkm par jour : un
            colis de 20 kg qui voyagerait 960 km, chaque jour, pour chaque habitant.
          nl: >
            {refValue} tkm per jaar per persoon in 2019 is ongeveer 19 tkm per dag: een pakje van
            20 kg dat elke dag 960 km aflegt, voor elke inwoner.
          en: >
            {refValue} tkm per person per year in 2019 is about 19 tkm a day: a 20 kg parcel
            travelling 960 km, every day, for every inhabitant.
        source: nW-BE, valeur 2019
    justification:
      fr: >
        négaWatt retient {targetValue} tkm par personne, soit {changePct} % par rapport à 2019.
        La justification tient à une baisse de la consommation de biens matériels, à la
        relocalisation d'une partie de la production et au développement des circuits courts.
        L'intensité s'était de fait stabilisée autour de 7 000 tkm avant 2019, et 2023 est déjà
        repassé sous la cible — pour des raisons conjoncturelles.
      nl: >
        negaWatt kiest {targetValue} tkm per persoon, dus {changePct} % ten opzichte van 2019.
        De onderbouwing: minder consumptie van materiële goederen, gedeeltelijke relokalisatie
        van de productie en de opkomst van korte ketens. De intensiteit was voor 2019 feitelijk
        gestabiliseerd rond 7.000 tkm, en 2023 zit al onder de doelstelling — om conjuncturele
        redenen.
      en: >
        negaWatt settles on {targetValue} tkm per person, i.e. {changePct}% against 2019. The
        justification rests on lower consumption of material goods, partial relocalisation of
        production and the growth of short supply chains. The intensity had in fact levelled off
        around 7,000 tkm before 2019, and 2023 is already below the target — for cyclical
        reasons.
    debate:
      fr: >
        La revue souligne que l'intensité du fret dépend de la structure du PIB et des flux
        commerciaux, largement hors de portée d'une politique nationale — et que le même −10 %
        rond sert ici à quatre choses différentes dans le scénario.
      nl: >
        De review benadrukt dat de vrachtintensiteit afhangt van de bbp-structuur en de
        handelsstromen, grotendeels buiten het bereik van nationaal beleid — en dat dezelfde ronde
        −10 % in het scenario voor vier verschillende dingen wordt gebruikt.
      en: >
        The review stresses that freight intensity is driven by GDP structure and trade patterns,
        largely beyond the reach of domestic policy — and that the same round −10% is used for
        four different things in the scenario.

  truck-share:
    short:
      fr: Part de la route (fret)
      nl: Aandeel van de weg (vracht)
      en: Road share of freight
    question:
      fr: "Quelle part de la route dans les tonnes-kilomètres est un objectif 2050 réaliste ?"
      nl: "Welk aandeel van de weg in de tonkilometers is een realistisch doel voor 2050?"
      en: "What road share of tonne-kilometres is a realistic 2050 objective?"
    subtitle:
      fr: >
        Le reste passe par le rail, la voie d'eau et une petite part de fret aérien
        ({airShareTkm2019} % des tonnes-kilomètres en 2019) — que personne ne cherche à faire
        croître, l'avion étant de loin le mode le plus gourmand.
      nl: >
        De rest gaat via het spoor, de waterweg en een klein deel luchtvracht
        ({airShareTkm2019} % van de tonkilometers in 2019) — dat niemand wil zien groeien, want
        het vliegtuig is veruit de meest energie-intensieve modus.
      en: >
        The rest goes by rail, inland waterway and a small share of air freight
        ({airShareTkm2019}% of tonne-kilometres in 2019) — which nobody is trying to grow, air
        being by far the most energy-hungry mode.
    tangible:
      fr: "{value} % par la route — le reste par le rail et la voie d'eau."
      nl: "{value} % over de weg — de rest via spoor en water."
      en: "{value}% by road — the rest by rail and water."
    facts:
      - kind: trend
        text:
          fr: >
            La Belgique va dans l'autre sens : la part de la route est remontée de
            {refValue} % en 2019 à 68,6 % en 2023, après un maximum de 74,2 % en 2009. Le trafic
            fluvial avait culminé à {navPeak2017} tkm par personne en 2017 ; il était à
            {nav2023} en 2023.
          nl: >
            België gaat de andere kant op: het aandeel van de weg steeg weer van {refValue} % in
            2019 naar 68,6 % in 2023, na een maximum van 74,2 % in 2009. Het riviervervoer piekte
            op {navPeak2017} tkm per persoon in 2017; in 2023 was dat {nav2023}.
          en: >
            Belgium is heading the other way: road's share climbed back from {refValue}% in 2019
            to 68.6% in 2023, after a high of 74.2% in 2009. Barge traffic peaked at
            {navPeak2017} tkm per person in 2017; it was {nav2023} in 2023.
        source: "JRC-IDEES-2023; nW-BE §3.1.3"
        url: https://joint-research-centre.ec.europa.eu/potencia/jrc-idees_en
      - kind: benchmark
        text:
          fr: >
            La Suisse déplace 34,3 % de ses tonnes-kilomètres intérieures par le rail, l'Autriche
            29,3 % ; les Pays-Bas en déplacent 40,9 % par voie d'eau. Belgique : 11,7 % rail,
            10,7 % eau. La moyenne UE pour la route est de 78,1 % et augmente.
          nl: >
            Zwitserland vervoert 34,3 % van zijn binnenlandse tonkilometers per spoor, Oostenrijk
            29,3 %; Nederland 40,9 % over water. België: 11,7 % spoor, 10,7 % water. Het
            EU-gemiddelde voor de weg is 78,1 % en stijgt.
          en: >
            Switzerland moves 34.3% of its inland tonne-kilometres by rail and Austria 29.3%; the
            Netherlands moves 40.9% by water. Belgium: 11.7% rail, 10.7% water. The EU average road
            share is 78.1% and rising.
        source: "Eurostat tran_hv_frmod, 2023"
        url: https://ec.europa.eu/eurostat/databrowser/view/tran_hv_frmod/default/table?lang=en
        chart:
          kind: bars
          unit: "% of tonne-km"
          decimals: 1
          highlight: 2
          labels:
            - {fr: Suisse, nl: Zwitserland, en: Switzerland}
            - {fr: Autriche, nl: Oostenrijk, en: Austria}
            - {fr: Belgique, nl: België, en: Belgium}
          y: [34.3, 29.3, 11.7]
          caption:
            fr: Part du rail dans les tonnes-kilomètres intérieures, 2023
            nl: Aandeel van het spoor in de binnenlandse tonkilometers, 2023
            en: Rail share of inland tonne-kilometres, 2023
      - kind: caution
        text:
          fr: >
            Baisser cette part n'est utile que si les tonnes vont vers le rail ou la voie d'eau.
            En 2050 un poids lourd électrique demande {truckKwhPerTkm:d2} kWh par tonne-kilomètre,
            une péniche {bargeKwhPerTkm:d2} et un train {railKwhPerTkm:d2} — mais le *fret aérien*
            en demande {airKwhPerTkm:d2}, soit huit fois un camion. Reporter vers l'avion ferait
            *monter* la consommation, pas descendre : seul le rail économise vraiment, la voie
            d'eau est aujourd'hui plus gourmande que le camion électrique.
          nl: >
            Dit aandeel verlagen helpt alleen als de tonnen naar het spoor of het water gaan. In
            2050 vraagt een elektrische vrachtwagen {truckKwhPerTkm:d2} kWh per tonkilometer, een
            binnenschip {bargeKwhPerTkm:d2} en een trein {railKwhPerTkm:d2} — maar *luchtvracht*
            vraagt {airKwhPerTkm:d2}, acht keer zoveel als een vrachtwagen. Verschuiven naar het
            vliegtuig doet het verbruik *stijgen*, niet dalen: alleen het spoor bespaart echt, de
            waterweg is vandaag zwaarder dan de elektrische vrachtwagen.
          en: >
            Bringing this share down only helps if the tonnes go to rail or water. By 2050 an
            electric heavy truck needs {truckKwhPerTkm:d2} kWh per tonne-kilometre, a barge
            {bargeKwhPerTkm:d2} and a train {railKwhPerTkm:d2} — but *air freight* needs
            {airKwhPerTkm:d2}, eight times a truck. Shifting to aircraft would push energy demand
            *up*, not down: only rail really saves, and the waterway is heavier than the
            electrified truck.
        source: nW-BE, calcul 2050
        chart:
          kind: bars
          unit: kWh/tkm
          decimals: 2
          highlight: 3
          labels:
            - {fr: Train, nl: Trein, en: Train}
            - {fr: Camion, nl: Vrachtwagen, en: Truck}
            - {fr: Péniche, nl: Binnenschip, en: Barge}
            - {fr: Avion, nl: Vliegtuig, en: Aircraft}
          y: ["{railKwhPerTkm}", "{truckKwhPerTkm}", "{bargeKwhPerTkm}", "{airKwhPerTkm}"]
          caption:
            fr: Énergie par tonne-kilomètre en 2050, par mode
            nl: Energie per tonkilometer in 2050, per modus
            en: Energy per tonne-kilometre in 2050, by mode
      - kind: structure
        reveal: true
        text:
          fr: >
            Le report est entièrement dirigé : {toRailPct} points de tonnes-kilomètres des poids
            lourds partent vers le rail et {toWaterPct} vers les voies navigables. Rien ne va au
            fret aérien, qui garde ses {airShareTkm2019} % du total de 2019 et reste dans le
            dénominateur de cette part. Les camionnettes ne sont pas touchées non plus.
          nl: >
            De verschuiving is volledig gestuurd: {toRailPct} punten tonkilometers van zware
            vrachtwagens gaan naar het spoor en {toWaterPct} naar de waterwegen. Niets gaat naar
            luchtvracht, die zijn {airShareTkm2019} % van het totaal van 2019 behoudt en in de
            noemer van dit aandeel blijft. Bestelwagens worden evenmin geraakt.
          en: >
            The shift is fully directed: {toRailPct} points of heavy-truck tonne-kilometres go to
            rail and {toWaterPct} to inland waterways. Nothing goes to air freight, which keeps
            its {airShareTkm2019}% of the 2019 total and stays in the denominator of this share.
            Light commercial vehicles are untouched as well.
        source: nW-BE §3.1.1
    justification:
      fr: >
        négaWatt retient {targetValue} % par la route. {shiftPct} % des tonnes-kilomètres des
        poids lourds sont reportés : {toRailPct} points vers le rail et {toWaterPct} vers les voies
        navigables, un réseau dont la Belgique est exceptionnellement bien dotée. En 2019 la route
        représentait {refValue} % du total.
      nl: >
        negaWatt kiest {targetValue} % over de weg. {shiftPct} % van de tonkilometers van zware
        vrachtwagens wordt verschoven: {toRailPct} punten naar het spoor en {toWaterPct} naar de
        waterwegen, een net waarover België uitzonderlijk goed beschikt. In 2019 was de weg
        {refValue} % van het totaal.
      en: >
        negaWatt settles on {targetValue}% by road. {shiftPct}% of heavy-truck tonne-kilometres are
        shifted: {toRailPct} points to rail and {toWaterPct} to inland waterways, a network Belgium
        is exceptionally well endowed with. In 2019 road accounted for {refValue}% of the total.
    debate:
      fr: >
        Le fret ferroviaire belge est en déclin, pas en croissance, et l'écart de 60 % entre les
        sources sur les tonnes-kilomètres routières laisse planer un doute sur l'ampleur même de
        l'exercice.
      nl: >
        Het Belgische spoorvervoer krimpt, het groeit niet, en het verschil van 60 % tussen de
        bronnen over de tonkilometers over de weg laat twijfel bestaan over de omvang van de
        oefening zelf.
      en: >
        Belgian rail freight is declining, not growing, and the 60% gap between sources on road
        tonne-kilometres leaves doubt about the very magnitude of the exercise.

  # ------------------------------------------------------------ 8 -------------
  truck-load:
    short:
      fr: Charge des camions
      nl: Vrachtwagenlading
      en: Truck payload
    question:
      fr: "Quelle charge moyenne des camions est un objectif 2050 réaliste ?"
      nl: "Welke gemiddelde vrachtwagenlading is een realistisch doel voor 2050?"
      en: "What average truck load is a realistic 2050 objective?"
    subtitle:
      fr: "Tous trajets confondus, retours à vide inclus. C'est cette moyenne qui détermine l'énergie consommée."
      nl: "Over alle ritten samen, leegritten inbegrepen. Dat gemiddelde bepaalt het energieverbruik."
      en: "Across all trips, empty runs included. That average is what drives the energy use."
    tangible:
      fr: "{value} tonnes par camion, en moyenne sur tous les trajets."
      nl: "{value} ton per vrachtwagen, gemiddeld over alle ritten."
      en: "{value} tonnes per truck, averaged over every trip."
    facts:
      - kind: benchmark
        text:
          fr: >
            En 2024, 21,6 % des kilomètres parcourus par les véhicules de fret routier dans l'UE
            l'ont été à vide : 25,9 % en transport national, 13,1 % en international.
          nl: >
            In 2024 werd 21,6 % van de kilometers van vrachtvoertuigen in de EU leeg gereden:
            25,9 % bij binnenlands vervoer, 13,1 % bij internationaal.
          en: >
            In 2024, 21.6% of the distance travelled by road freight vehicles in the EU was run
            empty: 25.9% for national transport, 13.1% for international.
        source: "Eurostat, Road freight transport by journey characteristics"
        url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Road_freight_transport_by_journey_characteristics
      - kind: structure
        reveal: true
        text:
          fr: >
            négaWatt ne retient que +{gainPct} % sur ce chiffre à l'horizon 2050 — l'une des
            hypothèses les plus prudentes de tout le volet transport. Il n'existe pas de levier
            distinct pour les retours à vide.
          nl: >
            negaWatt houdt het op slechts +{gainPct} % voor 2050 — een van de voorzichtigste
            veronderstellingen van het hele transportluik. Er is geen aparte hefboom voor
            leegritten.
          en: >
            negaWatt assumes only +{gainPct}% on this figure by 2050 — one of the most
            conservative assumptions in the whole transport scenario. There is no separate lever
            for empty running.
        source: nW-BE §3.3.3
      - kind: structure
        text:
          fr: >
            En 2019, le poids lourd belge moyen transportait {refValue} tonnes tous trajets
            confondus — retours à vide inclus. C'est cette moyenne-là qui compte pour l'énergie,
            pas la capacité maximale du camion.
          nl: >
            In 2019 vervoerde de gemiddelde Belgische zware vrachtwagen {refValue} ton over alle
            ritten samen — leegritten inbegrepen. Dat gemiddelde bepaalt het energieverbruik,
            niet de maximale capaciteit van de vrachtwagen.
          en: >
            In 2019 the average Belgian heavy truck carried {refValue} tonnes across all trips,
            empty runs included. That average is what drives the energy use, not the truck's
            maximum capacity.
        source: JRC-IDEES-2023, via nW-BE §3.1
      - kind: structure
        text:
          fr: >
            Où est le plafond ? En Belgique, un semi-remorque à cinq essieux est limité à
            *44 tonnes tout compris*, dont environ 15 tonnes de véhicule : il reste
            *29 tonnes de charge utile*. Même si chaque camion chargé partait plein, avec
            un kilomètre sur cinq parcouru à vide la moyenne tous trajets confondus
            plafonnerait autour de *23 tonnes*. La valeur d'aujourd'hui en est à peine la
            moitié.
          nl: >
            Waar ligt het plafond? In België is een oplegger met vijf assen beperkt tot
            *44 ton in totaal*, waarvan ongeveer 15 ton voertuig: er blijft *29 ton laadvermogen*
            over. Zelfs als elke geladen vrachtwagen vol vertrok, zou het gemiddelde over alle
            ritten bij één lege kilometer op vijf rond *23 ton* stranden. De waarde van vandaag
            is daar amper de helft van.
          en: >
            Where is the ceiling? In Belgium a five-axle articulated lorry is limited to
            *44 tonnes all in*, of which roughly 15 tonnes is the vehicle itself, leaving
            *29 tonnes of payload*. Even if every laden truck left full, with one kilometre in
            five run empty the all-trips average would top out around *23 tonnes*. Today's
            value is barely half that.
        source: "Directive 96/53/CE et art. 32bis du règlement technique belge (44 t) ; tare de 15 t : étude d-fine pour CER/UIC/UIRR, 2024, p. 20-24"
        url: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:01996L0053-20190814
        chart:
          kind: bars
          unit: tonnes
          decimals: 1
          highlight: 0
          labels:
            - {fr: "Aujourd'hui", nl: Vandaag, en: Today}
            - {fr: "Camions chargés (UE)", nl: "Geladen (EU)", en: "Laden trucks (EU)"}
            - {fr: "Plafond, 20 % à vide", nl: "Plafond, 20 % leeg", en: "Ceiling, 20 % empty"}
            - {fr: "Charge utile maximale", nl: Maximaal laadvermogen, en: Maximum payload}
          y: ["{refValue}", 14.4, 23.0, 29.0]
          caption:
            fr: >
              Tonnes par camion : la valeur d'aujourd'hui face à la limite légale de charge utile
            nl: >
              Ton per vrachtwagen: de waarde van vandaag tegenover de wettelijke laadlimiet
            en: >
              Tonnes per truck: today's value against the legal payload limit
      - kind: caution
        text:
          fr: >
            Ces 29 tonnes sont une borne haute sur une borne haute. Elles valent pour un
            semi-remorque de 44 t ; le parc contient aussi des porteurs rigides, dont la charge
            utile est bien plus faible, et des remorques lourdes (citernes, frigorifiques,
            porte-voitures) dont la tare dépasse 15 tonnes. Le vrai plafond du parc belge est
            donc *plus bas* — de combien, aucune source consultée ne le dit.
          nl: >
            Die 29 ton is een bovengrens op een bovengrens. Ze geldt voor een oplegger van 44 t;
            het wagenpark bevat ook bakwagens met een veel kleiner laadvermogen, en zware
            opleggers (tankwagens, koelwagens, autotransporters) met een tarra boven 15 ton. Het
            echte plafond van het Belgische park ligt dus *lager* — hoeveel lager zegt geen van
            de geraadpleegde bronnen.
          en: >
            Those 29 tonnes are an upper bound on an upper bound. They apply to a 44 t
            articulated lorry; the fleet also contains rigid trucks, whose payload is far
            smaller, and heavy trailer types (tankers, refrigerated, car transporters) whose
            tare exceeds 15 tonnes. The real ceiling for the Belgian fleet is therefore *lower*
            — by how much, none of the sources consulted says.
        source: nW-BE, lecture des sources Eurostat et d-fine
      - kind: caution
        text:
          fr: >
            Ce levier mélange deux choses que le modèle ne sait pas séparer : le taux de
            remplissage d'un camion chargé, et la fréquence des retours à vide.
          nl: >
            Deze hefboom mengt twee zaken die het model niet kan scheiden: de vullingsgraad van een
            geladen vrachtwagen, en hoe vaak er leeg wordt gereden.
          en: >
            This lever mixes two things the model cannot separate: how full a loaded truck is, and
            how often trucks run empty.
        source: nW-BE §3.3.3
      - kind: tangible
        text:
          fr: >
            Voilà pourquoi ce plafond est hors d'atteinte : le camion est souvent rempli par le
            volume, pas par la masse. Une remorque standard de 100 m³ chargée de marchandises
            légères — à 72 kg par m³, ce qui est courant — ne pèse que *7,2 tonnes* une fois
            pleine à ras bord, soit un quart de sa capacité en poids. Et la densité moyenne du
            fret *baisse*, à mesure que les plastiques remplacent les matériaux lourds et que
            l'emballage augmente.
          nl: >
            Daarom is dat plafond onbereikbaar: een vrachtwagen wordt vaak door volume gevuld,
            niet door gewicht. Een standaardoplegger van 100 m³ met lichte goederen — 72 kg per
            m³, wat gangbaar is — weegt tot de nok gevuld slechts *7,2 ton*, een kwart van zijn
            gewichtscapaciteit. En de gemiddelde dichtheid van vracht *daalt*, naarmate kunststof
            zwaardere materialen vervangt en er meer verpakking bijkomt.
          en: >
            This is why that ceiling is out of reach: a truck is often filled by volume, not by
            weight. A standard 100 m³ trailer of light goods — at 72 kg per m³, which is
            ordinary — weighs only *7.2 tonnes* when packed to the roof, a quarter of its weight
            capacity. And the average density of freight is *falling*, as plastics replace
            heavier materials and packaging grows.
        source: "Étude d-fine pour CER/UIC/UIRR, 2024, fig. 9 et note 27 ; McKinnon pour l'ACEA, 2010, p. 5"
        url: https://uic.org/IMG/pdf/study_weightsdimensions_-_phase_ii_v1_1-2.pdf
    historyAbsent: true
    historyNote:
      fr: La charge moyenne des camions n'est pas disponible en série historique dans les données du projet.
      nl: De gemiddelde vrachtwagenlading is niet als historische reeks beschikbaar in de projectdata.
      en: Average truck load is not available as a historical series in the project's data.
    justification:
      fr: >
        négaWatt retient {targetValue} tonnes, contre {refValue} en 2019, soit +{gainPct} %. C'est
        une hypothèse volontairement modeste : mieux remplir les camions suppose de mutualiser les
        chargements entre chargeurs concurrents. L'énergie des poids lourds tombe malgré tout à
        {truckTwhTarget} TWh en 2050, surtout grâce à l'électrification.
      nl: >
        negaWatt kiest {targetValue} ton, tegenover {refValue} in 2019, dus +{gainPct} %. Een
        bewust bescheiden veronderstelling: vrachtwagens beter vullen vereist het bundelen van
        ladingen tussen concurrerende verladers. De energie van zware vrachtwagens daalt toch naar
        {truckTwhTarget} TWh in 2050, vooral door elektrificatie.
      en: >
        negaWatt settles on {targetValue} tonnes, against {refValue} in 2019, i.e. +{gainPct}%. It
        is a deliberately modest assumption: filling trucks better means pooling loads between
        competing shippers. Heavy-truck energy still falls to {truckTwhTarget} TWh by 2050, mostly
        thanks to electrification.
    debate:
      fr: >
        Avec un cinquième des kilomètres parcourus à vide en Europe, on peut trouver +5 % très
        timide. À l'inverse, la mutualisation des chargements se heurte depuis trente ans au
        secret commercial et à la fragmentation du secteur.
      nl: >
        Met een vijfde van de kilometers leeg in Europa kan +5 % erg voorzichtig lijken. Anderzijds
        stuit het bundelen van ladingen al dertig jaar op bedrijfsgeheim en de versnippering van de
        sector.
      en: >
        With a fifth of European vehicle-kilometres run empty, +5% can look very timid. On the other
        hand, pooling loads has run into commercial confidentiality and a fragmented sector for
        thirty years.
