<!-- negaWatt Belgium — workshop reveal screen (the projector).
     The first page picks which answers to show — a date filter, today by
     default, everything if you widen it — and counts them live. The questions
     follow, one lever at a time: group answers live, then the negaWatt value
     with its written justification. The overview recalls the filter. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mise en commun — négaWatt Belgium workshop</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/workshop.css">

<body class="ws-body">
<div class="ws-shell ws-wide">

  <div class="ws-topbar">
    <span class="ws-topbar__brand">
      <img src="../assets/img/nW_BE_logo_square.png" alt="négaWatt Belgium">
      <span data-ui="reveal.title"></span>
    </span>
    <span class="ws-topbar__spacer"></span>
    <!-- the window on screen; a click goes back to the first page, which sets it -->
    <button type="button" class="ws-badge ws-badge--button" id="window-badge"></button>
    <span class="ws-badge ws-badge--quiet" id="live-badge"></span>
    <div class="ws-lang" id="lang-switch" role="group"></div>
  </div>

  <!-- The first page: which answers are on screen, and how many there are. Set
       once here, so the question pages can give the projector to the answers. -->
  <main class="ws-main" id="screen-setup">
    <div>
      <p class="ws-eyebrow" id="setup-topic"></p>
      <h1 class="ws-question" data-ui="reveal.setup.title"></h1>
      <p class="ws-subtitle" data-ui="reveal.setup.lead"></p>
    </div>

    <div class="ws-panel">
      <div class="ws-filter" id="filter">
        <span class="ws-filter__label" data-ui="reveal.filter.label"></span>
        <span class="ws-filter__range">
          <input class="ws-input ws-filter__date" type="date" id="from">
          <span class="ws-filter__dash">–</span>
          <input class="ws-input ws-filter__date" type="date" id="to">
        </span>
        <button class="ws-btn ws-btn--ghost ws-filter__preset" id="preset-today"
                data-ui="reveal.filter.today"></button>
        <button class="ws-btn ws-btn--ghost ws-filter__preset" id="preset-all"
                data-ui="reveal.filter.all"></button>
      </div>

      <!-- follows the answers as they arrive: the page polls every 3 seconds -->
      <div class="ws-count">
        <p class="ws-count__num" id="count-answers" aria-live="polite"></p>
        <p class="ws-count__meta">
          <span data-ui="reveal.count.scope"></span> ·
          <span id="count-groups"></span> ·
          <span class="ws-live" id="count-live"></span>
        </p>
      </div>
    </div>
  </main>

  <main class="ws-main ws-hidden" id="screen-lever">
    <div class="ws-progress">
      <span class="ws-progress__label" id="progress-label"></span>
      <span class="ws-topbar__spacer"></span>
      <span id="progress-dots" style="display:flex;gap:6px"></span>
    </div>

    <div>
      <p class="ws-eyebrow" id="topic-title"></p>
      <h1 class="ws-question" id="question"></h1>
      <p class="ws-subtitle" id="subtitle"></p>
    </div>

    <div class="ws-chart">
      <div class="ws-dots" id="dots" style="min-height:182px"></div>
      <div class="ws-chart__legend" id="dots-legend"></div>
    </div>

    <div class="ws-stat" id="stats"></div>

    <div class="ws-panel ws-hidden" id="nw-panel">
      <h2 data-ui="reveal.why"></h2>
      <p id="justification"></p>
      <div class="ws-note ws-note--warn" id="debate-box">
        <strong data-ui="reveal.debate"></strong>
        <p id="debate" style="margin:6px 0 0"></p>
      </div>
      <p id="verdict" style="margin-top:12px;font-weight:700"></p>
      <div class="ws-facts__grid" id="reveal-facts" style="margin-top:14px"></div>
    </div>

    <section class="ws-hidden" id="conditions-box">
      <h2 style="font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)"
          data-ui="reveal.conditions"></h2>
      <div id="conditions"></div>
    </section>
  </main>

  <main class="ws-main ws-hidden" id="screen-summary">
    <h1 class="ws-question" data-ui="reveal.summary"></h1>
    <!-- the filter of the first page, recalled where the totals are read -->
    <p class="ws-recap">
      <span class="ws-filter__label" data-ui="reveal.recap"></span>
      <span id="recap-text"></span>
      <button type="button" class="ws-linkbtn" id="recap-change"
              data-ui="reveal.filter.change"></button>
    </p>
    <div class="ws-scroll">
      <table class="ws-table" id="summary-table"></table>
    </div>
    <div class="ws-stat" id="awards" style="margin-top:18px"></div>
  </main>

  <main class="ws-main ws-hidden" id="screen-error">
    <div class="ws-note ws-note--warn" id="error-text"></div>
  </main>

  <div class="ws-actions" id="actions">
    <button class="ws-btn ws-btn--ghost" id="btn-prev" data-ui="reveal.prev"></button>
    <button class="ws-btn ws-btn--amber" id="btn-reveal" data-ui="reveal.show"></button>
    <button class="ws-btn ws-btn--ghost" id="btn-next" data-ui="reveal.next"></button>
  </div>
</div>

<!-- One file per sector; a topic names its sector in workshop_content.js.
     Add a line here when a new sector gets a workshop topic. -->
<script src="../data/levers_transport.js"></script>
<script src="../data/levers_buildings.js"></script>
<script src="../data/history_transport.js"></script>
<script src="../data/history_buildings.js"></script>
<script src="../data/workshop_content.js"></script>
<script src="../assets/js/workshop/i18n.js"></script>
<script src="../assets/js/workshop/spark.js"></script>
<script src="../assets/js/workshop/impact.js"></script>
<script src="../assets/js/workshop/api.js"></script>
<script src="../assets/js/workshop/reveal.js"></script>
</body>
